<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FSL Thinking Check</title>
<meta name="description" content="Future Star League Thinking Check: 4 Arenas, 16 hands-on challenges in Hindi and English. Find your Superpower.">
<meta name="theme-color" content="#FF6B1A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-column game console (max 760px). Screens: language → profile → Arena path → challenge (SVG stage + controls) → Star Card */
:root {
  --bg: #EEF5FB; --surface: #FFFFFF; --ink: #13233A; --muted: #55657C; --line: #D3DEEA;
  --sky: #F6FAFF; --ground: #B9C9A0; --water: #8ACDF2; --wood: #C98A4B; --metal: #8A97A8; --paper: #FFFFFF;
  --sun: #FFC93C; --brand: #FF6B1A; --brand-deep: #B84400; --good: #1E9E5A; --bad: #D93A3A;
  --good-soft: #E1F5EA; --bad-soft: #FBE5E5; --shadow: 0 3px 0 #C3D2E2;
  --lab: #00A3C4; --logic: #6C4BD8; --bazaar: #D9772B; --mission: #2E8B57; --speed: #E5452B;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Baloo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1626; --surface: #16233A; --ink: #EAF1FA; --muted: #9DB0C8; --line: #2A3B57;
  --sky: #10203A; --ground: #3F5A3A; --water: #2E77A8; --wood: #9A6634; --metal: #6F7E92; --paper: #DCE6F2;
  --good-soft: #143826; --bad-soft: #3E1A1E; --shadow: 0 3px 0 #08101C; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0D1626; --surface: #16233A; --ink: #EAF1FA; --muted: #9DB0C8; --line: #2A3B57;
  --sky: #10203A; --ground: #3F5A3A; --water: #2E77A8; --wood: #9A6634; --metal: #6F7E92; --paper: #DCE6F2;
  --good-soft: #143826; --bad-soft: #3E1A1E; --shadow: 0 3px 0 #08101C; color-scheme: dark;
}
html[lang="hi"] { --body: "Baloo 2", "Nirmala UI", "Noto Sans Devanagari", system-ui, sans-serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
html[lang="hi"] body { font-size: 17px; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.badge { font-family: var(--display); font-weight: 800; font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
  background: var(--brand); color: #fff; padding: 4px 12px; border-radius: 999px; }
.top-right { display: flex; gap: 8px; align-items: center; }
.pill { font-weight: 800; font-size: 13px; border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; color: var(--ink); }
.pill.net { color: var(--muted); }
.pill.net.off { color: var(--bad); border-color: var(--bad); }
.hero { margin-block: 18px 18px; display: grid; gap: 8px; }
.hero h1 { font-size: clamp(32px, 8vw, 48px); font-weight: 800; }
.hero h1 span { color: var(--brand); }
.hero p { color: var(--muted); max-width: 58ch; }

.langs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 8px; }
.lang-card { text-align: left; background: var(--surface); border: 3px solid var(--line); border-radius: 20px; padding: 18px 20px; box-shadow: var(--shadow); display: grid; gap: 2px; }
.lang-card:hover { border-color: var(--brand); }
.lang-card b { font-family: var(--display); font-size: 34px; font-weight: 800; line-height: 1.1; }
.lang-card span { color: var(--muted); font-weight: 700; }

.form { display: grid; gap: 16px; margin-top: 6px; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lbl-h { font-weight: 800; }
.field input[type=text] { font: inherit; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; }
.grades { display: flex; gap: 8px; flex-wrap: wrap; }
.grades button { min-width: 64px; }
.consent { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.consent input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--brand); flex: none; }
.consent small { display: block; color: var(--muted); font-size: 13px; }
.hint { font-size: 13px; color: var(--muted); }

.path { display: grid; gap: 12px; margin-top: 6px; }
.stop { display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: center; background: var(--surface); border: 2px solid var(--line);
  border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); }
.stop.locked { opacity: .6; box-shadow: none; }
.stop.now { border-color: var(--c); border-width: 3px; }
.stop .num { width: 52px; height: 52px; border-radius: 14px; background: var(--c); display: grid; place-items: center; }
.stop .num svg { width: 30px; height: 30px; }
.stop h3 { font-size: 21px; font-weight: 800; }
.stop .skill { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
.stop .state { font-weight: 800; font-size: 14px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.stop .state.done { color: var(--good); }
@media (max-width: 460px) { .stop { grid-template-columns: 44px 1fr; } .stop .num { width: 44px; height: 44px; } .stop .state { grid-column: 2; text-align: left; } }

.actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; align-items: center; }
.btn { font-family: var(--display); font-weight: 800; font-size: 18px; border: 0; border-radius: 14px; padding: 10px 20px;
  background: var(--brand); color: #fff; box-shadow: 0 4px 0 var(--brand-deep); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--brand-deep); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 2px solid var(--line); box-shadow: var(--shadow); }
.btn.wa { background: #1E9E5A; box-shadow: 0 4px 0 #126A3B; }
.btn.sm { font-size: 15px; padding: 7px 14px; }
.btn.on { background: var(--c, var(--brand)); color: #fff; border-color: transparent; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.linkish { background: none; border: 0; padding: 0; font-weight: 800; color: var(--muted); text-decoration: underline; font-size: 14px; }
.note { font-size: 13px; color: var(--muted); margin-top: 16px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--c); color: #fff;
  border-radius: 16px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.glyph { width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,.2); display: grid; place-items: center; flex: none; }
.glyph svg { width: 22px; height: 22px; }
.bar h2 { font-size: 22px; font-weight: 800; flex: 1 1 auto; }
.bar .meta { font-weight: 800; font-variant-numeric: tabular-nums; }
.bar .quit { background: rgba(255,255,255,.2); border: 0; border-radius: 10px; padding: 4px 10px; font-weight: 800; color: #fff; }
.dots { display: flex; gap: 6px; margin: 14px 0 10px; }
.dot { flex: 1; height: 8px; border-radius: 99px; background: var(--line); }
.dot.done { background: var(--c); opacity: .55; } .dot.now { background: var(--c); }
.timer-row { display: flex; align-items: center; gap: 10px; font-weight: 800; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
.timer { flex: 1; height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: var(--c); transform-origin: left; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 18px; margin-top: 14px; box-shadow: var(--shadow); }
.story { font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
.q { font-family: var(--display); font-size: clamp(19px, 4.2vw, 23px); font-weight: 700; margin-top: 4px; }
.play { margin-top: 12px; display: grid; gap: 12px; }
.stage { width: 100%; height: auto; display: block; background: var(--sky); border-radius: 14px; border: 2px solid var(--line);
  touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ctrl label { font-weight: 800; font-size: 14px; }
.ctrl input[type=range] { flex: 1 1 180px; min-width: 0; accent-color: var(--c); height: 28px; }
.msg { font-weight: 800; min-height: 1.5em; font-size: 15px; }
.msg.good { color: var(--good); } .msg.bad { color: var(--bad); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--bg);
  font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.rows { display: grid; gap: 8px; width: 100%; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row .nm { flex: 1 1 120px; font-weight: 800; }
@media (max-width: 460px) { .row .nm { flex-basis: 100%; } }
.clues { display: grid; gap: 4px; font-weight: 700; font-size: 15px; }
.lbl { fill: var(--ink); font: 700 12px var(--body); pointer-events: none; }
.lbl.sm { font-size: 10.5px; } .lbl.big { font: 800 22px var(--display); }
.tap { cursor: pointer; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.shake { animation: shake .3s 2; }
.explain { margin-top: 14px; border-radius: 14px; padding: 14px 16px; border: 2px dashed var(--c); display: grid; gap: 6px; }
.explain h4 { margin: 0; font-family: var(--display); font-size: 19px; }
.next-row { display: flex; justify-content: flex-end; margin-top: 14px; }

.intro { display: grid; gap: 12px; margin-top: 16px; }
.intro .big-glyph { width: 72px; height: 72px; border-radius: 20px; background: var(--c); display: grid; place-items: center; }
.intro .big-glyph svg { width: 42px; height: 42px; }
.intro ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; font-weight: 700; }
.feel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.feel button { background: var(--surface); border: 3px solid var(--line); border-radius: 16px; padding: 14px 8px; font-family: var(--display); font-weight: 800; font-size: 19px; box-shadow: var(--shadow); }
.feel button:hover { border-color: var(--c); }
.feel button small { display: block; font-family: var(--body); font-weight: 700; font-size: 12px; color: var(--muted); }

.result-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 14px; align-items: start; }
@media (max-width: 640px) { .result-grid { grid-template-columns: 1fr; } }
.starcard { width: 100%; max-width: 100%; border-radius: 18px; box-shadow: var(--shadow); display: block; aspect-ratio: 1; background: #13233A; }
.levels { display: grid; gap: 10px; }
.lv { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: baseline; }
.lv .nm { font-weight: 800; }
.lv .st { color: var(--sun); letter-spacing: 2px; font-size: 20px; }
.lv .wd { grid-column: 1 / -1; font-size: 13px; color: var(--muted); font-weight: 700; }
.lv .track { grid-column: 1 / -1; height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.lv .track i { display: block; height: 100%; background: var(--c); border-radius: 99px; }
.habits { display: grid; gap: 8px; margin-top: 4px; }
.habit { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; font-size: 14px; }
.habit b { font-weight: 800; }
.tag { font-size: 12px; font-weight: 800; padding: 2px 10px; border-radius: 999px; background: var(--good-soft); color: var(--good); }
.tag.mid { background: var(--bg); color: var(--muted); }
.locked-report { position: relative; border-radius: 14px; border: 2px solid var(--line); padding: 14px; overflow: hidden; }
.locked-report .blur { filter: blur(4px); user-select: none; pointer-events: none; display: grid; gap: 6px; color: var(--muted); }
.locked-report .over { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 14px; background: color-mix(in srgb, var(--surface) 55%, transparent); }
.parent-box { background: var(--bg); border-radius: 12px; padding: 12px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { font-weight: 800; } .kv dd { margin: 0; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
.confirm { border: 2px solid var(--bad); background: var(--bad-soft); border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head><body>

<div class="wrap" id="app"></div>

<script>
/* ---------- helpers ---------- */
const NS = "http://www.w3.org/2000/svg";
function S(p, tag, a = {}, txt) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; if (p) p.appendChild(e); return e; }
function stage(el, w = 360, h = 220) { return S(el, "svg", { viewBox: `0 0 ${w} ${h}`, class: "stage" }); }
function T(p, x, y, txt, cls = "lbl", extra = {}) { return S(p, "text", Object.assign({ x, y, class: cls, "text-anchor": "middle" }, extra), txt); }
function F(c) { return `fill:${c}`; }
function SK(c, w = 2) { return `stroke:${c};stroke-width:${w};fill:none`; }
function div(el, cls, html = "") { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; el.appendChild(d); return d; }
function btn(p, label, cls = "btn sm ghost") { const b = document.createElement("button"); b.type = "button"; b.className = cls; b.innerHTML = label; p.appendChild(b); return b; }
function tween(ms, fn) { return new Promise(r => { const t0 = performance.now(); const f = t => { const p = Math.max(0, Math.min(1, (t - t0) / ms)); fn(p); p < 1 ? requestAnimationFrame(f) : r(); }; requestAnimationFrame(f); }); }
const wait = ms => new Promise(r => setTimeout(r, ms));
const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function msg(el) { const m = div(el, "msg"); m.setAttribute("aria-live", "polite"); return (t, k = "") => { m.textContent = t; m.className = "msg " + k; }; }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function ground(s, w = 360, y = 205, h = 20) { S(s, "rect", { x: 0, y, width: w, height: h, style: F("var(--ground)") }); }
function stepper(p, label, min, max, val, step = 1, fmt = v => v) {
  const r = div(p, "ctrl"); r.innerHTML = `<label>${label}</label>`;
  const m = btn(r, "−"), c = document.createElement("span"); c.className = "chip"; c.style.minWidth = "56px"; c.style.justifyContent = "center"; r.appendChild(c);
  const pl = btn(r, "+"); const o = { v: val, el: r, on: null }; const show = () => { c.textContent = fmt(o.v); if (o.on) o.on(); }; show();
  m.onclick = () => { o.v = Math.max(min, o.v - step); show(); }; pl.onclick = () => { o.v = Math.min(max, o.v + step); show(); };
  return o;
}
function gearPath(r, teeth) {
  let d = ""; const n = teeth * 2;
  for (let i = 0; i < n; i++) { const a0 = (i / n) * Math.PI * 2, a1 = ((i + 1) / n) * Math.PI * 2, rr = i % 2 ? r - 7 : r;
    d += (i ? "L" : "M") + (rr * Math.cos(a0)).toFixed(1) + "," + (rr * Math.sin(a0)).toFixed(1) + "L" + (rr * Math.cos(a1)).toFixed(1) + "," + (rr * Math.sin(a1)).toFixed(1); }
  return d + "Z";
}

/* ---------- language ---------- */
const KEY = "fsl-thinking-check-v1";
let st = { lang: null, profile: null, results: {}, reflect: {}, events: [], synced: 0, sid: null };
try { const raw = localStorage.getItem(KEY); if (raw) st = Object.assign(st, JSON.parse(raw)); } catch (e) {}
function persist() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
let LANG = st.lang || "en";
const X = (en, hi) => LANG === "hi" ? hi : en;
const tx = p => Array.isArray(p) ? p[LANG === "hi" ? 1 : 0] : p;
function setLang(l) { LANG = l; st.lang = l; document.documentElement.lang = l; log("lang", { lang: l }); persist(); }
document.documentElement.lang = LANG;
function log(type, data = {}) { st.events.push(Object.assign({ t: Date.now(), sid: st.sid, type }, data)); if (st.events.length > 4000) st.events.splice(0, st.events.length - 4000); }

/* ---------- 4 Arenas x 4 challenges ---------- */
const ARENAS = [
{ id: "logic", name: ["Logic Lock", "लॉजिक लॉक"], skill: ["Logical Thinking", "तार्किक सोच"], hero: ["Code Breaker", "कोड ब्रेकर"], color: "var(--logic)", hex: "#6C4BD8",
  desc: ["Crack patterns, gears, scales and a code lock.", "पैटर्न, गियर, तराज़ू और कोड वाला ताला खोलो।"],
  icon: '<rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="#fff" stroke-width="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="15" r="1.6" fill="#fff"/>',
  qs: [
  { s: ["Pattern Door", "पैटर्न वाला दरवाज़ा"], t: 50,
    q: ["The door opens only if you complete the arrow pattern. Tap the arrows below to fill the two empty slots.", "दरवाज़ा तभी खुलेगा जब तुम तीरों का पैटर्न पूरा करोगे। नीचे के तीर दबाकर दोनों खाली खाने भरो।"],
    e: ["Each arrow turns a quarter turn clockwise: up, right, down, left, and repeat. So after up and right come down and left.", "हर तीर एक चौथाई चक्कर घड़ी की दिशा में घूमता है: ऊपर, दाएँ, नीचे, बाएँ, फिर दोबारा। इसलिए ऊपर और दाएँ के बाद नीचे और बाएँ आते हैं।"],
    mount(el, api) {
      const s = stage(el, 360, 170), seq = [0, 90, 180, 270, 0, 90, null, null], slots = [];
      const door = S(s, "rect", { x: 300, y: 20, width: 50, height: 130, rx: 6, style: F("var(--logic)") });
      const arrow = (g, deg) => { g.innerHTML = ""; if (deg == null) return; S(g, "path", { d: "M0,-14 L10,0 L4,0 L4,14 L-4,14 L-4,0 L-10,0 Z", transform: `rotate(${deg})`, style: F("var(--ink)") }); };
      seq.forEach((d, i) => { const x = 22 + i * 35, y = 85; S(s, "rect", { x: x - 15, y: y - 22, width: 30, height: 44, rx: 6, style: d == null ? "fill:var(--surface);stroke:var(--logic);stroke-width:2;stroke-dasharray:4 3" : F("var(--surface)") });
        const g = S(s, "g", { transform: `translate(${x} ${y})` }); arrow(g, d); if (d == null) slots.push({ g, v: null }); });
      const c = div(el, "ctrl"), say = msg(el);
      [["↑", 0], ["→", 90], ["↓", 180], ["←", 270]].forEach(([l, d]) => btn(c, l).onclick = () => { const sl = slots.find(x => x.v == null); if (sl) { sl.v = d; arrow(sl.g, d); } });
      btn(c, X("Clear", "मिटाओ")).onclick = () => slots.forEach(sl => { sl.v = null; arrow(sl.g, null); });
      const go = btn(c, X("Open door", "दरवाज़ा खोलो"), "btn sm");
      go.onclick = async () => { if (slots.some(x => x.v == null)) return say(X("Fill both slots first.", "पहले दोनों खाने भरो।"), "bad"); c.querySelectorAll("button").forEach(b => b.disabled = true);
        const right = (slots[0].v === 180) + (slots[1].v === 270), ok = right === 2;
        if (ok) await tween(800, p => door.setAttribute("height", 130 * (1 - p))); else { s.classList.add("shake"); await wait(600); }
        say(ok ? X("Click! The door slides open.", "क्लिक! दरवाज़ा खुल गया।") : X("Locked. The door didn't budge.", "दरवाज़ा बंद ही रहा।"), ok ? "good" : "bad"); await wait(600); api.done(ok, right / 2); };

/* ---------- scoring ---------- */
const TOTAL = ARENAS.reduce((a, x) => a + x.qs.length, 0);
const idOf = (a, i) => `${a.id}-${i}`;
function scoreItem(r, item) {
  const maxA = item.maxA || 25;
  const think = r.first == null ? 0 : clamp(r.first / 4000, 0, 1);
  const calm = r.actions === 0 ? 0 : r.actions <= maxA ? 1 : Math.max(.3, maxA / r.actions);
  const process = .5 * think + .5 * calm;
  const speed = r.ok ? clamp(1.25 - r.used / item.t, 0, 1) : 0;
  return { think, calm, process, speed, score: Math.round(100 * (.6 * r.frac + .25 * process + .15 * speed)) };
}
function skillScore(a) { const rs = a.qs.map((_, i) => st.results[idOf(a, i)]).filter(Boolean); if (rs.length < a.qs.length) return null; return Math.round(rs.reduce((s, r) => s + r.score, 0) / rs.length); }
function starLevel(v) { return v < 30 ? 1 : v < 45 ? 2 : v < 60 ? 3 : v < 78 ? 4 : 5; }
const LEVEL_WORD = [null, ["Starting", "शुरुआत"], ["Growing", "बढ़ रहे हो"], ["Good", "अच्छा"], ["Strong", "मज़बूत"], ["Superstar", "सुपरस्टार"]];
const doneCount = a => a.qs.filter((_, i) => st.results[idOf(a, i)]).length;
const allDone = () => ARENAS.every(a => doneCount(a) === a.qs.length);
function habits() {
  const rs = Object.values(st.results); if (!rs.length) return null; const avg = f => rs.reduce((s, r) => s + f(r), 0) / rs.length;
  const solved = rs.filter(r => r.ok);
  return { think: avg(r => r.think), finish: rs.filter(r => !r.timeout).length / rs.length, fast: solved.length ? solved.reduce((s, r) => s + r.speed, 0) / solved.length : 0 };
}

    <div class="actions"><button class="btn" id="go" type="button">${next > 0 ? X("Continue", "आगे खेलो") : X("Let's go", "चलो शुरू करें")}</button><button class="btn ghost" id="back" type="button">${X("Back", "वापस")}</button></div>`;

function ask() {
  clearAll(); const a = run.arena, item = a.qs[run.qi], myRun = run, myQ = run.qi; window.scrollTo({ top: 0 });
  run.locked = false; run.t0 = performance.now(); run.cur = { first: null, actions: 0, tries: 0, best: 0, lastInput: 0 };
  app.innerHTML = `
    <div class="bar" style="--c:${a.color}">${glyph(a)}<h2>${tx(a.name)}</h2><span class="meta">${run.qi + 1} / ${a.qs.length}</span><button class="quit" id="quit" type="button">${X("Pause", "रुको")}</button></div>
    <div style="--c:${a.color}">
      <div class="dots">${a.qs.map((_, i) => `<span class="dot ${st.results[idOf(a, i)] ? "done" : i === run.qi ? "now" : ""}"></span>`).join("")}</div>
      <div class="timer-row"><span id="secs">${item.t}s</span><div class="timer"><i id="tbar"></i></div></div>
      <div class="card"><div class="story">${X("Challenge", "चुनौती")} ${run.qi + 1} · ${esc(tx(item.s))}</div><div class="q">${esc(tx(item.q))}</div><div class="play" id="play"></div><div id="fb"></div></div>
    </div>`;
  document.getElementById("quit").onclick = () => { log("pause", { item: idOf(a, run.qi) }); persist(); run.locked = true; journey(); };
  const live = () => run === myRun && run.qi === myQ && !run.locked;
  const play = document.getElementById("play");
  const act = kind => { if (!live()) return; const c = run.cur; c.actions++; if (c.first == null) { c.first = performance.now() - run.t0; } log("act", { item: idOf(a, run.qi), k: kind, ms: Math.round(performance.now() - run.t0) }); };
  play.addEventListener("click", e => { const b = e.target.closest("button, .tap"); if (b) act(b.tagName === "BUTTON" ? "btn" : "tap"); });
  play.addEventListener("input", () => { const now = performance.now(); if (now - run.cur.lastInput > 350) act("slide"); run.cur.lastInput = now; });
  const api = { done: (ok, frac) => { if (live()) finish(!!ok, frac == null ? (ok ? 1 : 0) : frac, false); },
    progress: f => { if (live()) run.cur.best = Math.max(run.cur.best, f); },
    retry: () => { if (live()) run.cur.tries++; },
    every: (fn, ms) => timers.push(setInterval(() => { if (live()) fn(); }, ms)) };
  log("item_start", { item: idOf(a, run.qi), lang: LANG });
  item.mount(play, api);
  const bar = document.getElementById("tbar"), secs = document.getElementById("secs");
  tick = setInterval(() => { const left = Math.max(0, item.t - (performance.now() - run.t0) / 1000);
    bar.style.transform = `scaleX(${left / item.t})`; secs.textContent = Math.ceil(left) + "s"; if (left <= 0 && live()) finish(false, run.cur.best, true); }, 100);
}

function finish(ok, frac, timeout) {
  if (run.locked) return; run.locked = true; clearAll();
  const a = run.arena, item = a.qs[run.qi], c = run.cur, used = (performance.now() - run.t0) / 1000;
  const r = { ok, frac: ok ? 1 : clamp(frac, 0, .9), used: Math.round(used * 10) / 10, first: c.first == null ? null : Math.round(c.first), actions: c.actions, tries: c.tries, timeout, lang: LANG };
  Object.assign(r, scoreItem(r, item)); st.results[idOf(a, run.qi)] = r;
  log("item_end", { item: idOf(a, run.qi), ok, frac: r.frac, used: r.used, first: r.first, actions: r.actions, tries: r.tries, timeout, score: r.score }); persist();
  document.getElementById("play").querySelectorAll("button,input").forEach(b => b.disabled = true);
  const last = run.qi === a.qs.length - 1 || a.qs.slice(run.qi + 1).every((_, j) => st.results[idOf(a, run.qi + 1 + j)]);
  const head = ok ? X("Solved!", "हल कर लिया!") : timeout ? X("Time's up! Here's the trick", "समय ख़त्म! तरीका यह है") : r.frac > 0 ? X("Nearly there! Here's the trick", "लगभग सही! तरीका यह है") : X("Here's the trick", "तरीका यह है");
  document.getElementById("fb").innerHTML = `<div class="explain"><h4>${head}</h4><p>${esc(tx(item.e))}</p></div>
    <div class="next-row"><button class="btn" id="next" type="button">${last ? X("Finish Arena", "एरीना पूरा करो") : X("Next challenge", "अगली चुनौती")}</button></div>`;
  const nx = document.getElementById("next"); nx.focus({ preventScroll: true }); nx.scrollIntoView({ behavior: "smooth", block: "nearest" });
  nx.onclick = () => { if (last) reflect(a); else { run.qi = a.qs.findIndex((_, i) => !st.results[idOf(a, i)]); ask(); } };
}

function topArena() { return ARENAS.map(a => ({ a, v: skillScore(a) })).filter(x => x.v != null).sort((x, y) => y.v - x.v)[0]; }
async function drawCard() {
  const W = 1080, cv = document.createElement("canvas"); cv.width = W; cv.height = W; const g = cv.getContext("2d");
  if (!g.roundRect) g.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };
  try { await Promise.all([document.fonts.load('800 80px "Baloo 2"'), document.fonts.load('700 40px "Baloo 2"'), document.fonts.load('800 40px Nunito')]); } catch (e) {}
  const top = topArena(), hi = LANG === "hi", disp = '"Baloo 2", "Nirmala UI", sans-serif', body = hi ? disp : 'Nunito, "Baloo 2", sans-serif';
  g.fillStyle = "#13233A"; g.fillRect(0, 0, W, W);
  g.fillStyle = top.a.hex; g.globalAlpha = .22; g.beginPath(); g.arc(W - 90, 120, 330, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;
  g.fillStyle = "#FF6B1A"; const bw = 440; g.beginPath(); g.roundRect(72, 72, bw, 58, 29); g.fill();
  g.fillStyle = "#fff"; g.font = `800 30px ${disp}`; g.textBaseline = "middle"; g.fillText("FUTURE STAR LEAGUE", 100, 103);
  g.textBaseline = "alphabetic"; g.fillStyle = "#9DB0C8"; g.font = `700 32px ${body}`; g.fillText(hi ? "थिंकिंग चेक · सीज़न 0" : "Thinking Check · Season 0", 72, 196);
  g.fillStyle = "#fff"; g.font = `800 92px ${disp}`; const nm = st.profile.name.length > 14 ? st.profile.name.slice(0, 14) + "…" : st.profile.name; g.fillText(nm, 72, 300);
  g.fillStyle = "#C9D6E6"; g.font = `700 34px ${body}`; g.fillText((hi ? "कक्षा " : "Grade ") + st.profile.grade + (st.profile.school ? "  ·  " + st.profile.school : ""), 72, 352);
  g.fillStyle = "#FFC93C"; g.font = `800 36px ${disp}`; g.fillText(hi ? "मेरी सुपरपावर" : "MY SUPERPOWER", 72, 440);
  g.fillStyle = "#fff"; g.font = `800 78px ${disp}`; g.fillText(tx(top.a.hero), 72, 516);
  let y = 610;
  ARENAS.forEach(a => { const v = skillScore(a), lv = starLevel(v);
    g.fillStyle = a.hex; g.beginPath(); g.roundRect(72, y - 34, 14, 46, 7); g.fill();
    g.fillStyle = "#fff"; g.font = `800 40px ${body}`; g.fillText(tx(a.skill), 108, y);
    g.font = `46px ${disp}`; for (let i = 0; i < 5; i++) { g.fillStyle = i < lv ? "#FFC93C" : "#3A4D6B"; g.fillText("★", W - 72 - 5 * 50 + i * 50, y + 4); }
    g.fillStyle = "#9DB0C8"; g.font = `700 26px ${body}`; g.fillText(tx(LEVEL_WORD[lv]), 108, y + 36);
    y += 100; });
  g.fillStyle = "#9DB0C8"; g.font = `700 28px ${body}`; g.fillText(hi ? "अपनी सुपरपावर खोजो · #FutureStarLeague" : "Find your Superpower · #FutureStarLeague", 72, W - 60);
  return cv;
}

      <dt>${X("Waiting to upload", "अपलोड बाकी")}</dt><dd>${pend} ${X("(uploads to FSL in the real app)", "(असली ऐप में FSL पर अपलोड होंगी)")}</dd></dl>
      <div class="actions"><button class="btn ghost sm" id="copyd" type="button">${X("Copy my data", "मेरा डेटा कॉपी करो")}</button><button class="btn ghost sm" id="del" type="button" style="color:var(--bad)">${X("Delete everything", "सब कुछ मिटाओ")}</button></div>
      <p class="hint" id="copied" hidden>${X("Copied as JSON.", "JSON के रूप में कॉपी हो गया।")}</p><div id="confirm"></div></div>
    <div class="actions"><button class="btn" id="back" type="button">${X("Back", "वापस")}</button></div>`;
  wireTop(myData);
  document.getElementById("back").onclick = route;
  document.getElementById("copyd").onclick = () => { const json = JSON.stringify({ profile: st.profile, results: st.results, reflect: st.reflect, events: st.events }, null, 1);
    try { navigator.clipboard.writeText(json).then(() => document.getElementById("copied").hidden = false, () => {}); } catch (e) {} };
  document.getElementById("del").onclick = () => { const c = document.getElementById("confirm");
    c.innerHTML = `<div class="confirm" style="margin-top:12px"><b>${X("Delete this player's name, scores and all play events from this phone? This can't be undone.", "क्या इस खिलाड़ी का नाम, स्कोर और सारी खेल-घटनाएँ इस फ़ोन से मिटा दें? यह वापस नहीं होगा।")}</b>
      <div class="actions" style="margin-top:0"><button class="btn sm" id="yes" type="button" style="background:var(--bad);box-shadow:none">${X("Yes, delete", "हाँ, मिटाओ")}</button><button class="btn ghost sm" id="no" type="button">${X("Cancel", "रद्द करो")}</button></div></div>`;
    document.getElementById("no").onclick = () => c.innerHTML = "";
    document.getElementById("yes").onclick = () => { const l = st.lang; st = { lang: l, profile: null, results: {}, reflect: {}, events: [], synced: 0, sid: null }; persist(); route(); }; };
}

route();
</script>
</body></html>
