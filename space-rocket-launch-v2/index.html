<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="FSL Round 2 mission: learn real rocket science, fix the rocket and launch it.">
</head>
<body>
<title>Space Rocket Launch Day</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: one-screen mission room. Top bar (launch window, score, coins) + fix bar, illustrated scene, each fix opens a sheet: learn, then test. Single dark "space" look by design. */
:root{
  color-scheme:dark;
  --space:#0A0E2E; --panel:#171D52; --panel2:#222A6E; --raise:#2C3584; --deep:#0B1138;
  --ink:#F5F6FF; --muted:#AEB5E8; --line:rgba(255,255,255,.14);
  --sun:#FFC83D; --good:#3DDC97; --bad:#FF5D73;
  --sp1:#FFC83D; --sp2:#B39BFF; --sp3:#2ED3C0; --sp4:#FF8A5C; --sp5:#4EA8FF; --sp6:#FF7EC8;
  --font:'Baloo 2','Nirmala UI','Noto Sans Devanagari','Mangal',system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--space);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-size:16px;line-height:1.3}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));gap:6px;padding-block:6px}
.top{display:flex;align-items:center;gap:3px;min-width:0}
.logo{width:30px;height:30px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.logo svg{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-weight:800;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.timer.low{background:var(--bad);border-color:var(--bad)}
.chip.streak{background:linear-gradient(90deg,#FF7A3D,#FF3D7F);border:0}
.chip small{font-weight:600;color:var(--muted);font-size:12px}
.sp{flex:1;min-width:0}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;height:32px;min-width:32px;padding:0 8px;font-weight:700;font-size:14px;flex:none}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE89A,#FFB800 60%,#C98A00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);display:inline-block;flex:none}
.fixbar{display:flex;gap:5px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 8px}
.seg{flex:1;height:30px;border-radius:9px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#0A0E2E;letter-spacing:-1px}
.seg svg{width:18px;height:18px;opacity:.5;filter:invert(1)}
.seg.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.scene{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.scene>svg{display:block;width:100%;height:100%}
.scene.shake{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:translate(1px,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,2px)}100%{transform:translate(0,0)}}
.hint-line{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(10,14,46,.8);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.hint-line.go{background:var(--sun);color:#2A1A00;cursor:pointer;font-size:15px;animation:pop 1.2s infinite;white-space:normal;text-align:center;width:max-content;max-width:90%}
.hs{position:absolute;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(255,255,255,.85),0 4px 14px rgba(0,0,0,.4)}
.hs svg{width:28px;height:28px}
.hs::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--c);animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.7);opacity:0}}
.hs .tag{position:absolute;top:100%;margin-top:6px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;background:rgba(10,14,46,.88);padding:1px 8px;border-radius:999px;white-space:nowrap;pointer-events:none}
.hs.done{box-shadow:0 0 0 3px var(--good),0 4px 14px rgba(0,0,0,.4)}
.hs.done::before{display:none}
.hs .st{position:absolute;bottom:-4px;right:-12px;background:var(--space);border-radius:999px;padding:0 5px;font-size:11px;color:var(--sun);font-weight:800;border:1px solid var(--line)}
#rocket{transition:transform 3s cubic-bezier(.45,0,.75,.45)}
#flame{transform-origin:215px 488px;transform:scaleY(0);transition:transform .6s}
.lit #flame{transform:scaleY(1)}
#flame ellipse{animation:flick .09s infinite alternate}
@keyframes flick{from{opacity:.85}to{opacity:1}}
.twk{animation:tw 2.4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.2}to{opacity:1}}
.blink{animation:bl 1.2s steps(2) infinite}
@keyframes bl{50%{opacity:.15}}

.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,6,24,.62)}
.ov.center{align-items:center;padding:16px}
.sheet{width:100%;max-width:560px;max-height:96%;background:var(--panel);border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:0;display:flex;flex-direction:column;overflow:hidden;animation:up .28s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
.center .sheet{border-radius:26px;border-bottom:1px solid var(--line);max-height:100%}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sh-head{display:flex;align-items:center;gap:10px;padding:12px 16px 8px}
.badge{width:42px;height:42px;border-radius:14px;background:var(--c);display:flex;align-items:center;justify-content:center;flex:none}
.badge svg{width:26px;height:26px}
.sh-title{flex:1;min-width:0}
.sh-title small{display:block;font-size:12px;color:var(--c);font-weight:700}
.sh-title b{font-size:19px;font-weight:800;display:block;line-height:1.1}
.x{width:38px;height:38px;border-radius:50%;background:var(--panel2);font-size:20px;font-weight:700;flex:none}
.sh-body{padding:0 16px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.steps-top{display:flex;gap:4px;align-items:center}
.steps-top i{flex:1;height:6px;border-radius:9px;background:var(--panel2)}
.steps-top i.on{background:var(--c)}
.steps-top i.ok{background:var(--good)}
.steps-top i.no{background:var(--bad)}
.kicker{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.prompt{font-size:18px;font-weight:700;text-wrap:balance}
.learn-text{font-size:17px;font-weight:600;color:#E3E7FF}
.learn-text ul{margin:6px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.learn-text li{background:var(--panel2);border-radius:12px;padding:6px 10px;display:flex;gap:8px;align-items:center}
.learn-text li b{color:var(--sun)}
.tail{color:var(--sun);font-weight:800}
.art{background:var(--deep);border-radius:18px;padding:8px;display:flex;justify-content:center;position:relative}
.art svg{width:100%;max-width:320px;height:auto;display:block}
.art .part{cursor:pointer;transition:filter .2s}
.art .part.sel{filter:drop-shadow(0 0 6px #FFC83D)}
.art .part.right{filter:drop-shadow(0 0 8px #3DDC97)}
.art .part.wrong{filter:drop-shadow(0 0 8px #FF5D73)}
.infobox{background:var(--panel2);border-radius:14px;padding:8px 12px;font-weight:600;min-height:44px}
.infobox b{color:var(--sun)}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dots{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--good);display:inline-block}
.dots i.used{background:var(--panel2);border:1px solid var(--line)}
.qtime{font-size:13px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.peek{margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.peek[disabled]{opacity:.5;cursor:default}
.fb{border-radius:14px;padding:10px 12px;font-weight:700;font-size:15px}
.fb.good{background:rgba(61,220,151,.14);border:1px solid var(--good)}
.fb.bad{background:rgba(255,93,115,.12);border:1px solid var(--bad)}
.fb.try{color:var(--bad);text-align:center;padding:2px}
.fb b{display:block;font-size:17px}
.fb .pts{color:var(--sun)}
.big{background:linear-gradient(180deg,#FFD45C,#FFB21E);color:#2A1A00;font-weight:800;font-size:19px;border-radius:16px;padding:11px 22px;box-shadow:0 4px 0 #C98500}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #C98500}
.big.alt{background:var(--raise);color:var(--ink);box-shadow:0 4px 0 #161B4F}
.big[disabled]{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.shake-x{animation:sx .35s}
@keyframes sx{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.opts{display:flex;flex-direction:column;gap:8px}
.opts.two{flex-direction:row}
.opts.two .opt{flex:1;justify-content:center;font-size:24px;padding:16px}
.opt{background:var(--panel2);border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:10px;border:3px solid transparent;font-size:16px;font-weight:700;text-align:left}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--raise);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.opt.wrong{border-color:var(--bad);opacity:.6}
.opt.right{border-color:var(--good)}
.opt[disabled]{cursor:default}
.opt.go{background:#1D5F48} .opt.nogo{background:#6B2333}

.readings{background:var(--deep);border-radius:16px;padding:10px;display:grid;gap:8px}
.rd{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:12px;padding:8px 10px;font-weight:700}
.rd svg{width:30px;height:30px;flex:none}
.rd span{flex:1}
.rd b{font-size:20px;font-variant-numeric:tabular-nums}
.rd.note{background:rgba(255,200,61,.12);color:#FFE5A0;font-size:14px}

.thr{display:flex;flex-direction:column;gap:10px;align-items:center}
.thr .stand{width:100%;height:220px;border-radius:16px;background:linear-gradient(#0B1138,#1E2470);position:relative;overflow:hidden}
.thr .stand svg{position:absolute;left:50%;bottom:6px;width:120px;height:200px;margin-left:-60px;transition:transform 2s cubic-bezier(.5,0,.9,.6)}
.thr .stand .wt{position:absolute;right:10px;top:10px;background:var(--panel);border-radius:10px;padding:4px 10px;font-weight:800}
.thr .stand .pe{position:absolute;left:10px;top:10px;background:var(--panel);border-radius:10px;padding:4px 10px;font-weight:800;color:var(--sp4)}
.thr .stand .res{position:absolute;left:10px;right:10px;bottom:10px;text-align:center;font-weight:800;font-size:18px}
.stepper{display:flex;align-items:center;gap:14px;font-weight:800;font-size:18px}
.stepper button{width:52px;height:52px;border-radius:16px;background:var(--raise);font-size:28px;font-weight:800;box-shadow:0 4px 0 #161B4F}
.stepper b{font-size:30px;min-width:40px;text-align:center}
.shake-y{animation:sy .12s linear 10}
@keyframes sy{50%{transform:translateY(-3px)}}

.ord-slots{display:flex;flex-direction:column;gap:6px}
.slot{min-height:42px;border-radius:12px;border:2px dashed var(--line);display:flex;align-items:center;gap:8px;padding:4px 10px;font-weight:700;background:none;text-align:left}
.slot .n{width:24px;height:24px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.slot.f{border-style:solid;border-color:var(--sp3);background:rgba(46,211,192,.1)}
.slot.ok{border-color:var(--good);background:rgba(61,220,151,.15)}
.slot.bad{border-color:var(--bad)}
.ord-pool{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{background:var(--raise);border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px;box-shadow:0 3px 0 #161B4F;text-align:left}
.chipbtn[disabled]{opacity:.25}

.timeline{display:flex;flex-direction:column;gap:6px;position:relative}
.tl{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:12px;padding:6px 10px;font-weight:700;opacity:.35;transition:opacity .3s}
.tl.on{opacity:1}
.tl .n{width:26px;height:26px;border-radius:50%;background:var(--sp3);color:#0A0E2E;display:flex;align-items:center;justify-content:center;flex:none;font-weight:800}

.rule{text-align:center;font-size:19px;font-weight:800;border-radius:14px;padding:8px;background:var(--panel2)}
.rule.flash{animation:fl .6s 2}
@keyframes fl{50%{background:var(--sun);color:#2A1A00}}
.holes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:330px;width:100%;margin:0 auto}
.hole{aspect-ratio:1.2;border-radius:16px;background:var(--deep);border:2px solid #2C3584;position:relative;display:flex;align-items:center;justify-content:center}
.gauge{width:86%;height:80%;border-radius:12px;background:#E9ECFF;color:#0A0E2E;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:pin .15s ease-out;padding:0}
.gauge b{font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.gauge small{font-size:11px;font-weight:700;color:#5A628F}
@keyframes pin{from{transform:scale(.3)}to{transform:scale(1)}}
.gauge.hit{background:var(--good);animation:hitp .25s forwards}
.gauge.oops{background:var(--bad);animation:sx .3s}
@keyframes hitp{to{transform:scale(1.3);opacity:0}}
.timebar{height:10px;border-radius:999px;background:var(--panel2);overflow:hidden}
.timebar i{display:block;height:100%;background:var(--sp5);width:100%}
.score3{display:flex;justify-content:center;gap:16px;font-weight:700;font-size:15px;color:var(--muted)}

.tiles{display:grid;gap:5px;max-width:340px;width:100%;margin:0 auto;padding:8px;border-radius:16px;background:#3A3F5C}
.tile{min-width:0;aspect-ratio:1;border-radius:6px;background:none;padding:0}
.tile svg{width:100%;height:100%;pointer-events:none}
.tile.wrong{animation:sx .35s}
.tile.found{outline:4px solid var(--good);border-radius:6px}
.tile.missed{outline:4px solid var(--sun);border-radius:6px}

.done{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:6px 0}
.done .bigbadge{width:80px;height:80px;border-radius:24px;background:var(--c);display:flex;align-items:center;justify-content:center;animation:pop .6s}
.done .bigbadge svg{width:50px;height:50px}
.starrow{font-size:38px;letter-spacing:4px;line-height:1;color:var(--sun)}
.starrow .off{opacity:.2;color:var(--ink)}
.done h3{margin:0;font-size:24px;font-weight:800}
.done p{margin:0;color:var(--muted);font-weight:600}
.gain{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.piece{font-size:15px;font-weight:700;background:var(--panel2);border-radius:999px;padding:4px 12px;display:inline-flex;gap:6px;align-items:center}
.learned{background:var(--panel2);border-radius:14px;padding:8px 12px;font-size:14px;font-weight:600;text-align:left;width:100%}
.learned b{color:var(--good)}

.intro{padding:20px 18px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;overflow:auto}
.intro h1{margin:0;font-size:30px;line-height:1.02;font-weight:800;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sun);font-weight:700}
.intro p{margin:0;font-size:16px;font-weight:600;color:#DADFFF;max-width:38ch}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%}
.howto div{background:var(--panel2);border-radius:12px;padding:8px 4px;font-size:12px;font-weight:700;color:var(--muted);line-height:1.15}
.howto b{display:block;color:var(--ink);font-size:20px}
.sprow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;width:100%;max-width:340px}
.sprow div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--muted);line-height:1.05;text-align:center}
.sprow .badge{width:38px;height:38px;border-radius:12px}
.sprow .badge svg{width:22px;height:22px}
.beat{background:linear-gradient(90deg,#FF7A3D,#FF3D7F);border-radius:14px;padding:8px 14px;font-weight:800}
.res-big{font-size:54px;font-weight:800;line-height:1;color:var(--sun);font-variant-numeric:tabular-nums}
.rank{font-size:22px;font-weight:800;background:linear-gradient(90deg,#B39BFF,#4EA8FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.res-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%}
.res-grid div{background:var(--panel2);border-radius:14px;padding:8px 2px;font-weight:700;font-size:12px;color:var(--muted)}
.res-grid b{display:block;color:var(--ink);font-size:20px;font-variant-numeric:tabular-nums}
.res-list{width:100%;display:flex;flex-direction:column;gap:6px}
.res-list>div{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:6px 10px;font-weight:700;font-size:14px;text-align:left}
.res-list .badge{width:32px;height:32px;border-radius:10px}
.res-list .badge svg{width:20px;height:20px}
.res-list span.l{flex:1;min-width:0}
.res-list em{font-style:normal;color:var(--sun);white-space:nowrap}
.board{width:100%;background:var(--deep);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:4px;text-align:left}
.board h4{margin:0 0 4px;font-size:16px}
.board .r{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;align-items:center;padding:4px 8px;border-radius:10px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.board .r.me{background:rgba(255,200,61,.15);color:var(--sun)}
.board .r small{color:var(--muted);font-weight:600}
.namerow{display:flex;gap:8px;width:100%}
.namerow input{flex:1;min-width:0;background:var(--deep);border:2px solid var(--line);border-radius:12px;color:var(--ink);font:700 17px var(--font);padding:8px 12px;user-select:text;-webkit-user-select:text}
.note{font-size:13px;color:var(--muted);font-weight:600;max-width:42ch}
.cardimg{width:100%;max-width:340px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.countdown{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;font-size:150px;font-weight:800;color:var(--sun);text-shadow:0 0 40px rgba(255,200,61,.6);pointer-events:none}
.countdown span{animation:cd 1s ease-out forwards}
@keyframes cd{from{transform:scale(1.6);opacity:0}30%{opacity:1}to{transform:scale(.8);opacity:0}}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:40;background:var(--bad);color:#fff;font-weight:800;padding:8px 16px;border-radius:999px;max-width:92%;text-align:center;animation:up .3s}
.cmd-timer{height:12px;border-radius:999px;background:var(--panel2);overflow:hidden}
.cmd-timer i{display:block;height:100%;background:var(--sun);width:100%}
#confetti{position:fixed;inset:0;z-index:25;pointer-events:none}
pre.dbg{background:#05081F;border-radius:12px;padding:10px;font-size:11px;max-height:50vh;overflow:auto;white-space:pre-wrap;word-break:break-all;user-select:text;-webkit-user-select:text;font-family:ui-monospace,monospace;text-align:left}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}.hs::before{display:none}}
</style>

<div id="app">
  <div class="top">
    <span class="chip timer" id="timer" title="Launch window" role="button">⏱ 15:00</span>
    <span class="chip" id="score" title="Score">★ 0</span>
    <span class="chip streak" id="streak" hidden></span>

const $ = (s,el=document)=>el.querySelector(s);
const h = (tag,attrs={},html='')=>{const e=document.createElement(tag);for(const k in attrs){const v=attrs[k];if(k==='style'&&typeof v==='object'){for(const sk in v){if(sk.startsWith('--'))e.style.setProperty(sk,v[sk]);else e.style[sk]=v[sk];}}else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v);}if(html)e.innerHTML=html;return e;};
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sleep = ms=>new Promise(r=>setTimeout(r,ms));
const uuid = ()=>(crypto.randomUUID?crypto.randomUUID():'r-'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
function t(x,vars){let s=(x&&typeof x==='object')?(x[S.lang]||x.en||''):(x||'');if(vars)for(const k in vars)s=s.split('{'+k+'}').join(vars[k]);return s;}
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

const SFX = {ctx:null,
  ensure(){if(!S.sound)return null;try{if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume();}catch(e){return null;}return this.ctx;},
  tone(f,d=.15,type='sine',v=.18,when=0){const c=this.ensure();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;const t0=c.currentTime+when;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g).connect(c.destination);o.start(t0);o.stop(t0+d+.02);},
  good(){[523,659,784].forEach((f,i)=>this.tone(f,.16,'triangle',.18,i*.08));},
  bad(){this.tone(200,.22,'sawtooth',.1);},
  tap(){this.tone(880,.05,'square',.06);},
  coin(){this.tone(988,.08,'square',.08);this.tone(1319,.12,'square',.08,.07);},
  rumble(sec=3){const c=this.ensure();if(!c)return;const n=c.sampleRate*sec,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();f.type='lowpass';f.frequency.value=260;g.gain.value=.5;s.buffer=b;s.connect(f).connect(g).connect(c.destination);s.start();}
};

function newRun(){
  const m=S.mission;
  S.coins=m.scoring.coins.start;S.streak=0;S.bestStreak=0;S.points=0;S.events=[];S.phase='intro';S.windowStart=null;S.windowLeft=m.windowSec;S.windowClosedShown=false;S.commander=null;
  S.fixes={};S.qres={};
  m.fixes.forEach(f=>{S.fixes[f.id]={status:'new',qi:0,stars:0,points:0,timeMs:0,openedAt:null,learnDone:false};f.questions.forEach(q=>S.qres[q.id]={fix_id:f.id,tries:0,peeked:false,correct:null,first:false,timeMs:0,points:0,credit:0});});
  S.run={run_id:uuid(),player_id:null,player_name:null,mission_id:m.id,mission_version:m.version,round:m.round,band:m.band,lang:S.lang,started_at:null,ended_at:null,completed:false,points:0,stars:0,first_try_correct:0,questions:Object.keys(S.qres).length,commander_correct:0,window_bonus:0,best_streak:0,rank:null,coins_end:null,beat_target:S.beat,client:{ua:navigator.userAgent.slice(0,120),w:innerWidth,h:innerHeight}};
  S.t0=performance.now();
}
function log(event,ids={},payload={}){
  S.events.push({run_id:S.run.run_id,seq:S.events.length+1,ts:new Date().toISOString(),t_ms:Math.round(performance.now()-S.t0),event,fix_id:ids.fix||null,question_id:ids.q||null,competency:ids.comp||null,payload});
  saveRun();
}
function questionResults(){const out=[];S.mission.fixes.forEach(f=>f.questions.forEach(q=>{const r=S.qres[q.id];out.push({run_id:S.run.run_id,fix_id:f.id,question_id:q.id,superpower:f.superpower,competency:q.competency||f.competency,type:q.type,correct:r.correct,first_try:r.first,tries:r.tries,peeked:r.peeked,time_ms:Math.round(r.timeMs),skill_credit:r.credit,points:r.points});}));
  if(S.commander)S.commander.res.forEach(c=>out.push({run_id:S.run.run_id,fix_id:'commander',question_id:c.id,superpower:c.sp,competency:c.comp,type:'mcq-timed',correct:c.correct,first_try:c.correct,tries:1,peeked:false,time_ms:c.ms,skill_credit:c.correct?1:0,points:c.points}));
  return out;}
function saveRun(){
  const runs=store.get('fsl.missionRuns.v2',[]);
  const rec={run:S.run,question_results:questionResults(),events:S.events};
  const i=runs.findIndex(r=>r.run.run_id===S.run.run_id);
  if(i>=0)runs[i]=rec;else runs.push(rec);
  while(runs.length>20)runs.shift();
  store.set('fsl.missionRuns.v2',runs);
}

function tileSvg(dmg){return `<svg viewBox="0 0 40 40"><rect x="1" y="1" width="38" height="38" rx="5" fill="#15172A"/><rect x="4" y="4" width="32" height="32" rx="3" fill="#23263D"/>${dmg==='crack'?'<path d="M9 8 L17 17 L14 22 L24 28 L31 34" stroke="#FF8A3D" stroke-width="1.6" fill="none"/>':''}${dmg==='chip'?'<path d="M26 1 H39 V14 Z" fill="#3A3F5C"/><path d="M26 4 L36 14" stroke="#9AA3D6" stroke-width="1"/>':''}</svg>`;}
function rocketThrust(n){let eng='';const w=Math.max(1,n);const gap=22,start=60-(w-1)*gap/2;for(let i=0;i<n;i++){const x=start+i*gap;eng+=`<path d="M${x-7} 168 H${x+7} L${x+10} 180 H${x-10}Z" fill="#6B7299"/><g class="fl"><ellipse cx="${x}" cy="192" rx="7" ry="13" fill="#FF8A3D"/><ellipse cx="${x}" cy="188" rx="3.5" ry="7" fill="#FFF0A8"/></g>`;}

/* ================= question types =================
   Each type: (ctx) -> {destroy()}; calls ctx.answer({correct, payload}) -> {final:boolean}; ctx.reveal handled by type via returned reveal() */
const QT = {};

QT.mcq = ctx=>{
  const q=ctx.q;const two=q.options.length===2;
  if(q.readings)ctx.el.append(readingsPanel(q.readings));
  else if(q.art&&ART[q.art])ctx.el.append(h('div',{class:'art'},ART[q.art]()));
  const order=two?q.options.map((o,i)=>i):shuffle(q.options.map((o,i)=>i));
  const box=h('div',{class:'opts'+(two?' two':'')});
  const btns=[];
  order.forEach((i,k)=>{const o=q.options[i];const b=h('button',{class:'opt'+(q.style==='gonogo'?(o.text.en==='GO'?' go':' nogo'):'')},(two?'':`<span class="k">${'ABCD'[k]}</span>`)+`<span>${esc(t(o.text))}</span>`);
    b.onclick=()=>{if(b.disabled)return;SFX.tap();const r=ctx.answer(!!o.correct,{choice:i,error:o.error||null,display_order:order});
      if(o.correct){b.classList.add('right');btns.forEach(x=>x.disabled=true);}
      else{b.classList.add('wrong','shake-x');b.disabled=true;if(r.final){btns.forEach(x=>x.disabled=true);btns[order.indexOf(q.options.findIndex(x=>x.correct))].classList.add('right');}}};
    btns.push(b);box.append(b);});
  ctx.el.append(box);
  return {destroy(){}};
};
function readingsPanel(r){
  const p=h('div',{class:'readings'});
  p.append(h('div',{class:'rd'},`${MINI.wind}<span>${esc(t(UI.wind))}</span><b>${r.wind} km/h</b>`));
  p.append(h('div',{class:'rd'},`${MINI.storm}<span>${esc(t(UI.storm))}</span><b>${r.storm?esc(t(UI.kmAway,{n:r.storm})):esc(t(UI.none))}</b>`));
  p.append(h('div',{class:'rd'},`${MINI.fuel}<span>${esc(t(UI.fuel))}</span><b>${r.fuel}%</b>`));
  if(r.note)p.append(h('div',{class:'rd note'},esc(t(r.note))));
  return p;
}

QT.label = ctx=>{
  const q=ctx.q;const art=h('div',{class:'art'},ART.anatomy({labels:false}));ctx.el.append(art);
  let done=false;
  art.querySelectorAll('.part').forEach(p=>p.addEventListener('click',()=>{
    if(done)return;const k=p.dataset.part;SFX.tap();
    const ok=k===q.answer;const r=ctx.answer(ok,{tapped:k});
    if(ok){done=true;p.classList.add('right');}
    else{p.classList.add('wrong');setTimeout(()=>p.classList.remove('wrong'),700);if(r.final){done=true;art.querySelector(`[data-part="${q.answer}"]`).classList.add('right');}}
  }));
  return {destroy(){}};
};

QT.order = ctx=>{
  const q=ctx.q;const n=q.items.length;let pick=[];let locked=false;
  const slots=h('div',{class:'ord-slots'});const pool=h('div',{class:'ord-pool'});
  const poolOrder=shuffle(q.items.map((x,i)=>i));
  const poolBtns={};
  poolOrder.forEach(i=>{const b=h('button',{class:'chipbtn'},esc(t(q.items[i])));b.onclick=()=>{if(locked||b.disabled||pick.length>=n)return;SFX.tap();pick.push(i);b.disabled=true;draw();};poolBtns[i]=b;pool.append(b);});
  const chk=h('button',{class:'big',disabled:true},t(UI.check));
  const msg=h('div',{class:'note',style:{textAlign:'center',width:'100%'}});
  function draw(state){slots.innerHTML='';for(let k=0;k<n;k++){const i=pick[k];const cls=state?(state[k]?' ok':' bad'):'';const s=h('button',{class:'slot'+(i!=null?' f':'')+cls},`<span class="n">${k+1}</span><span>${i!=null?esc(t(q.items[i])):''}</span>`);
      s.onclick=()=>{if(locked||i==null||state)return;pick.splice(k,1);poolBtns[i].disabled=false;draw();};slots.append(s);}
    chk.disabled=pick.length<n||locked;}
  chk.onclick=()=>{if(pick.length<n||locked)return;const state=pick.map((i,k)=>i===k);const ok=state.every(Boolean);const right=state.filter(Boolean).length;
    const r=ctx.answer(ok,{order:pick.slice(),in_place:right});draw(state);
    if(ok||r.final){locked=true;chk.hidden=true;if(!ok){pick=q.items.map((x,i)=>i);draw(pick.map(()=>true));}}
    else{msg.textContent=t(UI.inPlace,{n:right,m:n});locked=true;setTimeout(()=>{locked=false;
      /* keep only the correct opening steps, return the rest to the pool */ const keep=[];for(let k=0;k<n;k++){if(state[k])keep.push(pick[k]);else break;}
      q.items.forEach((x,i)=>poolBtns[i].disabled=keep.includes(i));pick=keep;draw();},1100);}};
  draw();ctx.el.append(slots,pool,h('div',{class:'row'},''),msg);ctx.el.lastChild.previousSibling.append(chk);
  return {destroy(){}};
};

QT.thrust = ctx=>{
  const q=ctx.q;let n=1,busy=false,done=false;
  const wrap=h('div',{class:'thr'});
  const stand=h('div',{class:'stand'});
  const draw=()=>{stand.innerHTML=`<div class="wt">${esc(t(UI.weight))}: ${q.weight} t</div><div class="pe">${esc(t(UI.perEngine))}: ${q.perEngine} t</div>${rocketThrust(n)}<div class="res"></div>`;};
  draw();
  const stepper=h('div',{class:'stepper'});
  const minus=h('button',{'aria-label':'fewer engines'},'−'),plus=h('button',{'aria-label':'more engines'},'+'),val=h('b',{},String(n));
  minus.onclick=()=>{if(busy||done||n<=1)return;n--;val.textContent=n;SFX.tap();draw();};
  plus.onclick=()=>{if(busy||done||n>=q.maxEngines)return;n++;val.textContent=n;SFX.tap();draw();};
  stepper.append(minus,h('span',{},''),val,h('span',{style:{fontSize:'15px',color:'var(--muted)'}},t(UI.engines)),plus);
  const fire=h('button',{class:'big'},'🔥 '+t(UI.testFire));
  fire.onclick=async()=>{if(busy||done)return;busy=true;const push=n*q.perEngine;const lifts=push>q.weight;const svg=stand.querySelector('svg');const res=stand.querySelector('.res');SFX.rumble(1.6);
    if(lifts){svg.style.transform='translateY(-170px)';await sleep(1700);res.textContent=n===q.answer?t(UI.liftOff,{p:push,w:q.weight}):t(UI.extra);}
    else{svg.classList.add('shake-y');await sleep(1300);svg.classList.remove('shake-y');res.textContent=t(UI.noLift,{p:push,w:q.weight});}
    res.style.color=n===q.answer?'var(--good)':'var(--bad)';
    const r=ctx.answer(n===q.answer,{engines:n,push,error:n<q.answer?'too-few':(n>q.answer?'not-fewest':null)});
    busy=false;if(n===q.answer||r.final){done=true;fire.hidden=true;if(n!==q.answer){await sleep(900);n=q.answer;val.textContent=n;draw();stand.querySelector('.res').textContent=t(UI.liftOff,{p:n*q.perEngine,w:q.weight});stand.querySelector('.res').style.color='var(--good)';}}
    else{await sleep(900);draw();}};
  wrap.append(stand,stepper,fire);ctx.el.append(wrap);
  return {destroy(){}};
};

QT.monitor = ctx=>{
  const q=ctx.q;let alive=true,running=false,timers=[],stats;
  const rule=h('div',{class:'rule'},esc(t(q.phases[0].label)));
  const tb=h('div',{class:'timebar'},'<i></i>');
  const holes=h('div',{class:'holes'});const holeEls=[];for(let i=0;i<q.holes;i++){const e=h('div',{class:'hole'});holes.append(e);holeEls.push(e);}
  const sc=h('div',{class:'score3'});
  const btn=h('button',{class:'big'},t(UI.go)+' ▶');
  ctx.el.append(rule,tb,holes,sc,h('div',{class:'row'}));ctx.el.lastChild.append(btn);
  const later=(fn,ms)=>{const id=setTimeout(()=>{if(alive)fn();},ms);timers.push(id);};
  const drawScore=()=>{sc.innerHTML=`<span>${esc(t(UI.caught))}: <b style="color:var(--good)">${stats.hits}</b></span><span>${esc(t(UI.wrongTaps))}: <b style="color:var(--bad)">${stats.wrong}</b></span>`;};
  btn.onclick=()=>{
    if(running)return;running=true;btn.hidden=true;
    stats={hits:0,wrong:0,targets:0,missed:0,rt:[],phase:q.phases.map(p=>({limit:p.limit,targets:0,hits:0,wrong:0,trap_taps:0}))};drawScore();
    ctx.log('monitor_start',{});
    const total=q.phases.reduce((a,p)=>a+p.sec,0)*1000;let ph=0;const t0=performance.now();
    rule.textContent=t(q.phases[0].label);
    const tick=()=>{if(!alive||!running)return;const e=performance.now()-t0;tb.firstChild.style.width=Math.max(0,100-e/total*100)+'%';
      let acc=0,np=0;for(let i=0;i<q.phases.length;i++){acc+=q.phases[i].sec*1000;np=i;if(e<acc)break;}
      if(np!==ph){ph=np;rule.textContent=t(q.phases[ph].label);rule.classList.remove('flash');void rule.offsetWidth;rule.classList.add('flash');ctx.flash(t(UI.switchRule));SFX.tone(330,.2,'square',.12);SFX.tone(440,.2,'square',.12,.15);
        holeEls.forEach(x=>{const g=x.firstChild;if(g&&!g.dataset.done){g.dataset.done=1;g.remove();}});}
      if(e>=total){end();return;}requestAnimationFrame(tick);};
    requestAnimationFrame(tick);
    const spawn=()=>{if(!alive||!running)return;if(performance.now()-t0>total-400)return;
      const free=holeEls.filter(x=>!x.firstChild);if(free.length){const hole=free[Math.floor(Math.random()*free.length)];
        const lim=q.phases[ph].limit;const prev=ph>0?q.phases[ph-1].limit:null;let v,danger=Math.random()<q.dangerShare;
        if(danger)v=lim+1+Math.floor(Math.random()*(99-lim));
        else{const trap=prev!=null&&Math.random()<.5;v=trap?Math.min(lim,30+Math.floor(Math.random()*(lim-29))):30+Math.floor(Math.random()*(lim-29));if(prev==null&&Math.random()<.4)v=Math.max(30,lim-1-Math.floor(Math.random()*20));}
        const myPh=ph;if(danger){stats.targets++;stats.phase[myPh].targets++;}
        const born=performance.now();
        const g=h('button',{class:'gauge','aria-label':'reading '+v},`<b>${v}</b><small>°</small>`);
        g.addEventListener('pointerdown',ev=>{ev.preventDefault();if(g.dataset.done)return;g.dataset.done=1;
          if(v>q.phases[ph].limit){stats.hits++;stats.phase[ph].hits++;stats.rt.push(Math.round(performance.now()-born));g.classList.add('hit');SFX.tone(990,.06,'triangle',.12);}
          else{stats.wrong++;stats.phase[ph].wrong++;if(ph>0&&v>q.phases[0].limit-20)stats.phase[ph].trap_taps++;g.classList.add('oops');SFX.bad();}
          drawScore();later(()=>g.remove(),260);});
        hole.append(g);
        later(()=>{if(!g.dataset.done){g.dataset.done=1;if(danger)stats.missed++;g.remove();}},q.stayMs);}
      later(spawn,q.spawnMs);};
    later(spawn,400);
    function end(){running=false;timers.forEach(clearTimeout);timers=[];holeEls.forEach(x=>x.innerHTML='');
      const hr=stats.targets?stats.hits/stats.targets:0;const ok=hr>=q.pass.minHitRate&&stats.wrong<=q.pass.maxWrong;
      const r=ctx.answer(ok,{hits:stats.hits,targets:stats.targets,wrong:stats.wrong,missed:stats.missed,hit_rate:+hr.toFixed(2),mean_rt_ms:stats.rt.length?Math.round(stats.rt.reduce((a,b)=>a+b,0)/stats.rt.length):null,phases:stats.phase});
      if(!ok&&!r.final){btn.hidden=false;btn.textContent=t(UI.go)+' ▶';rule.textContent=t(q.phases[0].label);tb.firstChild.style.width='100%';}}
  };
  return {destroy(){alive=false;running=false;timers.forEach(clearTimeout);}};
};

QT.spot = ctx=>{
  const q=ctx.q;const n=q.cols*q.rows;const dmg={};q.damaged.forEach(([i,k])=>dmg[i]=k);
  const need=q.damaged.length;let found=0,wrong=0,done=false;
  const g=h('div',{class:'tiles',style:{gridTemplateColumns:`repeat(${q.cols},minmax(0,1fr))`}});
  const els=[];const info=h('div',{class:'note',style:{textAlign:'center',width:'100%'}},t(UI.found,{n:0,m:need}));
  for(let i=0;i<n;i++){const b=h('button',{class:'tile','aria-label':'tile '+(i+1)},tileSvg(dmg[i]||null));
    b.onclick=()=>{if(done||b.classList.contains('found'))return;SFX.tap();
      if(dmg[i]){b.classList.add('found');found++;info.textContent=t(UI.found,{n:found,m:need});ctx.log('spot_found',{tile:i});
        if(found===need){done=true;ctx.answer(true,{wrong_taps:wrong,tries_override:wrong===0?1:2});}}
      else{wrong++;b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');ctx.log('spot_wrong',{tile:i});
        if(wrong>=q.tries){done=true;ctx.answer(false,{wrong_taps:wrong,found,final:true});els.forEach((x,k)=>{if(dmg[k]&&!x.classList.contains('found'))x.classList.add('missed');});}}};
    g.append(b);els.push(b);}
  ctx.el.append(g,info);
  return {destroy(){}};
};

let overlay=null;
function closeOverlay(){if(overlay){overlay.remove();overlay=null;}}
function openOverlay(center=false){closeOverlay();overlay=h('div',{class:'ov'+(center?' center':'')});const sh=h('div',{class:'sheet',role:'dialog','aria-modal':'true'});overlay.append(sh);document.body.append(overlay);return sh;}
function toast(msg,ms=2600){const e=h('div',{class:'toast'},esc(msg));document.body.append(e);setTimeout(()=>e.remove(),ms);}

function renderTop(){
  const tm=$('#timer');const left=S.windowLeft;tm.textContent='⏱ '+fmtTime(Math.max(0,left)*1000);tm.classList.toggle('low',left<=120);

  $('#lang').textContent=S.lang==='en'?'हिं':'EN';

function scoreQuestion(q,qr,correct){
  const sc=S.mission.scoring,qs=sc.question,sk=sc.skillCredit;

  if(qr.first){S.streak++;}else S.streak=0;S.bestStreak=Math.max(S.bestStreak,S.streak);
  const mult=qr.first?qs.streak[Math.min(S.streak,qs.streak.length)-1]:1;
  const speed=correct?Math.round(qs.speedMax*Math.max(0,1-qr.timeMs/1000/q.targetSec)):0;
  qr.points=Math.round(base*mult)+speed;S.points+=qr.points;
  qr.credit=correct?Math.max(0,(qr.tries===1?sk.firstTry:qr.tries===2?sk.secondTry:sk.later)-(qr.peeked?sk.peekPenalty:0)):0;
  if(qr.first){S.coins+=sc.coins.perFirstTry;}
  log('question_scored',{q:q.id,comp:q.competency},{correct,first_try:qr.first,tries:qr.tries,peeked:qr.peeked,time_ms:Math.round(qr.timeMs),points:qr.points,skill_credit:qr.credit,streak:S.streak});
}

async function runCommander(sh){

    const q=c.questions[i];

      sh.innerHTML='';const body=h('div',{class:'intro',style:{alignItems:'stretch',textAlign:'left'}});
      body.append(h('div',{class:'eyebrow'},`${esc(t(UI.final))} ${i+1}/${c.questions.length}`));

        if(choice!=null&&!correct)btns[order.indexOf(choice)].classList.add('wrong');

        if(correct)SFX.good();else SFX.bad();
        const fbx=h('div',{class:'fb '+(correct?'good':'bad')},`<b>${correct?'✓ '+esc(t(UI.correct))+` <span class="pts">+${pts}</span>`:(choice==null?'⏱ '+esc(t(UI.timeUp)):'✗')}</b>`);body.append(fbx);
        setTimeout(()=>resolve({id:q.id,sp:q.superpower,comp:q.competency,correct,choice,ms,points:pts}),1000);};
      order.forEach((k,j)=>{const o=q.options[k];const b=h('button',{class:'opt'},(two?'':`<span class="k">${'ABCD'[j]}</span>`)+`<span>${esc(t(o.text))}</span>`);b.onclick=()=>{SFX.tap();finish(!!o.correct,k);};btns.push(b);box.append(b);});

  const list=h('div',{class:'res-list'});
  m.fixes.forEach(f=>{const fr=S.fixes[f.id];const first=f.questions.filter(q=>S.qres[q.id].first).length;
    list.append(h('div',{},`<span class="badge" style="--c:${SP[f.superpower].c}">${ICON[f.superpower]}</span><span class="l">${esc(t(f.label))}<br><small style="color:var(--muted);font-weight:600">${esc(t(SP[f.superpower]))} · ✓ ${first}/${f.questions.length}</small></span><em>${'★'.repeat(fr.stars)}${'☆'.repeat(3-fr.stars)}</em>`));});
  body.append(list);
  // crew board
  const board=h('div',{class:'board'});
  const drawBoard=(meId)=>{const rows=store.get(crewKey(),[]).sort((a,b)=>b.points-a.points).slice(0,10);board.innerHTML=`<h4>🏆 ${esc(t(UI.crew))}</h4>`;
    if(!rows.length)board.append(h('div',{class:'note'},esc(t({en:'No scores yet. Save yours first!',hi:'अभी कोई स्कोर नहीं। पहले अपना सेव करो!'}))));
    rows.forEach((x,i)=>board.append(h('div',{class:'r'+(x.id===meId?' me':'')},`<span>${i+1}</span><span>${esc(x.name)}</span><small>${x.acc}%</small><b>${fmt(x.points)}</b>`)));};
  const nameRow=h('div',{class:'namerow'});const inp=h('input',{id:'crewName',maxlength:'14',placeholder:t(UI.yourName),value:store.get('fsl.name','')});
  const saveBtn=h('button',{class:'big',style:{padding:'8px 16px',fontSize:'17px'}},t(UI.save));
  saveBtn.onclick=()=>{const name=(inp.value||'').trim().slice(0,14)||'Player';store.set('fsl.name',name);const rows=store.get(crewKey(),[]);if(!rows.find(x=>x.id===S.run.run_id))rows.push({id:S.run.run_id,name,points:S.points,acc,date:new Date().toISOString().slice(0,10)});store.set(crewKey(),rows.sort((a,b)=>b.points-a.points).slice(0,50));S.run.player_name=name;saveRun();log('crew_save',{},{name});saveBtn.disabled=true;drawBoard(S.run.run_id);};
  nameRow.append(inp,saveBtn);
  drawBoard();
  body.append(nameRow,board);
  const row=h('div',{class:'row'});const linkMsg=h('div',{class:'note'});
  row.append(h('button',{class:'big',onclick:()=>shareCard()},t(UI.share)));
  row.append(h('button',{class:'big alt',onclick:()=>copyChallenge(linkMsg)},t(UI.copyLink)));
  row.append(h('button',{class:'big alt',onclick:()=>restart()},t(UI.playAgain)));
  body.append(row,linkMsg,h('div',{class:'note'},esc(t(UI.starNote))));
  sh.append(body);
}
function challengeUrl(){const u=location.href.split('#')[0];return `${u}#beat-${Math.round(S.points)}`;}
function copyChallenge(el){const url=challengeUrl();log('share',{},{kind:'link'});
  const fail=()=>{el.innerHTML=`${esc(t(UI.copyFail))}<br><span style="user-select:text;-webkit-user-select:text;color:var(--ink)">${esc(url)}</span>`;};
  try{navigator.clipboard.writeText(url).then(()=>{el.textContent=t(UI.copied);},fail);}catch(e){fail();}}
function roundRect(g,x,y,w,hh,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+hh,r);g.arcTo(x+w,y+hh,x,y+hh,r);g.arcTo(x,y+hh,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
async function shareCard(){
  log('share',{},{kind:'card'});try{await document.fonts.ready;}catch(e){}
  const W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#060A26');gr.addColorStop(.6,'#1D1A5C');gr.addColorStop(1,'#4B2C7A');g.fillStyle=gr;g.fillRect(0,0,W,H);
  const r=rnd(5);for(let i=0;i<140;i++){g.fillStyle=`rgba(255,255,255,${.3+r()*.7})`;g.beginPath();g.arc(r()*W,r()*H,r()*3+1,0,6.3);g.fill();}
  const F="'Baloo 2','Nirmala UI','Noto Sans Devanagari',sans-serif";
  g.textAlign='center';g.fillStyle='#FFC83D';g.font=`700 40px ${F}`;g.fillText(`FSL · ${t(S.mission.title)}`,W/2,110);
  g.save();g.translate(W/2,400);g.fillStyle='#FF8A3D';g.beginPath();g.ellipse(0,230,50,110,0,0,6.3);g.fill();g.fillStyle='#FFF0A8';g.beginPath();g.ellipse(0,200,24,60,0,0,6.3);g.fill();
  g.fillStyle='#FF5D73';g.beginPath();g.moveTo(0,-200);g.bezierCurveTo(-40,-140,-60,-90,-60,-50);g.lineTo(60,-50);g.bezierCurveTo(60,-90,40,-140,0,-200);g.fill();
  g.fillStyle='#EEF1FF';g.fillRect(-60,-52,120,240);g.fillStyle='#4EA8FF';g.beginPath();g.arc(0,20,30,0,6.3);g.fill();g.fillStyle='#FF5D73';g.beginPath();g.moveTo(-60,110);g.lineTo(-120,200);g.lineTo(-60,190);g.fill();g.beginPath();g.moveTo(60,110);g.lineTo(120,200);g.lineTo(60,190);g.fill();g.restore();
  const rk=rankFor(S.points).r;
  g.fillStyle='#F5F6FF';g.font=`700 44px ${F}`;g.fillText(t(UI.cardScored),W/2,780);
  g.fillStyle='#FFC83D';g.font=`800 170px ${F}`;g.fillText(fmt(S.points),W/2,940);
  g.fillStyle='#B39BFF';g.font=`800 60px ${F}`;g.fillText(t(rk),W/2,1020);
  const acc=Math.round(S.run.first_try_correct/S.run.questions*100);
  g.fillStyle='#AEB5E8';g.font=`700 38px ${F}`;g.fillText(`${acc}% ${t(UI.accuracy)}  ·  ★ ${S.run.stars}/18`,W/2,1085);
  const fs=S.mission.fixes;const bw=120,gap=26,x0=(W-(fs.length*bw+(fs.length-1)*gap))/2;
  fs.forEach((f,i)=>{const x=x0+i*(bw+gap),y=1120;g.fillStyle=SP[f.superpower].hex;roundRect(g,x,y,bw,90,24);g.fill();g.fillStyle='#0A0E2E';g.font=`800 36px ${F}`;g.fillText('★'.repeat(S.fixes[f.id].stars),x+bw/2,y+60);});
  g.fillStyle='#F5F6FF';g.font=`800 56px ${F}`;g.fillText(t(UI.cardBeat),W/2,1300);
  const url=cv.toDataURL('image/png');
  try{const blob=await (await fetch(url)).blob();const file=new File([blob],'fsl-rocket-score.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:`${t(UI.cardBeat)} ${challengeUrl()}`});return;}}catch(e){}
  const sh=openOverlay(true);const b=h('div',{class:'intro'});b.append(h('img',{src:url,class:'cardimg',alt:'Score card'}),h('div',{class:'note'},esc(t(UI.saveCard))));
  b.append(h('button',{class:'big alt',onclick:()=>showResults()},t(UI.back)));sh.append(b);
}

/* ---------- intro ---------- */
function showIntro(){
  const m=S.mission;const sh=openOverlay(true);const body=h('div',{class:'intro'});
  const beat=S.beat!=null?`<div class="beat">${esc(t(UI.beatBanner,{n:fmt(S.beat)}))}</div>`:'';
  body.innerHTML=`<div class="eyebrow">${esc(t(UI.eyebrow))} ${m.band}</div><h1>${esc(t(m.title))}</h1>${beat}<p>${esc(t(m.story))}</p>
   <div class="howto"><div><b>${Math.round(m.windowSec/60)}</b>${esc(t(UI.window))}</div><div><b>${m.fixes.length}</b>${esc(t(UI.jobs))}</div><div><b>${Object.keys(S.qres).length}+${m.commander.questions.length}</b>${esc(t(UI.qs))}</div></div>`;
  const row=h('div',{class:'sprow'});m.fixes.forEach(f=>row.append(h('div',{},`<span class="badge" style="--c:${SP[f.superpower].c}">${ICON[f.superpower]}</span>${esc(t(SP[f.superpower]))}`)));
  body.append(row,h('button',{class:'big',onclick:()=>{SFX.ensure();closeOverlay();newRun();S.phase='play';S.run.lang=S.lang;S.run.started_at=new Date().toISOString();log('run_start',{},{beat_target:S.beat});startClock();renderTop();renderFixbar();renderScene();}},t(UI.start)+' ⏱'));
  body.append(h('button',{class:'iconbtn',onclick:()=>{S.lang=S.lang==='en'?'hi':'en';store.set('fsl.lang',S.lang);renderTop();renderScene();showIntro();}},S.lang==='en'?'हिंदी में खेलो':'Play in English'));
  sh.append(body);
}
function restart(){closeOverlay();clearInterval(clockId);const rk=$('#rocket');if(rk){rk.style.transition='none';rk.style.transform='';}newRun();renderTop();renderFixbar();renderScene();showIntro();}

/* ---------- debug / log ---------- */
let logoTaps=0,logoTimer=null;
function showLog(){
  const sh=openOverlay(true);const b=h('div',{class:'intro',style:{alignItems:'stretch',textAlign:'left'}});
  const runs=store.get('fsl.missionRuns.v2',[]);const cur={run:S.run,question_results:S.run?questionResults():[],events:S.events};
  b.append(h('h1',{style:{fontSize:'22px'}},esc(t(UI.log))));const pre=h('pre',{class:'dbg'});pre.textContent=JSON.stringify({current:cur,saved_runs:runs.length},null,1);b.append(pre);
  const row=h('div',{class:'row'});const msg=h('div',{class:'note'});
  row.append(h('button',{class:'big alt',onclick:()=>{try{navigator.clipboard.writeText(JSON.stringify(runs,null,1)).then(()=>msg.textContent='Copied',()=>msg.textContent='Select the text above to copy');}catch(e){msg.textContent='Select the text above to copy';}}},t(UI.copyLog)));
  row.append(h('button',{class:'big',onclick:()=>{closeOverlay();if(S.phase==='intro')showIntro();}},t(UI.close)));
  b.append(row,msg);sh.append(b);
}

/* ---------- boot ---------- */
async function boot(){
  let m=null;const qs=new URLSearchParams(location.search);
  if(qs.get('mission')){try{m=await (await fetch(qs.get('mission'))).json();}catch(e){}}
  if(!m){try{m=JSON.parse($('#mission-data').textContent);}catch(e){document.body.innerHTML='<p style="padding:20px">Mission file could not be read.</p>';return;}}
  S.mission=m;
  S.lang=store.get('fsl.lang',qs.get('lang')||'en');if(!['en','hi'].includes(S.lang))S.lang='en';
  S.sound=store.get('fsl.sound',true);
  const hm=/^#beat-(\d{1,6})$/.exec(location.hash);if(hm)S.beat=+hm[1];else if(qs.get('beat'))S.beat=+qs.get('beat')||null;
  newRun();renderTop();renderFixbar();layoutScene();renderScene();
  addEventListener('resize',layoutScene);
  $('#lang').onclick=()=>{S.lang=S.lang==='en'?'hi':'en';store.set('fsl.lang',S.lang);if(S.run)S.run.lang=S.lang;renderTop();renderFixbar();renderScene();
    if(S.openFix&&S.openFix.ctl){const ctl=S.openFix.ctl;ctl.setTitle();if(!ctl.r.learnDone)showLearn(ctl,0,false);else showQuestion(ctl);}else if(S.phase==='intro')showIntro();else if(S.phase==='results')showResults();};
  $('#snd').onclick=()=>{S.sound=!S.sound;store.set('fsl.sound',S.sound);renderTop();};
  $('#timer').onclick=()=>{logoTaps++;clearTimeout(logoTimer);logoTimer=setTimeout(()=>logoTaps=0,1500);if(logoTaps>=5){logoTaps=0;showLog();}};
  if(location.hash==='#debug')showLog();else showIntro();
  window.__fsl={S,openFix,openCommander,launch};
}
boot();
