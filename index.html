<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Future Star League: 7 skill Arenas, 35 hands-on challenges. Find your Superpower.">
<title>FSL Arena Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-column game console, max 760px; each challenge = SVG simulation stage + control strip */
:root {
  --bg: #EEF5FB; --surface: #FFFFFF; --ink: #13233A; --muted: #55657C; --line: #D3DEEA;
  --sky: #F6FAFF; --ground: #B9C9A0; --water: #8ACDF2; --wood: #C98A4B; --metal: #8A97A8; --paper: #FFFFFF;
  --sun: #FFC93C; --brand: #FF6B1A; --good: #1E9E5A; --bad: #D93A3A;
  --good-soft: #E1F5EA; --bad-soft: #FBE5E5; --shadow: 0 3px 0 #C3D2E2;
  --lab: #00A3C4; --logic: #6C4BD8; --build: #E8891A; --vision: #D6418A;
  --idea: #C99400; --speed: #E5452B; --mission: #2E8B57;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1626; --surface: #16233A; --ink: #EAF1FA; --muted: #9DB0C8; --line: #2A3B57;
  --sky: #10203A; --ground: #3F5A3A; --water: #2E77A8; --wood: #9A6634; --metal: #6F7E92; --paper: #DCE6F2;
  --good-soft: #143826; --bad-soft: #3E1A1E; --shadow: 0 3px 0 #08101C; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0D1626; --surface: #16233A; --ink: #EAF1FA; --muted: #9DB0C8; --line: #2A3B57;
  --sky: #10203A; --ground: #3F5A3A; --water: #2E77A8; --wood: #9A6634; --metal: #6F7E92; --paper: #DCE6F2;
  --good-soft: #143826; --bad-soft: #3E1A1E; --shadow: 0 3px 0 #08101C; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.badge { font-family: var(--display); font-weight: 800; font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
  background: var(--brand); color: #fff; padding: 4px 12px; border-radius: 999px; }
.xp { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--muted); }
.hero { margin-block: 18px 22px; }
.hero h1 { font-size: clamp(34px, 8vw, 52px); font-weight: 800; }
.hero h1 span { color: var(--brand); }
.hero p { margin: 8px 0 0; color: var(--muted); max-width: 58ch; }
.name-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.name-row label { font-weight: 800; }
.name-row input { flex: 1 1 200px; min-width: 0; font: inherit; padding: 10px 14px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.tile { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 18px;
  padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; transition: transform .12s; }
.tile:hover { transform: translateY(-2px); border-color: var(--c); }
.glyph { width: 44px; height: 44px; border-radius: 12px; background: var(--c); display: grid; place-items: center; flex: none; }
.glyph svg { width: 26px; height: 26px; }
.tile h3 { font-size: 22px; font-weight: 800; }
.tile .power { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
.tile .desc { font-size: 14px; color: var(--muted); }
.tile .best { font-size: 13px; font-weight: 800; margin-top: auto; padding-top: 6px; font-variant-numeric: tabular-nums; }
.stars { color: var(--sun); letter-spacing: 2px; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; }
.btn { font-family: var(--display); font-weight: 800; font-size: 18px; border: 0; border-radius: 14px; padding: 10px 20px;
  background: var(--brand); color: #fff; box-shadow: 0 4px 0 #B84400; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #B84400; }
.btn.ghost { background: var(--surface); color: var(--ink); border: 2px solid var(--line); box-shadow: var(--shadow); }
.btn.sm { font-size: 15px; padding: 7px 14px; }
.btn.on { background: var(--c, var(--brand)); color: #fff; border-color: transparent; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.note { font-size: 13px; color: var(--muted); margin-top: 18px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--c); color: #fff;
  border-radius: 16px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.bar .glyph { width: 36px; height: 36px; background: rgba(255,255,255,.2); }
.bar h2 { font-size: 22px; font-weight: 800; flex: 1 1 auto; }
.bar .meta { font-weight: 800; font-variant-numeric: tabular-nums; }
.bar .quit { background: rgba(255,255,255,.2); border: 0; border-radius: 10px; padding: 4px 10px; font-weight: 800; color: #fff; }
.dots { display: flex; gap: 6px; margin: 14px 0 10px; }
.dot { flex: 1; height: 8px; border-radius: 99px; background: var(--line); }
.dot.ok { background: var(--good); } .dot.no { background: var(--bad); } .dot.now { background: var(--c); }
.timer-row { display: flex; align-items: center; gap: 10px; font-weight: 800; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
.timer { flex: 1; height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: var(--c); transform-origin: left; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 18px; margin-top: 14px; box-shadow: var(--shadow); }
.story { font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
.q { font-family: var(--display); font-size: clamp(19px, 4.2vw, 24px); font-weight: 700; margin-top: 4px; }
.play { margin-top: 12px; display: grid; gap: 12px; }
.stage { width: 100%; height: auto; display: block; background: var(--sky); border-radius: 14px; border: 2px solid var(--line);
  touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ctrl label { font-weight: 800; font-size: 14px; }
.ctrl input[type=range], .row input[type=range] { flex: 1 1 180px; min-width: 0; accent-color: var(--c); height: 28px; }
.msg { font-weight: 800; min-height: 1.5em; font-size: 15px; }
.msg.good { color: var(--good); } .msg.bad { color: var(--bad); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--bg);
  font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
.rows { display: grid; gap: 8px; width: 100%; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row .nm { flex: 1 1 120px; font-weight: 800; }
.clues { display: grid; gap: 4px; font-weight: 700; font-size: 15px; }
.lbl { fill: var(--ink); font: 700 12px var(--body); pointer-events: none; }
.lbl.sm { font-size: 10px; } .lbl.big { font: 800 22px var(--display); }
.tap { cursor: pointer; }
.cube3d { width: 90px; height: 90px; margin: 10px auto; perspective: 400px; }
.cube3d .in { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; animation: spin 4s linear infinite; }
.cube3d .f { position: absolute; inset: 0; border: 3px solid var(--ink); background: color-mix(in srgb, var(--vision) 60%, transparent); }
@keyframes spin { from { transform: rotateX(-25deg) rotateY(0); } to { transform: rotateX(-25deg) rotateY(360deg); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.shake { animation: shake .3s 2; }
.explain { margin-top: 14px; border-radius: 14px; padding: 14px 16px; border: 2px dashed var(--c); }
.explain h4 { margin: 0 0 4px; font-family: var(--display); font-size: 19px; }
.explain p { margin: 0; }
.explain .pts { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--good); }
.next-row { display: flex; justify-content: flex-end; margin-top: 14px; }
.result-head { text-align: center; margin-top: 18px; }
.result-head .big { font-family: var(--display); font-size: 64px; font-weight: 800; color: var(--c); line-height: 1; font-variant-numeric: tabular-nums; }
.result-head .stars { font-size: 34px; }
.powers { display: grid; gap: 10px; margin-top: 14px; }
.prow { display: grid; grid-template-columns: 150px 1fr 48px; gap: 10px; align-items: center; font-weight: 800; font-size: 14px; }
@media (max-width: 460px) { .prow { grid-template-columns: 110px 1fr 40px; font-size: 13px; } }
.prow .track { height: 14px; border-radius: 99px; background: var(--line); overflow: hidden; }
.prow .fill { display: block; height: 100%; background: var(--c); border-radius: 99px; }
.prow .val { text-align: right; font-variant-numeric: tabular-nums; }
.prow.unplayed { color: var(--muted); }
.share { font-size: 14px; background: var(--bg); border-radius: 12px; padding: 12px; margin-top: 12px; white-space: pre-wrap; }
@media (prefers-reduced-motion: reduce) { .tile, .cube3d .in { transition: none; animation: none; } }
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
/* ---------- helpers ---------- */
const NS = "http://www.w3.org/2000/svg";
function S(p, tag, a = {}, txt) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; if (p) p.appendChild(e); return e; }
function stage(el, w = 360, h = 220) { return S(el, "svg", { viewBox: `0 0 ${w} ${h}`, class: "stage" }); }
function T(p, x, y, txt, cls = "lbl", extra = {}) { return S(p, "text", Object.assign({ x, y, class: cls, "text-anchor": "middle" }, extra), txt); }
function F(c) { return `fill:${c}`; }
function SK(c, w = 2) { return `stroke:${c};stroke-width:${w};fill:none`; }
function div(el, cls, html = "") { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; el.appendChild(d); return d; }
function btn(p, label, cls = "btn sm ghost") { const b = document.createElement("button"); b.className = cls; b.innerHTML = label; p.appendChild(b); return b; }
function tween(ms, fn) { return new Promise(r => { const t0 = performance.now(); const f = t => { const p = Math.max(0, Math.min(1, (t - t0) / ms)); fn(p); p < 1 ? requestAnimationFrame(f) : r(); }; requestAnimationFrame(f); }); }
const wait = ms => new Promise(r => setTimeout(r, ms));
const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
function msg(el) { const m = div(el, "msg"); return (t, k = "") => { m.textContent = t; m.className = "msg " + k; }; }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function ground(s, w = 360, y = 205, h = 20) { S(s, "rect", { x: 0, y, width: w, height: h, style: F("var(--ground)") }); }
function stepper(p, label, min, max, val) {
  const r = div(p, "ctrl"); r.innerHTML = `<label>${label}</label>`;
  const m = btn(r, "−"), c = document.createElement("span"); c.className = "chip"; c.style.minWidth = "44px"; c.style.justifyContent = "center"; r.appendChild(c);
  const pl = btn(r, "+"); const o = { v: val, el: r, on: null }; const show = () => { c.textContent = o.v; if (o.on) o.on(); }; show();
  m.onclick = () => { o.v = Math.max(min, o.v - 1); show(); }; pl.onclick = () => { o.v = Math.min(max, o.v + 1); show(); };
  return o;
}
function gearPath(r, teeth) {
  let d = ""; const n = teeth * 2;
  for (let i = 0; i < n; i++) { const a0 = (i / n) * Math.PI * 2, a1 = ((i + 1) / n) * Math.PI * 2, rr = i % 2 ? r - 7 : r;
    d += (i ? "L" : "M") + (rr * Math.cos(a0)).toFixed(1) + "," + (rr * Math.sin(a0)).toFixed(1) + "L" + (rr * Math.cos(a1)).toFixed(1) + "," + (rr * Math.sin(a1)).toFixed(1); }
  return d + "Z";
}

/* ---------- 35 interactive challenges ---------- */
const ARENAS = [
{ id: "lab", name: "Crazy Lab", power: "Science Sense", color: "var(--lab)",
  desc: "Run Amit's experiments. Predict, test and watch what really happens.",
  icon: '<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.5 15h9" stroke="#fff" stroke-width="2"/>',
  qs: [
  { s: "The Falling Race", t: 40, q: "Amit will open the trapdoor under a heavy bowling ball and a light cricket ball. Predict, then drop!",
    e: "Gravity speeds up heavy and light things at the same rate. Only air slows very light, fluffy things like feathers.",
    mount(el, api) {
      const s = stage(el, 360, 240); ground(s, 360, 220);
      S(s, "rect", { x: 60, y: 12, width: 8, height: 208, style: F("var(--metal)") });
      const door = S(s, "rect", { x: 70, y: 38, width: 230, height: 8, rx: 3, style: F("var(--wood)") });
      const big = S(s, "circle", { cx: 130, cy: 20, r: 18, style: F("var(--ink)") });
      const sm = S(s, "circle", { cx: 240, cy: 30, r: 8, style: F("var(--speed)") });
      T(s, 130, 236, "Bowling ball", "lbl sm"); T(s, 240, 236, "Cricket ball", "lbl sm");
      const c = div(el, "ctrl"), say = msg(el);
      [["Bowling ball first", "big"], ["Cricket ball first", "small"], ["Same time", "same"]].forEach(([l, k]) => {
        const b = btn(c, l); b.onclick = async () => {
          c.querySelectorAll("button").forEach(x => x.disabled = true); b.classList.add("on"); say("Trapdoor opening...");
          await tween(250, p => door.setAttribute("transform", `rotate(${p * 80} 70 42)`));
          await tween(900, p => { const d = 182 * p * p; big.setAttribute("cy", 20 + d); sm.setAttribute("cy", 30 + d); });
          say("Thud! Both landed together.", k === "same" ? "good" : "bad"); await wait(600); api.done(k === "same");
        };
      });
    } },
  { s: "Shadow Maker", t: 50, q: "Slide the torch so the robot's shadow exactly fills the dotted box on the wall.",
    e: "The closer the torch is to the robot, the wider the cone of light it blocks, so the shadow grows. Move it away and the shadow shrinks.",
    mount(el, api) {
      const s = stage(el, 360, 230), cy = 115, toyX = 220, wallX = 330;
      S(s, "rect", { x: wallX, y: 10, width: 24, height: 210, style: F("var(--paper)") });
      const cone = S(s, "polygon", { style: "fill:var(--sun);opacity:.35" });
      const shadow = S(s, "rect", { x: wallX, width: 8, style: F("var(--ink)") });
      S(s, "rect", { x: wallX - 2, y: cy - 60, width: 12, height: 120, style: "fill:none;stroke:var(--speed);stroke-width:2;stroke-dasharray:5 4" });
      S(s, "rect", { x: toyX - 8, y: cy - 20, width: 16, height: 40, rx: 4, style: F("var(--lab)") });
      const torch = S(s, "g", {}); S(torch, "rect", { x: -26, y: -8, width: 26, height: 16, rx: 3, style: F("var(--metal)") }); S(torch, "rect", { x: -2, y: -11, width: 6, height: 22, style: F("var(--sun)") });
      T(s, 342, 228, "Wall", "lbl sm");
      const c = div(el, "ctrl"); c.innerHTML = `<label for="tor">Torch</label><input id="tor" type="range" min="20" max="200" value="40">`;
      const lock = btn(c, "Lock it", "btn sm"); const say = msg(el); const r = c.querySelector("input");
      let half = 0;
      const draw = () => { const tx = +r.value; half = 20 * (wallX - tx) / (toyX - tx);
        torch.setAttribute("transform", `translate(${tx} ${cy})`);
        shadow.setAttribute("y", cy - half); shadow.setAttribute("height", 2 * half);
        cone.setAttribute("points", `${tx + 4},${cy} ${wallX},${cy - half} ${wallX},${cy + half}`);
        say(`Shadow height: ${Math.round(2 * half)} cm  (target 120 cm)`); };
      r.oninput = draw; draw();
      lock.onclick = () => { const ok = Math.abs(half - 60) <= 5; r.disabled = true; lock.disabled = true;
        say(ok ? "Perfect fit!" : `Shadow is ${Math.round(2 * half)} cm, not 120 cm.`, ok ? "good" : "bad"); setTimeout(() => api.done(ok), 700); };
    } },
  { s: "Float or Sink?", t: 60, q: "Sort each object as FLOAT or SINK, then drop them all into the tank to test.",
    e: "An iron boat floats because its hollow shape pushes aside lots of water. An orange's peel is full of tiny air pockets. A solid nail and coin push aside too little water, so they sink.",
    mount(el, api) {
      const items = [{ n: "Iron nail", f: false, col: "var(--metal)" }, { n: "Iron boat", f: true, col: "var(--metal)" }, { n: "Orange", f: true, col: "var(--build)" }, { n: "Steel coin", f: false, col: "var(--sun)" }];
      const s = stage(el, 360, 220);
      S(s, "rect", { x: 20, y: 70, width: 320, height: 140, rx: 6, style: "fill:none;stroke:var(--metal);stroke-width:4" });
      S(s, "rect", { x: 22, y: 100, width: 316, height: 108, style: F("var(--water)") + ";opacity:.75" });
      const shapes = items.map((it, i) => { const g = S(s, "g", { transform: `translate(${60 + i * 80} 35)` });
        if (i === 0) S(g, "rect", { x: -3, y: -16, width: 6, height: 32, style: F(it.col) });
        if (i === 1) S(g, "path", { d: "M-24,-6 L24,-6 L16,10 L-16,10 Z", style: F(it.col) });
        if (i === 2) S(g, "circle", { r: 13, style: F(it.col) });
        if (i === 3) S(g, "ellipse", { rx: 10, ry: 4, style: F(it.col) });
        return g; });
      items.forEach((it, i) => T(s, 60 + i * 80, 64, it.n, "lbl sm"));
      const rows = div(el, "rows"), pick = {};
      items.forEach((it, i) => { const r = div(rows, "row", `<span class="nm">${it.n}</span>`);
        const a = btn(r, "Float"), b = btn(r, "Sink");
        a.onclick = () => { pick[i] = true; a.classList.add("on"); b.classList.remove("on"); };
        b.onclick = () => { pick[i] = false; b.classList.add("on"); a.classList.remove("on"); }; });
      const c = div(el, "ctrl"), go = btn(c, "Drop into tank", "btn sm"), say = msg(el);
      go.onclick = async () => {
        if (Object.keys(pick).length < 4) return say("Sort all 4 objects first.", "bad");
        rows.querySelectorAll("button").forEach(x => x.disabled = true); go.disabled = true;
        await tween(1400, p => shapes.forEach((g, i) => { const end = items[i].f ? 98 : 196; const y = 35 + (end - 35) * ease(p); g.setAttribute("transform", `translate(${60 + i * 80} ${y})`); }));
        const right = items.filter((it, i) => pick[i] === it.f).length;
        say(`${right} of 4 predictions correct.`, right === 4 ? "good" : "bad"); await wait(700); api.done(right === 4);
      };
    } },
  { s: "The Melting Ice", t: 50, q: "The glass is full and a big ice cube is floating. Drag the marker to where the water will be after the ice melts, then melt it.",
    e: "Floating ice already pushes aside exactly its own weight of water. When it melts it becomes exactly that much water, so the level stays the same.",
    mount(el, api) {
      const s = stage(el, 360, 230), lvl = 70;
      S(s, "rect", { x: 120, y: 40, width: 120, height: 170, style: "fill:none;stroke:var(--metal);stroke-width:4" });
      T(s, 100, 44, "Rim", "lbl sm");
      S(s, "rect", { x: 122, y: lvl, width: 116, height: 138, style: F("var(--water)") + ";opacity:.8" });
      const ice = S(s, "rect", { x: 150, y: lvl - 14, width: 50, height: 46, rx: 6, style: "fill:var(--paper);stroke:var(--water);stroke-width:2;opacity:.95" });
      const mk = S(s, "g", {}); S(mk, "line", { x1: 110, x2: 250, y1: 0, y2: 0, style: "stroke:var(--speed);stroke-width:3;stroke-dasharray:6 4" }); S(mk, "text", { x: 256, y: 4, class: "lbl sm" }, "Your guess");
      const c = div(el, "ctrl"); c.innerHTML = `<label for="lv">Water after melting</label><input id="lv" type="range" min="20" max="125" value="105">`;
      const go = btn(c, "Melt the ice", "btn sm"), say = msg(el), r = c.querySelector("input");
      const yOf = () => 140 - (+r.value - 20);
      const draw = () => { const y = yOf(); mk.setAttribute("transform", `translate(0 ${y})`); say(y < 40 ? "Your guess: water spills over the rim" : y < lvl - 3 ? "Your guess: water rises" : y > lvl + 3 ? "Your guess: water goes down" : "Your guess: level stays the same"); };

      go.onclick = async () => { r.disabled = true; go.disabled = true; const y = yOf();

    <div class="actions"><button class="btn" id="go">Play all 7 Arenas</button>
      <button class="btn ghost" id="card" ${played ? "" : "disabled"}>My Superpowers card (${played}/7)</button></div>
    <p class="note">Demo set pitched at Grades 5 to 8. Progress is saved on this device only.</p>`;
  const n = document.getElementById("pname"); n.addEventListener("input", () => { save.name = n.value.trim(); persist(); });
  app.querySelectorAll("[data-arena]").forEach(b => b.onclick = () => start([b.dataset.arena]));
  document.getElementById("go").onclick = () => start(ARENAS.map(a => a.id));
  document.getElementById("card").onclick = card;
}
function start(queue) { run = { queue, ai: 0 }; beginArena(); }
function beginArena() { run.arena = ARENAS.find(x => x.id === run.queue[run.ai]); run.qi = 0; run.score = 0; run.correct = 0; run.streak = 0; run.marks = []; ask(); }

function ask() {
  clearAll(); const a = run.arena, item = a.qs[run.qi]; run.locked = false; run.t0 = performance.now(); const myRun = run, myQ = run.qi;
  app.innerHTML = `
    <div class="bar" style="--c:${a.color}">${glyph(a)}<h2>${a.name}</h2><span class="meta">${run.score} pts${run.streak > 1 ? ` · ${run.streak} streak` : ""}</span><button class="quit" id="quit">Exit</button></div>
    <div style="--c:${a.color}">
      <div class="dots">${a.qs.map((_, i) => `<span class="dot ${run.marks[i] === true ? "ok" : run.marks[i] === false ? "no" : i === run.qi ? "now" : ""}"></span>`).join("")}</div>
      <div class="timer-row"><span id="secs">${item.t}s</span><div class="timer"><i id="tbar"></i></div></div>
      <div class="card"><div class="story">Challenge ${run.qi + 1} of 5 · ${esc(item.s)}</div><div class="q">${esc(item.q)}</div><div class="play" id="play"></div><div id="fb"></div></div>
    </div>`;
  document.getElementById("quit").onclick = home;
  const live = () => run === myRun && run.qi === myQ && !run.locked;
  const api = { done: ok => { if (live()) finish(ok); }, every: (fn, ms) => timers.push(setInterval(() => { if (live()) fn(); }, ms)) };
  item.mount(document.getElementById("play"), api);
  const bar = document.getElementById("tbar"), secs = document.getElementById("secs");
  tick = setInterval(() => { const left = Math.max(0, item.t - (performance.now() - run.t0) / 1000);
    bar.style.transform = `scaleX(${left / item.t})`; secs.textContent = Math.ceil(left) + "s"; if (left <= 0) finish(false, true); }, 100);
}

function finish(ok, timeout) {
  if (run.locked) return; run.locked = true; clearAll();
  const a = run.arena, item = a.qs[run.qi], used = (performance.now() - run.t0) / 1000; let pts = 0, line;
  if (ok) { run.correct++; run.streak++; const speed = Math.round(50 * Math.max(0, 1 - used / item.t)), sb = run.streak > 1 ? (run.streak - 1) * 10 : 0; pts = 100 + speed + sb;
    line = `<span class="pts">+${pts} pts</span> (100 solved, +${speed} speed${sb ? `, +${sb} streak` : ""})`; }
  else { run.streak = 0; line = timeout ? "Time's up!" : "Not this time."; }
  run.score += pts; run.marks[run.qi] = ok;
  document.getElementById("play").querySelectorAll("button,input").forEach(b => b.disabled = true);
  const last = run.qi === a.qs.length - 1;
  document.getElementById("fb").innerHTML = `<div class="explain"><h4>${ok ? "Solved!" : "Amit explains"}</h4><p>${line}</p><p style="margin-top:6px">${esc(item.e)}</p></div>
    <div class="next-row"><button class="btn" id="next">${last ? "See Arena result" : "Next challenge"}</button></div>`;
  const nx = document.getElementById("next"); nx.focus({ preventScroll: true }); nx.scrollIntoView({ behavior: "smooth", block: "nearest" });
  nx.onclick = () => { if (last) arenaDone(); else { run.qi++; ask(); window.scrollTo({ top: 0 }); } };
}

function arenaDone() {
  const a = run.arena, prev = save.best[a.id], isBest = !prev || run.score > prev.score;
  if (isBest) save.best[a.id] = { score: run.score, correct: run.correct }; save.xp += run.score; persist();
  const more = run.ai < run.queue.length - 1;
  app.innerHTML = `<div class="bar" style="--c:${a.color}">${glyph(a)}<h2>${a.name} complete</h2><span class="meta">${a.power}</span></div>
    <div class="result-head" style="--c:${a.color}"><div class="stars">${starsFor(run.correct)}</div><div class="big">${run.score}</div><p><b>${run.correct} of 5 solved</b>${isBest && prev ? " · New best!" : ""}</p></div>
    <div class="actions" style="justify-content:center">${more ? `<button class="btn" id="cont">Next Arena: ${ARENAS.find(x => x.id === run.queue[run.ai + 1]).name}</button>` : `<button class="btn" id="cardb">See my Superpowers</button>`}
      <button class="btn ghost" id="again">Play again</button><button class="btn ghost" id="homeb">All Arenas</button></div>`;
  window.scrollTo({ top: 0 });
  if (more) document.getElementById("cont").onclick = () => { run.ai++; beginArena(); }; else document.getElementById("cardb").onclick = card;
  document.getElementById("again").onclick = () => start([a.id]); document.getElementById("homeb").onclick = home;
}

function card() {
  clearAll(); const vals = ARENAS.map(a => ({ a, v: save.best[a.id] ? save.best[a.id].correct * 20 : null })), pl = vals.filter(x => x.v !== null);
  const top = pl.slice().sort((x, y) => y.v - x.v || save.best[y.a.id].score - save.best[x.a.id].score)[0], who = save.name || "Future Star";
  const shareText = `${who}'s Superpowers on Future Star League\nTop power: ${top ? top.a.power : "-"}\n` + pl.map(x => `${x.a.power}: ${x.v}/100`).join("\n") + `\nTotal: ${save.xp} XP`;
  app.innerHTML = `<div class="top"><span class="badge">Superpowers card</span><span class="xp">${save.xp} XP</span></div>
    <div class="card" style="--c:${top ? top.a.color : "var(--brand)"}"><div class="story">${esc(who)}</div>
      <h2 style="font-size:32px;margin-top:4px">Top power: <span style="color:var(--c)">${top ? top.a.power : "Play an Arena"}</span></h2>
      <div class="powers">${vals.map(({ a, v }) => `<div class="prow ${v === null ? "unplayed" : ""}" style="--c:${a.color}"><span>${a.power}</span><span class="track"><span class="fill" style="width:${v || 0}%"></span></span><span class="val">${v === null ? "–" : v}</span></div>`).join("")}</div>
      <div class="share" id="sharetext">${esc(shareText)}</div>
      <div class="actions"><button class="btn" id="copy">Copy for WhatsApp</button><button class="btn ghost" id="homeb">All Arenas</button></div>
      <p class="note" id="copied" hidden>Copied. Paste it into WhatsApp.</p></div>`;
  window.scrollTo({ top: 0 });
  document.getElementById("homeb").onclick = home;
  const sel = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("sharetext")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  document.getElementById("copy").onclick = () => { try { navigator.clipboard.writeText(shareText).then(() => document.getElementById("copied").hidden = false, sel); } catch (e) { sel(); } };
}
home();
</script>
</body>
</html>
