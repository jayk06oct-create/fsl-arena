<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="FSL Round 2 mission: fix the rocket and launch it.">
</head>
<body>
<title>Space Rocket Launch Day</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: one-screen mission room. Top bar + lock bar, illustrated scene fills the rest, mini-games slide up as sheets. Single dark "space" look by design. */
:root{
  color-scheme:dark;
  --space:#0A0E2E; --panel:#171D52; --panel2:#222A6E; --raise:#2C3584;
  --ink:#F5F6FF; --muted:#AEB5E8; --line:rgba(255,255,255,.14);
  --sun:#FFC83D; --good:#3DDC97; --bad:#FF5D73;
  --sp1:#FFC83D; --sp2:#B39BFF; --sp3:#2ED3C0; --sp4:#FF8A5C; --sp5:#4EA8FF; --sp6:#FF7EC8;
  --font:'Baloo 2','Nirmala UI','Noto Sans Devanagari','Mangal',system-ui,sans-serif;
  --r:18px;
}
html,body{height:100%}
body{background:var(--space);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-size:16px;line-height:1.3}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));gap:6px;padding-block:6px}
.top{display:flex;align-items:center;gap:8px}
.brand{flex:1;min-width:0;line-height:1.05;background:none;text-align:left;padding:0}
.brand small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand b{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-weight:700;font-size:15px;white-space:nowrap}
.chip.combo{background:linear-gradient(90deg,#FF7A3D,#FF3D7F);border:0}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;height:34px;min-width:34px;padding:0 10px;font-weight:700;font-size:14px}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE89A,#FFB800 60%,#C98A00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);display:inline-block}
.lockbar{display:flex;gap:5px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 8px}
.lockbar .lk{width:22px;height:22px;flex:none}
.seg{flex:1;height:30px;border-radius:9px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;position:relative;overflow:hidden;color:var(--muted)}
.seg svg{width:18px;height:18px;opacity:.5;filter:invert(1)}
.seg.on{color:#0A0E2E}
.seg.on svg{opacity:1;filter:none}
.seg.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.scene{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.scene>svg{display:block;width:100%;height:100%}
.scene.shake{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:translate(1px,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,2px)}100%{transform:translate(0,0)}}
.hint-line{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(10,14,46,.75);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.hs{position:absolute;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(255,255,255,.85),0 4px 14px rgba(0,0,0,.4)}
.hs svg{width:28px;height:28px}
.hs::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--c);animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.7);opacity:0}}
.hs .tag{position:absolute;top:100%;margin-top:6px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;background:rgba(10,14,46,.85);padding:1px 8px;border-radius:999px;white-space:nowrap;pointer-events:none}
.hs.done{box-shadow:0 0 0 3px var(--good),0 4px 14px rgba(0,0,0,.4)}
.hs.done::before{display:none}
.hs .st{position:absolute;bottom:-4px;right:-10px;background:var(--space);border-radius:999px;padding:0 5px;font-size:11px;color:var(--sun);font-weight:800;border:1px solid var(--line)}
.hs.hidden{display:none}
#rocket{transition:transform 3s cubic-bezier(.45,0,.75,.45)}
#flame{transform-origin:215px 488px;transform:scaleY(0);transition:transform .6s}
.lit #flame{transform:scaleY(1)}
#flame ellipse{animation:flick .09s infinite alternate}
@keyframes flick{from{opacity:.85}to{opacity:1}}
.twk{animation:tw 2.4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.2}to{opacity:1}}
.blink{animation:bl 1.2s steps(2) infinite}
@keyframes bl{50%{opacity:.15}}

/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,6,24,.6);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.ov.center{align-items:center;padding:16px}
.sheet{width:100%;max-width:560px;max-height:94%;background:var(--panel);border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:0;display:flex;flex-direction:column;overflow:hidden;animation:up .28s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
.center .sheet{border-radius:26px;border-bottom:1px solid var(--line);max-height:100%}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.badge{width:44px;height:44px;border-radius:14px;background:var(--c);display:flex;align-items:center;justify-content:center;flex:none}
.badge svg{width:28px;height:28px}
.sh-title{flex:1;min-width:0}
.sh-title small{display:block;font-size:12px;color:var(--c);font-weight:700;letter-spacing:.03em}
.sh-title b{font-size:20px;font-weight:800;display:block;line-height:1.1}
.x{width:38px;height:38px;border-radius:50%;background:var(--panel2);font-size:20px;font-weight:700;flex:none}
.sh-body{padding:0 16px 14px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.prompt{font-size:17px;font-weight:600;text-wrap:balance}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dots{display:flex;gap:4px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--good);display:inline-block}
.dots i.used{background:var(--panel2);border:1px solid var(--line)}
.hintbtn{margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.hintbtn[disabled]{opacity:.5;cursor:default}
.hintbox{background:rgba(255,200,61,.12);border:1px dashed var(--sun);border-radius:14px;padding:8px 12px;font-size:15px;font-weight:600;color:#FFE5A0}
.fb{min-height:26px;font-size:16px;font-weight:700;text-align:center}
.fb.bad{color:var(--bad)} .fb.good{color:var(--good)}
.big{background:linear-gradient(180deg,#FFD45C,#FFB21E);color:#2A1A00;font-weight:800;font-size:19px;border-radius:16px;padding:12px 22px;box-shadow:0 4px 0 #C98500}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #C98500}
.big.alt{background:var(--raise);color:var(--ink);box-shadow:0 4px 0 #161B4F}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.shake-x{animation:sx .35s}
@keyframes sx{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* pattern */
.terms{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.scr{width:62px;height:62px;border-radius:12px;background:#0B1138;border:3px solid #3A4497;display:flex;align-items:center;justify-content:center;flex:none}
.scr svg{width:100%;height:100%}
.scr.q{font-size:32px;font-weight:800;color:var(--sun);border-style:dashed;border-color:var(--sun)}
.arrow{align-self:center;color:var(--muted);font-weight:800}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.opt{background:var(--panel2);border-radius:16px;padding:6px;display:flex;align-items:center;justify-content:center;border:3px solid transparent}
.opt .scr{width:100%;height:auto;aspect-ratio:1}
.opt.wrong{border-color:var(--bad);opacity:.55}
.opt.right{border-color:var(--good)}
.opt[disabled]{cursor:default}
.plus{display:flex;justify-content:center;gap:6px;font-size:13px;color:var(--sun);font-weight:700}

/* memory */
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:300px;width:100%;margin:0 auto}
.pad{aspect-ratio:1;border-radius:24px;background:var(--pc);opacity:.45;box-shadow:inset 0 -8px 0 rgba(0,0,0,.25);transition:opacity .1s,transform .1s;font-size:28px;font-weight:800;color:rgba(0,0,0,.55)}
.pad.lit{opacity:1;transform:scale(1.04);box-shadow:0 0 30px var(--pc),inset 0 -8px 0 rgba(0,0,0,.2)}
.pad[disabled]{cursor:default}
.seqdots{display:flex;gap:6px;justify-content:center}
.seqdots i{width:14px;height:14px;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}
.seqdots i.ok{background:var(--good)}

/* program */
.grid{position:relative;display:grid;gap:4px;max-width:300px;width:100%;margin:0 auto;background:#0B1138;padding:6px;border-radius:16px}
.cell{aspect-ratio:1;border-radius:10px;background:#1B2264;display:flex;align-items:center;justify-content:center}
.cell.wall{background:repeating-linear-gradient(45deg,#FFB21E 0 8px,#2A1A00 8px 16px)}
.cell.path{box-shadow:inset 0 0 0 3px var(--sun)}
.cell svg{width:70%;height:70%}
.robo{position:absolute;transition:left .32s,top .32s;display:flex;align-items:center;justify-content:center;pointer-events:none}
.robo svg{width:78%;height:78%}
.robo.bump{animation:sx .35s}
.prog{display:flex;gap:4px;flex-wrap:wrap;min-height:44px;background:#0B1138;border-radius:12px;padding:6px;align-items:center}
.prog .cmd{width:30px;height:30px;border-radius:8px;background:var(--sp3);color:#0A0E2E;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.prog .cmd.now{outline:3px solid var(--sun)}
.prog .ph{color:var(--muted);font-size:13px;padding-left:6px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{background:var(--raise);border-radius:14px;height:52px;font-size:26px;font-weight:800;box-shadow:0 4px 0 #161B4F}
.key:active{transform:translateY(2px);box-shadow:0 2px 0 #161B4F}

/* predict */
.rockets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rk{background:var(--panel2);border-radius:16px;border:3px solid transparent;padding:4px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.rk .track{height:170px;width:100%;position:relative;overflow:hidden;border-radius:12px;background:linear-gradient(#0B1138,#1E2470)}
.rk .track svg{position:absolute;left:50%;bottom:0;width:62px;height:124px;margin-left:-31px;transition:transform 2.4s cubic-bezier(.5,0,.9,.6)}
.rk b{font-size:18px}
.rk .cap{font-size:11px;color:var(--muted);line-height:1.1;text-align:center}
.rk.wrong{border-color:var(--bad);opacity:.6}
.rk.right{border-color:var(--good)}

/* tap */
.rule{text-align:center;font-size:22px;font-weight:800;border-radius:14px;padding:6px;background:var(--panel2);display:flex;align-items:center;justify-content:center;gap:8px}
.rule svg{width:34px;height:34px}
.rule.flash{animation:fl .6s 2}
@keyframes fl{50%{background:var(--sun);color:#2A1A00}}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:320px;width:100%;margin:0 auto}
.hole{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#05081F 55%,#3A4497 57%,#2C3584 70%);position:relative;display:flex;align-items:center;justify-content:center}
.item{width:72%;height:72%;border-radius:50%;background:none;padding:0;animation:pin .15s ease-out}
.item svg{width:100%;height:100%;pointer-events:none}
@keyframes pin{from{transform:scale(.3)}to{transform:scale(1)}}
.item.hit{animation:hitp .25s forwards}
@keyframes hitp{to{transform:scale(1.4);opacity:0}}
.item.oops{animation:sx .3s}
.timebar{height:10px;border-radius:999px;background:var(--panel2);overflow:hidden}
.timebar i{display:block;height:100%;background:var(--sp5);width:100%;transition:width .2s linear}
.score3{display:flex;justify-content:center;gap:16px;font-weight:700;font-size:15px;color:var(--muted)}

/* spot */
.tiles{display:grid;gap:6px;max-width:330px;width:100%;margin:0 auto;padding:8px;border-radius:16px;background:#E9ECFF}
.tile{min-width:0;aspect-ratio:1;border-radius:8px;background:none;padding:0;transition:opacity .3s}
.tile svg{width:100%;height:100%;pointer-events:none}
.tile.wrong{animation:sx .35s}
.tile.dim{opacity:.2}
.tile.right{outline:4px solid var(--good);border-radius:8px}

/* done panel */
.done{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:8px 0 4px}
.done .bigbadge{width:84px;height:84px;border-radius:26px;background:var(--c);display:flex;align-items:center;justify-content:center;animation:pop .6s}
.done .bigbadge svg{width:54px;height:54px}
.starrow{font-size:38px;letter-spacing:4px;line-height:1}
.starrow .off{opacity:.2}
.done h3{margin:0;font-size:24px;font-weight:800}
.done p{margin:0;color:var(--muted);font-weight:600}
.gain{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.piece{font-size:15px;font-weight:700;background:var(--panel2);border-radius:999px;padding:4px 12px;display:inline-flex;gap:6px;align-items:center}

/* lock */
.codeboxes{display:flex;gap:6px;justify-content:center}
.codeboxes span{width:42px;height:52px;border-radius:12px;background:#0B1138;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800}
.codeboxes span.f{border-color:var(--sun)}
.badgerow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.badgerow div{border-radius:12px;background:var(--c);color:#0A0E2E;display:flex;flex-direction:column;align-items:center;padding:4px 0;font-weight:800;font-size:22px;line-height:1}
.badgerow svg{width:22px;height:22px;margin-bottom:2px}
.numpad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.numpad .key{height:50px;font-size:24px}

/* intro / results */
.intro{padding:22px 20px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.intro h1{margin:0;font-size:32px;line-height:1;font-weight:800;text-wrap:balance}
.intro .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sun);font-weight:700}
.intro p{margin:0;font-size:17px;font-weight:600;color:#DADFFF;max-width:36ch}
.sprow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%;max-width:340px}
.sprow div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--muted);line-height:1.05;text-align:center}
.sprow .badge{width:40px;height:40px;border-radius:12px}
.sprow .badge svg{width:24px;height:24px}
.beat{background:linear-gradient(90deg,#FF7A3D,#FF3D7F);border-radius:14px;padding:8px 14px;font-weight:800}
.res-big{font-size:54px;font-weight:800;line-height:1;color:var(--sun);font-variant-numeric:tabular-nums}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.res-grid div{background:var(--panel2);border-radius:14px;padding:8px 4px;font-weight:700;font-size:13px;color:var(--muted)}
.res-grid b{display:block;color:var(--ink);font-size:22px;font-variant-numeric:tabular-nums}
.res-list{width:100%;display:flex;flex-direction:column;gap:6px}
.res-list div{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:6px 10px;font-weight:700;font-size:14px;text-align:left}
.res-list .badge{width:32px;height:32px;border-radius:10px}
.res-list .badge svg{width:20px;height:20px}
.res-list span:not(.badge){flex:1;min-width:0}
.res-list em{font-style:normal;color:var(--sun);white-space:nowrap}
.note{font-size:13px;color:var(--muted);font-weight:600;max-width:40ch}
.cardimg{width:100%;max-width:340px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.countdown{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;font-size:160px;font-weight:800;color:var(--sun);text-shadow:0 0 40px rgba(255,200,61,.6);pointer-events:none}
.countdown span{animation:cd 1s ease-out forwards}
@keyframes cd{from{transform:scale(1.6);opacity:0}30%{opacity:1}to{transform:scale(.8);opacity:0}}
#confetti{position:fixed;inset:0;z-index:25;pointer-events:none}
pre.dbg{background:#05081F;border-radius:12px;padding:10px;font-size:11px;max-height:50vh;overflow:auto;white-space:pre-wrap;word-break:break-all;user-select:text;-webkit-user-select:text;font-family:ui-monospace,monospace}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}.hs::before{display:none}}
</style>

<div id="app">
  <div class="top">
    <button class="brand" id="brand" aria-label="Mission title"><small id="eyebrow"></small><b id="mtitle"></b></button>
    <span class="chip combo" id="combo" hidden></span>
    <span class="chip" title="Coins"><i class="coin"></i><span id="coins">0</span></span>
    <button class="iconbtn" id="lang" aria-label="Change language">हिं</button>
    <button class="iconbtn" id="snd" aria-label="Sound on or off">♪</button>
  </div>
  <div class="lockbar" id="lockbar"></div>
  <div class="stage" id="stage"><div class="scene" id="scene"></div></div>
</div>
<canvas id="confetti" hidden></canvas>

const SFX = {ctx:null,
  ensure(){if(!S.sound)return null;try{if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume();}catch(e){return null;}return this.ctx;},
  tone(f,d=.15,type='sine',v=.18,when=0){const c=this.ensure();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;const t0=c.currentTime+when;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g).connect(c.destination);o.start(t0);o.stop(t0+d+.02);},
  good(){[523,659,784].forEach((f,i)=>this.tone(f,.16,'triangle',.18,i*.08));},

};

  while(runs.length>20)runs.shift();

}

  }},`<div class="scr">${dotScreen(o.n,o.c)}</div>`);opts.append(b);});

TYPES.memory = ctx=>{
  const d=ctx.data;const tones=[392,523,659,784,880,988];
  let input=[],accepting=false,alive=true,slow=false;
  const sd=h('div',{class:'seqdots'});d.sequence.forEach(()=>sd.append(h('i')));
  const pads=h('div',{class:'pads'});
  const padEls=d.pads.map((c,i)=>{const b=h('button',{class:'pad',style:{'--pc':COLORS[c]||c},'aria-label':c,disabled:true,onclick:()=>press(i)});pads.append(b);return b;});
  const btn=h('button',{class:'big',onclick:()=>watch()},t(UI.watch)+' ▶');
  const row=h('div',{class:'row'});row.append(btn);
  ctx.el.append(sd,pads,row);
  async function flash(i,ms){padEls[i].classList.add('lit');SFX.tone(tones[i],ms/1000*.9,'triangle',.2);await sleep(ms);padEls[i].classList.remove('lit');}
  async function watch(){
    btn.hidden=true;accepting=false;input=[];sd.querySelectorAll('i').forEach(x=>x.className='');padEls.forEach(p=>p.disabled=true);
    ctx.status(t(UI.watching));ctx.log('memory_watch',{slow});
    await sleep(400);
    const ms=slow?Math.round(d.showMs*1.6):d.showMs;
    for(const i of d.sequence){if(!alive)return;await flash(i,ms);await sleep(ms*.35);}
    if(!alive)return;
    accepting=true;padEls.forEach(p=>p.disabled=false);ctx.status(t(UI.yourTurn));
  }
  function press(i){
    if(!accepting)return;
    flash(i,220);
    const pos=input.length;input.push(i);
    if(d.sequence[pos]!==i){accepting=false;padEls.forEach(p=>p.disabled=true);
      const r=ctx.wrong({pos,expected:d.sequence[pos],got:i,input:input.slice()});
      if(!r.final){btn.textContent=t(UI.watchAgain)+' ▶';btn.hidden=false;}
      return;}
    sd.children[pos].className='ok';
    if(input.length===d.sequence.length){accepting=false;padEls.forEach(p=>p.disabled=true);ctx.solve({input:input.slice()});}
  }
  return {
    hint(){slow=true;},
    async reveal(){btn.hidden=true;padEls.forEach((p,i)=>p.textContent='');for(let k=0;k<d.sequence.length;k++){if(!alive)return;const i=d.sequence[k];padEls[i].textContent=String(k+1);await flash(i,500);await sleep(150);}},
    destroy(){alive=false;}
  };
};

TYPES.program = ctx=>{
  const d=ctx.data;const isWall=(x,y)=>d.walls.some(w=>w[0]===x&&w[1]===y);
  let prog=[],running=false;const DIR={U:[0,-1,'↑'],D:[0,1,'↓'],L:[-1,0,'←'],R:[1,0,'→']};
  const grid=h('div',{class:'grid',style:{gridTemplateColumns:`repeat(${d.cols},1fr)`}});
  const cells=[];
  for(let y=0;y<d.rows;y++)for(let x=0;x<d.cols;x++){const c=h('div',{class:'cell'+(isWall(x,y)?' wall':'')});if(x===d.goal[0]&&y===d.goal[1])c.innerHTML=GEAR;grid.append(c);cells.push(c);}
  const robo=h('div',{class:'robo'},ROBO);grid.append(robo);
  let pos=d.start.slice();
  function place(){const cw=100/d.cols,ch=100/d.rows;robo.style.left=`calc(6px + (100% - 12px) * ${pos[0]/d.cols})`;robo.style.top=`calc(6px + (100% - 12px) * ${pos[1]/d.rows})`;robo.style.width=`calc((100% - 12px) / ${d.cols})`;robo.style.height=`calc((100% - 12px) / ${d.rows})`;}
  place();
  const strip=h('div',{class:'prog'});
  function drawStrip(now=-1){strip.innerHTML='';if(!prog.length){strip.append(h('span',{class:'ph'},t(UI.addSteps)+` (max ${d.maxCmds})`));return;}prog.forEach((p,i)=>strip.append(h('span',{class:'cmd'+(i===now?' now':'')},DIR[p][2])));}
  drawStrip();
  const keys=h('div',{class:'keys'});
  ['L','U','D','R'].forEach(k=>keys.append(h('button',{class:'key','aria-label':k,onclick:()=>{if(running||prog.length>=d.maxCmds)return;SFX.tap();prog.push(k);drawStrip();}},DIR[k][2])));
  const row=h('div',{class:'row'});
  const undo=h('button',{class:'big alt','aria-label':'Undo',onclick:()=>{if(running)return;prog.pop();drawStrip();}},'⌫');
  const clr=h('button',{class:'big alt',onclick:()=>{if(running)return;prog=[];drawStrip();}},t(UI.clear));
  const run=h('button',{class:'big',onclick:()=>go()},t(UI.run)+' ▶');
  row.append(undo,clr,run);
  ctx.el.append(grid,strip,keys,row);
  async function go(){
    if(running||!prog.length)return;running=true;pos=d.start.slice();place();await sleep(250);
    let ok=true,why=null;
    for(let i=0;i<prog.length;i++){
      drawStrip(i);const [dx,dy]=DIR[prog[i]];const nx=pos[0]+dx,ny=pos[1]+dy;
      if(nx<0||ny<0||nx>=d.cols||ny>=d.rows||isWall(nx,ny)){robo.classList.add('bump');SFX.bad();await sleep(400);robo.classList.remove('bump');ok=false;why='bump';break;}
      pos=[nx,ny];place();SFX.tone(600+i*40,.06,'square',.05);await sleep(360);
    }
    if(ok&&!(pos[0]===d.goal[0]&&pos[1]===d.goal[1])){ok=false;why='short';}
    if(ok){ctx.solve({program:prog.join(''),len:prog.length,shortest:solution().length});}
    else{const r=ctx.wrong({program:prog.join(''),error:why,stop:pos.slice()});ctx.status(t(why==='bump'?UI.bump:UI.notThere),'bad');await sleep(600);pos=d.start.slice();place();drawStrip();running=r.final;}
    if(ok)running=true;
  }
  function solution(){const key=(x,y)=>x+','+y;const prev={},q=[d.start];prev[key(...d.start)]=null;while(q.length){const [x,y]=q.shift();if(x===d.goal[0]&&y===d.goal[1])break;for(const k of['U','R','D','L']){const nx=x+DIR[k][0],ny=y+DIR[k][1];if(nx<0||ny<0||nx>=d.cols||ny>=d.rows||isWall(nx,ny)||key(nx,ny) in prev)continue;prev[key(nx,ny)]=[x,y,k];q.push([nx,ny]);}}
    const path=[];let cur=d.goal;while(prev[key(...cur)]){const [px,py,k]=prev[key(...cur)];path.unshift({k,x:cur[0],y:cur[1]});cur=[px,py];}return path;}
  return {
    hint(){const p=solution();p.slice(0,2).forEach(s=>cells[s.y*d.cols+s.x].classList.add('path'));},
    reveal(){running=true;solution().forEach(s=>cells[s.y*d.cols+s.x].classList.add('path'));prog=solution().map(s=>s.k);drawStrip();},
    destroy(){}
  };
};

TYPES.predict = ctx=>{
  const d=ctx.data;
  const wrap=h('div',{class:'rockets'});
  const els=d.rockets.map((rk,i)=>{
    const b=h('button',{class:'rk','aria-label':`Rocket ${rk.id}`,onclick:()=>pick(i)});
    const tr=h('div',{class:'track'},miniRocket(rk.flame,rk.boxes));
    b.append(tr,h('b',{},rk.id),h('div',{class:'cap'},`${t(UI.fire)}: ${t(rk.flame>=3?UI.big:UI.small)}<br>${t(UI.boxes)}: ${rk.boxes}`));
    wrap.append(b);return b;});
  ctx.el.append(wrap);
  let done=false;
  async function race(){
    ctx.status(t(UI.testFire));
    const ratio=d.rockets.map(r=>r.flame/(1+r.boxes*0.5));const mx=Math.max(...ratio);
    SFX.rumble(2.4);
    els.forEach((b,i)=>{const svg=b.querySelector('svg');svg.style.transform=`translateY(-${Math.round(ratio[i]/mx*150)}px)`;});
    await sleep(2500);
  }
  async function pick(i){
    if(done)return;const rk=d.rockets[i];SFX.tap();
    if(rk.correct){done=true;els[i].classList.add('right');els.forEach(b=>b.disabled=true);await race();ctx.solve({choice:rk.id});}
    else{els[i].classList.add('wrong','shake-x');els[i].disabled=true;const r=ctx.wrong({choice:rk.id,error:rk.error||null});if(r.final)done=true;}
  }
  return {
    hint(){},
    async reveal(){done=true;els.forEach(b=>b.disabled=true);const i=d.rockets.findIndex(r=>r.correct);els[i].classList.add('right');await race();},
    destroy(){}
  };
};

TYPES.tap = ctx=>{
  const d=ctx.data;let alive=true,running=false,slow=false,timers=[];
  const rule=h('div',{class:'rule'});
  const tb=h('div',{class:'timebar'},'<i></i>');
  const holes=h('div',{class:'holes'});const holeEls=[];for(let i=0;i<d.holes;i++){const e=h('div',{class:'hole'});holes.append(e);holeEls.push(e);}
  const sc=h('div',{class:'score3'});
  const row=h('div',{class:'row'});const btn=h('button',{class:'big',onclick:()=>start()},t(UI.go)+' ▶');row.append(btn);
  function showRule(p){rule.innerHTML=`${ITEM[p.rule]}<span>${t(p.label)}</span>`;}
  showRule(d.phases[0]);
  ctx.el.append(rule,tb,holes,sc,row);
  let stats;
  function drawScore(){sc.innerHTML=`<span>${t(UI.caught)}: <b style="color:var(--good)">${stats.hits}</b></span><span>${t(UI.wrongTaps)}: <b style="color:var(--bad)">${stats.wrong}</b></span>`;}
  function later(fn,ms){const id=setTimeout(()=>{if(alive)fn();},ms);timers.push(id);return id;}
  function start(){
    if(running)return;running=true;btn.hidden=true;
    stats={hits:0,wrong:0,targets:0,missed:0,rt:[],phase:d.phases.map(p=>({rule:p.rule,targets:0,hits:0,wrong:0}))};drawScore();
    ctx.log('tap_start',{slow});
    const total=d.phases.reduce((a,p)=>a+p.sec,0)*1000;let ph=0,elapsed=0;const t0=performance.now();
    const stay=slow?Math.round(d.stayMs*1.3):d.stayMs;
    showRule(d.phases[0]);
    const tick=()=>{if(!alive)return;const e=performance.now()-t0;tb.firstChild.style.width=Math.max(0,100-e/total*100)+'%';
      let acc=0,np=0;for(let i=0;i<d.phases.length;i++){acc+=d.phases[i].sec*1000;if(e<acc){np=i;break;}np=i;}
      if(np!==ph){ph=np;showRule(d.phases[ph]);rule.classList.remove('flash');void rule.offsetWidth;rule.classList.add('flash');ctx.status(t(UI.switchRule),'bad');SFX.tone(330,.2,'square',.12);SFX.tone(440,.2,'square',.12,.15);}
      if(e>=total){end();return;}
      requestAnimationFrame(tick);};
    requestAnimationFrame(tick);
    const spawn=()=>{if(!alive||!running)return;const e=performance.now()-t0;if(e>total-300)return;
      const free=holeEls.filter(x=>!x.firstChild);if(free.length){const hole=free[Math.floor(Math.random()*free.length)];
        const cur=d.phases[ph].rule;const other=d.phases.find(p=>p.rule!==cur)?.rule||'rock';
        const kind=Math.random()<(d.targetShare||.6)?cur:other;const isT=kind===cur;const myPh=ph;
        if(isT){stats.targets++;stats.phase[myPh].targets++;}
        const born=performance.now();
        const it=h('button',{class:'item','aria-label':kind},ITEM[kind]);
        it.addEventListener('pointerdown',ev=>{ev.preventDefault();if(it.dataset.done)return;it.dataset.done=1;
          const nowRule=d.phases[ph].rule;
          if(kind===nowRule){stats.hits++;stats.phase[ph].hits++;stats.rt.push(Math.round(performance.now()-born));it.classList.add('hit');SFX.tone(990,.06,'triangle',.12);}
          else{stats.wrong++;stats.phase[ph].wrong++;it.classList.add('oops');SFX.bad();if(isT){/* rule changed while it was up */}}
          drawScore();later(()=>it.remove(),250);});
        hole.append(it);
        later(()=>{if(!it.dataset.done){it.dataset.done=1;if(isT)stats.missed++;it.remove();}},stay);
      }
      later(spawn,d.spawnMs);};
    later(spawn,500);
  }
  function end(){
    running=false;timers.forEach(clearTimeout);timers=[];holeEls.forEach(x=>x.innerHTML='');
    const hitRate=stats.targets?stats.hits/stats.targets:0;
    const payload={hits:stats.hits,targets:stats.targets,wrong:stats.wrong,missed:stats.missed,hit_rate:+hitRate.toFixed(2),mean_rt_ms:stats.rt.length?Math.round(stats.rt.reduce((a,b)=>a+b,0)/stats.rt.length):null,phases:stats.phase};
    if(hitRate>=d.pass.minHitRate&&stats.wrong<=d.pass.maxWrong)ctx.solve(payload);
    else{const r=ctx.wrong(payload);if(!r.final){btn.hidden=false;showRule(d.phases[0]);tb.firstChild.style.width='100%';}}
  }
  return {hint(){slow=true;},reveal(){btn.hidden=true;},destroy(){alive=false;running=false;timers.forEach(clearTimeout);}};
};

TYPES.spot = ctx=>{
  const d=ctx.data;const n=d.cols*d.rows;
  const odd=d.oddIndex==='random'?Math.floor(Math.random()*n):d.oddIndex;
  const g=h('div',{class:'tiles',style:{gridTemplateColumns:`repeat(${d.cols},minmax(0,1fr))`}});
  const els=[];
  for(let i=0;i<n;i++){const b=h('button',{class:'tile','aria-label':'tile '+(i+1),onclick:()=>{
    if(b.disabled)return;SFX.tap();
    if(i===odd){b.classList.add('right');els.forEach(x=>x.disabled=true);ctx.solve({tap:i,odd});}
    else{b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');ctx.wrong({tap:i,odd});}
  }},shieldTile(i===odd));g.append(b);els.push(b);}
  ctx.el.append(g);
  return {
    hint(){const half=Math.floor(d.rows/2);const oddRow=Math.floor(odd/d.cols);els.forEach((b,i)=>{const r=Math.floor(i/d.cols);if((oddRow<half)!==(r<half))b.classList.add('dim');});},
    reveal(){els.forEach(x=>x.disabled=true);els[odd].classList.add('right');},
    destroy(){}
  };
};

function finishClue(c,solved,sh){

function challengeUrl(){const u=location.href.split('#')[0];return `${u}#beat-${S.points}`;}
function copyChallenge(el){const url=challengeUrl();log('share',null,{kind:'link'});
  const fail=()=>{el.innerHTML=`${t(UI.copyFail)}<br><span style="user-select:text;-webkit-user-select:text;color:var(--ink)">${url}</span>`;};
  try{navigator.clipboard.writeText(url).then(()=>{el.textContent=t(UI.copied);},fail);}catch(e){fail();}}
async function shareCard(){
  log('share',null,{kind:'card'});
  try{await document.fonts.ready;}catch(e){}
  const W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#060A26');gr.addColorStop(.6,'#1D1A5C');gr.addColorStop(1,'#4B2C7A');g.fillStyle=gr;g.fillRect(0,0,W,H);
  const r=rnd(5);for(let i=0;i<140;i++){g.fillStyle=`rgba(255,255,255,${.3+r()*.7})`;g.beginPath();g.arc(r()*W,r()*H,r()*3+1,0,6.3);g.fill();}
  const F="'Baloo 2','Nirmala UI','Noto Sans Devanagari',sans-serif";
  g.textAlign='center';g.fillStyle='#FFC83D';g.font=`700 40px ${F}`;g.fillText(`FSL · ${t(S.mission.title)}`,W/2,120);
  // rocket
  g.save();g.translate(W/2,430);g.fillStyle='#FF8A3D';g.beginPath();g.ellipse(0,230,50,110,0,0,6.3);g.fill();g.fillStyle='#FFF0A8';g.beginPath();g.ellipse(0,200,24,60,0,0,6.3);g.fill();
  g.fillStyle='#FF5D73';g.beginPath();g.moveTo(0,-200);g.bezierCurveTo(-40,-140,-60,-90,-60,-50);g.lineTo(60,-50);g.bezierCurveTo(60,-90,40,-140,0,-200);g.fill();
  g.fillStyle='#EEF1FF';g.fillRect(-60,-52,120,240);g.fillStyle='#4EA8FF';g.beginPath();g.arc(0,20,30,0,6.3);g.fill();g.fillStyle='#FF5D73';g.beginPath();g.moveTo(-60,110);g.lineTo(-120,200);g.lineTo(-60,190);g.fill();g.beginPath();g.moveTo(60,110);g.lineTo(120,200);g.lineTo(60,190);g.fill();g.restore();
  g.fillStyle='#F5F6FF';g.font=`700 44px ${F}`;g.fillText(t(UI.cardScored),W/2,800);
  g.fillStyle='#FFC83D';g.font=`800 170px ${F}`;g.fillText(S.points.toLocaleString('en-IN'),W/2,960);
  g.fillStyle='#AEB5E8';g.font=`700 40px ${F}`;g.fillText(`★ ${S.run.stars}/${S.mission.clues.length*3}   ·   ${t(UI.bestCombo)} x${comboMult(S.bestCombo)}`,W/2,1030);
  const cs=S.mission.clues;const bw=130,gap=22,x0=(W-(cs.length*bw+(cs.length-1)*gap))/2;
  cs.forEach((c,i)=>{const x=x0+i*(bw+gap),y=1080;g.fillStyle=SP[c.superpower].hex;roundRect(g,x,y,bw,bw,28);g.fill();g.fillStyle='#0A0E2E';g.font=`800 40px ${F}`;g.fillText('★'.repeat(S.clues[c.id].stars)||'·',x+bw/2,y+80);});
  g.fillStyle='#F5F6FF';g.font=`800 56px ${F}`;g.fillText(t(UI.cardBeat),W/2,1300);
  const url=cv.toDataURL('image/png');
  try{const blob=await (await fetch(url)).blob();const file=new File([blob],'fsl-rocket-score.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:`${t(UI.cardBeat)} ${challengeUrl()}`});return;}}catch(e){}
  const sh=openOverlay(true);const b=h('div',{class:'intro'});b.append(h('img',{src:url,class:'cardimg',alt:'Score card'}),h('div',{class:'note'},t(UI.saveCard)));
  b.append(h('button',{class:'big alt',onclick:()=>showResults()},t(UI.back)));sh.append(b);
}
function roundRect(g,x,y,w,hh,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+hh,r);g.arcTo(x+w,y+hh,x,y+hh,r);g.arcTo(x,y+hh,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

/* ---------- intro ---------- */
function showIntro(){
  const m=S.mission;const sh=openOverlay(true);
  const body=h('div',{class:'intro'});
  const beat=S.beat!=null?`<div class="beat">${t(UI.beatBanner,{n:S.beat})}</div>`:'';
  body.innerHTML=`<div class="eyebrow">${t(UI.eyebrow)} ${m.band}</div><h1>${t(m.title)}</h1>${beat}<p>${t(m.story)}</p>`;
  const row=h('div',{class:'sprow'});m.clues.forEach(c=>{row.append(h('div',{},`<span class="badge" style="--c:${SP[c.superpower].c}">${ICON[c.superpower]}</span>${t(SP[c.superpower])}`));});
  body.append(row,h('button',{class:'big',onclick:()=>{SFX.ensure();closeOverlay();S.phase='play';newRun();S.run.lang=S.lang;log('run_start',null,{beat_target:S.beat});renderTop();renderLockbar();renderScene();}},t(UI.start)+' 🚀'));
  const langRow=h('div',{class:'row'});
  langRow.append(h('button',{class:'iconbtn',onclick:()=>{S.lang=S.lang==='en'?'hi':'en';store.set('fsl.lang',S.lang);renderTop();renderScene();showIntro();}},S.lang==='en'?'हिंदी में खेलो':'Play in English'));
  body.append(langRow);
  sh.append(body);
}
function restart(){closeOverlay();const rk=$('#rocket');if(rk){rk.style.transition='none';rk.style.transform='';}newRun();renderTop();renderLockbar();renderScene();showIntro();}

/* ---------- debug / log ---------- */
let brandTaps=0,brandTimer=null;
function showLog(){
  const sh=openOverlay(true);const b=h('div',{class:'intro',style:{alignItems:'stretch',textAlign:'left'}});
  const runs=store.get('fsl.missionRuns.v1',[]);const cur={run:S.run,clue_results:S.run?clueResults():[],events:S.events};
  const json=JSON.stringify({current:cur,saved_runs:runs.length},null,1);
  b.append(h('h1',{style:{fontSize:'22px'}},t(UI.log)));const pre=h('pre',{class:'dbg'});pre.textContent=json;b.append(pre);
  const row=h('div',{class:'row'});const msg=h('div',{class:'note'});
  row.append(h('button',{class:'big alt',onclick:()=>{try{navigator.clipboard.writeText(JSON.stringify(runs,null,1)).then(()=>msg.textContent='Copied',()=>msg.textContent='Select the text above to copy');}catch(e){msg.textContent='Select the text above to copy';}}},t(UI.copyLog)));
  row.append(h('button',{class:'big',onclick:()=>{closeOverlay();if(S.phase==='intro')showIntro();}},t(UI.close)));
  b.append(row,msg);sh.append(b);
}

/* ---------- boot ---------- */
async function boot(){
  let m=null;
  const qs=new URLSearchParams(location.search);
  if(qs.get('mission')){try{m=await (await fetch(qs.get('mission'))).json();}catch(e){}}
  if(!m){try{m=JSON.parse($('#mission-data').textContent);}catch(e){document.body.innerHTML='<p style="padding:20px">Mission file could not be read.</p>';return;}}
  S.mission=m;
  S.lang=store.get('fsl.lang',qs.get('lang')||'en');if(!['en','hi'].includes(S.lang))S.lang='en';
  S.sound=store.get('fsl.sound',true);
  const hm=/^#beat-(\d{1,6})$/.exec(location.hash);if(hm)S.beat=+hm[1];else if(qs.get('beat'))S.beat=+qs.get('beat')||null;
  newRun();renderTop();renderLockbar();layoutScene();renderScene();
  addEventListener('resize',layoutScene);
  $('#lang').onclick=()=>{S.lang=S.lang==='en'?'hi':'en';store.set('fsl.lang',S.lang);if(S.run)S.run.lang=S.lang;renderTop();renderLockbar();renderScene();if(S.refreshSheet)S.refreshSheet();else if(S.phase==='intro')showIntro();};
  $('#snd').onclick=()=>{S.sound=!S.sound;store.set('fsl.sound',S.sound);renderTop();};
  $('#brand').onclick=()=>{brandTaps++;clearTimeout(brandTimer);brandTimer=setTimeout(()=>brandTaps=0,1500);if(brandTaps>=5){brandTaps=0;showLog();}};
  if(location.hash==='#debug')showLog();else showIntro();
  window.__fsl={S,openClue,finishClue,openLock,launch};
}
boot();
