<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="FSL Round 2 mission (Band Y, 18+): Cyber Defence Arena, Hacker vs Defender. Defend a neon city at 6 hands-on cyber-safety stations and race a rival's ghost.">
</head>
<body>
<title>Cyber Defence Arena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: full-screen 3D neon city. Arena HUD on top (timer, score, LIVE, City Shield + live rival duel strip), station bar at the bottom,
   a job panel slides up while the 3D stays visible; demos and results use a centred card. One "neon night" look by design (dark only). */
:root{
  color-scheme:dark;
  --space:#07091A; --panel:#121A3A; --panel2:#1C2550; --raise:#2A3570; --deep:#0B1230;
  --ink:#E6F1FF; --muted:#9AA6D6; --line:rgba(150,180,255,.18);
  --sun:#FFC83D; --good:#3DDC97; --bad:#FF5D73; --neon:#22D3EE; --pink:#F472B6;
  --sp1:#FFC83D; --sp2:#B39BFF; --sp3:#2ED3C0; --sp4:#FF8A5C; --sp5:#4EA8FF; --sp6:#FF7EC8;
  --font:'Baloo 2','Nirmala UI','Noto Sans Devanagari','Mangal',system-ui,sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--space);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-size:16px;line-height:1.3;touch-action:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;z-index:5;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:5px;pointer-events:none;max-width:600px;margin:0 auto}
.hrow{display:flex;align-items:center;gap:4px}
.hud .hrow>*{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:4px;background:rgba(11,16,40,.88);border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-weight:800;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.low{background:var(--bad);border-color:var(--bad)}
.chip.streak{background:linear-gradient(90deg,#FF3D7F,#7C3AED);border:0}
.live{background:#E0243A;border:0;letter-spacing:.06em;font-size:12px}
.live::before{content:'';width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.sp{flex:1;min-width:0}
.iconbtn{background:rgba(11,16,40,.88);border:1px solid var(--line);border-radius:999px;height:32px;min-width:32px;padding:0 8px;font-weight:700;font-size:14px;flex:none}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE89A,#FFB800 60%,#C98A00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);display:inline-block;flex:none}
.meters{display:flex;flex-direction:column;gap:3px;background:rgba(11,16,40,.82);border:1px solid var(--line);border-radius:14px;padding:4px 8px;pointer-events:none}
.meter{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;min-width:0;font-variant-numeric:tabular-nums}
.meter .bar{flex:1;height:7px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;min-width:16px}
.meter .bar i{display:block;height:100%;width:50%;background:var(--c);transition:width .6s}
.meter.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.12)}}
.phase{font-size:12px;font-weight:800;color:var(--sun);text-align:center;grid-column:1/-1;line-height:1}
.bubble{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);transform:translateX(-50%);z-index:5;background:rgba(11,16,40,.85);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:14px;font-weight:700;max-width:92%;text-align:center;pointer-events:none}
.lower3{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);transform:translateX(-50%);z-index:15;width:min(560px,94%);display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,#7C3AED,#E0245A);border-radius:16px;padding:8px 12px;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:up .3s ease-out;cursor:pointer}
.lower3 .mic{font-size:28px;flex:none}
.lower3 b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.lower3 span{font-size:15px;font-weight:700;line-height:1.2}
.jobbar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;max-width:600px;margin:0 auto}
.jb{background:rgba(11,16,40,.9);border:1px solid var(--line);border-radius:14px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;font-weight:700;line-height:1.05;color:var(--muted);min-width:0}
.jb .ic{width:30px;height:30px;border-radius:10px;background:var(--c);display:flex;align-items:center;justify-content:center}
.jb .ic svg{width:19px;height:19px}
.jb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.jb.lock{opacity:.45}
.jb.lock .ic{background:var(--panel2)}
.jb.done{border-color:var(--good);color:var(--sun)}
.jb.next{border-color:var(--sun);animation:glow 1.4s infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px rgba(255,182,39,.5)}}
.hidden{display:none!important}

.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(4,6,18,.66);padding:14px}
.card{width:100%;max-width:520px;max-height:100%;background:var(--panel);border-radius:26px;border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.lower3{animation-name:up3}
@keyframes up3{from{transform:translate(-50%,-20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:10;margin:0 auto;max-width:560px;max-height:62%;background:rgba(18,26,58,.97);border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;display:flex;flex-direction:column;overflow:hidden;animation:up .25s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
.panel.tall{max-height:84%}
.ph{display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
.badge{width:40px;height:40px;border-radius:13px;background:var(--c);display:flex;align-items:center;justify-content:center;flex:none}
.badge svg{width:25px;height:25px}
.pt{flex:1;min-width:0}
.pt small{display:block;font-size:11px;color:var(--c);font-weight:700}
.pt b{font-size:18px;font-weight:800;display:block;line-height:1.1}
.x{width:36px;height:36px;border-radius:50%;background:var(--panel2);font-size:20px;font-weight:700;flex:none}
.pb{padding:0 14px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.kicker{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.prompt{font-size:15px;font-weight:700;text-wrap:pretty}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:700}
.meta .notes{margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.meta .notes[disabled]{opacity:.5}
.fb{border-radius:14px;padding:8px 12px;font-weight:700;font-size:15px;min-height:20px}
.fb.good{background:rgba(61,220,151,.14);border:1px solid var(--good)}
.fb.bad{background:rgba(255,93,115,.12);border:1px solid var(--bad)}
.fb.info{color:var(--sun);padding:0 2px}
.big{background:linear-gradient(180deg,#5EEAD4,#22D3EE);color:#04121F;font-weight:800;font-size:18px;border-radius:16px;padding:10px 20px;box-shadow:0 4px 0 #0E7490}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #0E7490}
.big.alt{background:var(--raise);color:var(--ink);box-shadow:0 4px 0 #0A0F2A}
.big[disabled]{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.shake-x{animation:sx .35s}
@keyframes sx{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.learn-text{font-size:16px;font-weight:600;color:#D8E4FF}
.learn-text ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.learn-text li{background:var(--panel2);border-radius:12px;padding:6px 10px;display:flex;gap:8px;align-items:center}
.learn-text li b{color:var(--sun)}
.tail{color:var(--sun);font-weight:800}
.art.demo{padding:0;overflow:hidden}.art.demo svg{max-width:420px;border-radius:16px}
.dcap{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:14px;padding:10px 12px;font-size:18px;font-weight:800;color:#E6F1FF;min-height:56px;line-height:1.25}
.dcap b{flex:0 0 28px;height:28px;border-radius:50%;background:var(--c);color:#0B1020;display:grid;place-items:center;font-size:14px}
.ddots{display:flex;gap:6px;justify-content:center}.ddots i{width:8px;height:8px;border-radius:50%;background:#2A3570}.ddots i.on{background:var(--c);width:20px;border-radius:4px}.ddots i.done{background:#5E6BB0}
.rules.chips{flex-direction:row;flex-wrap:wrap;gap:6px;color:#E6F1FF}.rules.chips span{font-size:13.5px;font-weight:800;background:var(--panel2);border-radius:999px;padding:5px 10px}.rules.chips span::before{content:none}
.tiles button .ti{display:block;width:44px;height:34px;margin:0 auto 2px}
.cards button .ci,.slot .what .ci{font-size:18px;margin-right:4px}
.art{background:var(--deep);border-radius:18px;padding:8px;display:flex;justify-content:center}
.art svg{width:100%;max-width:320px;height:auto;display:block}

/* grid tasks (dunes, memory) */
.gwrap{position:relative;display:flex;justify-content:center;align-items:center;padding:26px 0}
.grid{display:grid;gap:3px;width:min(300px,78vw);aspect-ratio:1;background:#7A5536;border-radius:12px;padding:3px;position:relative}
.cell{border-radius:7px;background:#E8C48C;position:relative;display:flex;align-items:center;justify-content:center;padding:0;overflow:hidden}
.cell svg{width:100%;height:100%;display:block}
.cell.me{box-shadow:inset 0 0 0 3px #1B6FD1}
.cell.path{background:#F3D9A8}
.cell.ok{box-shadow:inset 0 0 0 3px var(--good)}
.cell.no{animation:sx .35s;background:#F2A0A0}
.cell.hint{box-shadow:inset 0 0 0 3px var(--sun)}
.cell.fog{background:#B59572}
.cell .av{position:absolute;inset:18%;border-radius:50%;background:#1B6FD1;border:3px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.edge{position:absolute;background:var(--raise);border-radius:10px;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:0 3px 0 #0A0F2A}
.edge.t{top:0;left:50%;transform:translateX(-50%);width:min(300px,78vw);height:22px}
.edge.b{bottom:0;left:50%;transform:translateX(-50%);width:min(300px,78vw);height:22px}
.edge.l{left:calc(50% - min(150px,39vw) - 26px);top:50%;transform:translateY(-50%);width:22px;height:min(300px,78vw)}
.edge.r{left:calc(50% + min(150px,39vw) + 4px);top:50%;transform:translateY(-50%);width:22px;height:min(300px,78vw)}
.edge.sel{background:var(--sun);color:#2A1500}
.edge.right{background:var(--good);color:#06301F}
.edge.wrong{background:var(--bad)}
.edge[disabled]{opacity:.35}
.stick{display:flex;align-items:center;gap:10px;background:var(--deep);border-radius:14px;padding:6px 10px}
.stick svg{width:96px;height:96px;flex:none}
.stick div{font-size:13px;font-weight:700;color:var(--muted)}
.stick b{color:var(--ink)}
.studybar{height:10px;border-radius:999px;background:var(--panel2);overflow:hidden}
.studybar i{display:block;height:100%;background:var(--sp2);width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border-radius:999px;padding:2px 8px 2px 3px;font-size:12px;font-weight:700}
.legend svg{width:22px;height:22px}

/* day plan */
.ptable{width:100%;border-collapse:separate;border-spacing:2px;font-size:12px;font-weight:800;text-align:center}
.ptable th{color:var(--muted);font-weight:800;padding:2px}
.ptable td{background:var(--deep);border-radius:6px;padding:3px 2px;font-variant-numeric:tabular-nums}
.ptable td:first-child{text-align:left;padding-left:6px;background:var(--panel2)}
.ptable .neg{color:#FF9AA8}.ptable .pos{color:var(--good)}
.rules{display:flex;flex-direction:column;gap:3px;font-size:12.5px;font-weight:700;color:var(--sun)}
.rules span::before{content:'• '}
.slots{display:flex;flex-direction:column;gap:5px}
.slot{display:flex;align-items:center;gap:8px;background:var(--deep);border:2px dashed rgba(255,236,210,.25);border-radius:12px;padding:4px 8px;min-height:40px;font-weight:800;font-size:14px;text-align:left}
.slot .when{width:92px;flex:none;font-size:12px;color:var(--muted);line-height:1.1}
.slot .when b{display:block;color:var(--ink);font-size:13px}
.slot .what{flex:1}
.slot.filled{border-style:solid;border-color:var(--sp3)}
.slot.plane .when::after{content:' ✈️'}
.slot .en{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.slot.bad{border-color:var(--bad)}
.cards{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cards button{background:var(--raise);border-radius:12px;padding:6px 10px;font-weight:800;font-size:14px;box-shadow:0 3px 0 #0A0F2A}
.cards button.on{background:var(--sun);color:#2A1500}
.cards button.used{opacity:.3}
.ebar{height:12px;border-radius:999px;background:var(--panel2);overflow:hidden}
.ebar i{display:block;height:100%;background:var(--energy);width:0;transition:width .35s}

/* spot (mirage) */
.pano{border-radius:14px;overflow:hidden;background:#BFE3F5}
.pano svg{width:100%;height:auto;display:block}
.pano .cand{cursor:pointer}
.sgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sgrid.b3{grid-template-columns:repeat(3,minmax(0,1fr))}
.sitem{background:#F1DDB8;border-radius:12px;aspect-ratio:1;padding:4px;position:relative;border:3px solid transparent}
.sitem svg{width:100%;height:100%;display:block}
.sitem.found{border-color:var(--good);background:#CFF3E2}
.sitem.no{animation:sx .35s;border-color:var(--bad)}
.sitem.hint{border-color:var(--sun)}
.sitem small{position:absolute;left:0;right:0;bottom:2px;font-size:10px;font-weight:800;color:#2A3570;line-height:1}

/* still */
.still svg{width:100%;max-width:330px;height:auto;display:block;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tiles button{background:var(--raise);border-radius:12px;padding:8px 6px;font-weight:800;font-size:14px;box-shadow:0 3px 0 #0A0F2A;min-height:44px}
.tiles button.done{background:#1D5F48;box-shadow:none;opacity:.6}
.tiles button.hint{outline:3px solid var(--sun)}

/* reflex */
.rx{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.rxrule{text-align:center;font-weight:800;font-size:15px;border-radius:12px;padding:5px;background:var(--panel2)}
.rxrule.night{background:#1D2A5C;color:#CFE0FF}
.rxrule.flash{animation:fl .6s 3}
@keyframes fl{50%{background:var(--sun);color:#2A1500}}
.rxcard{height:120px;border-radius:18px;background:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:17px;text-align:center}
.rxcard.night{background:#0F1638}
.rxcard .e{font-size:52px;line-height:1;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.rxcard.hit{background:rgba(61,220,151,.3)}.rxcard.miss{background:rgba(255,93,115,.3)}
.rxbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rxbtns button{border-radius:16px;padding:12px 4px;font-weight:800;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.rxbtns .go{background:#2FA86F}.rxbtns .stay{background:#D9822B}.rxbtns .cover{background:#4E7BD9}
.timebar{height:10px;border-radius:999px;background:var(--panel2);overflow:hidden}
.timebar i{display:block;height:100%;background:var(--sp5);width:100%}
.score3{display:flex;justify-content:center;gap:16px;font-weight:700;font-size:15px;color:var(--muted)}

.done{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.starrow{font-size:34px;letter-spacing:4px;line-height:1;color:var(--sun)}
.starrow .off{opacity:.2;color:var(--ink)}
.gain{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.piece{font-size:14px;font-weight:700;background:var(--panel2);border-radius:999px;padding:3px 12px;display:inline-flex;gap:6px;align-items:center}

.intro{padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;overflow:auto}
.intro h1{margin:0;font-size:30px;line-height:1.02;font-weight:800;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sun);font-weight:700}
.intro p{margin:0;font-size:16px;font-weight:600;color:#C8D4F5;max-width:38ch}
.beat{background:linear-gradient(90deg,#FF3D7F,#7C3AED);border-radius:14px;padding:8px 14px;font-weight:800}
.res-big{font-size:54px;font-weight:800;line-height:1;color:var(--sun);font-variant-numeric:tabular-nums}
.rank{font-size:22px;font-weight:800;background:linear-gradient(90deg,#FFB627,#FF7EC8);-webkit-background-clip:text;background-clip:text;color:transparent}
.res-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%}
.res-grid div{background:var(--panel2);border-radius:14px;padding:8px 2px;font-weight:700;font-size:12px;color:var(--muted)}
.res-grid b{display:block;color:var(--ink);font-size:19px;font-variant-numeric:tabular-nums}
.res-list{width:100%;display:flex;flex-direction:column;gap:6px}
.res-list>div{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:6px 10px;font-weight:700;font-size:14px;text-align:left}
.res-list .badge{width:32px;height:32px;border-radius:10px}
.res-list .badge svg{width:20px;height:20px}
.res-list span.l{flex:1;min-width:0}
.res-list em{font-style:normal;color:var(--sun);white-space:nowrap}
.endbadges{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.endbadges div{background:linear-gradient(180deg,#26306A,#121A3A);border:2px solid var(--sun);border-radius:16px;padding:6px 12px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
.endbadges div span{font-size:24px}
.endbadges div.off{border-color:var(--line);opacity:.45}
.board{width:100%;background:var(--deep);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:4px;text-align:left}
.board h4{margin:0 0 4px;font-size:16px}
.board .r{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;align-items:center;padding:4px 8px;border-radius:10px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.board .r.me{background:rgba(34,211,238,.15);color:var(--sun)}
.board .r small{color:var(--muted);font-weight:600}
.namerow{display:flex;gap:8px;width:100%}
.namerow input{flex:1;min-width:0;background:var(--deep);border:2px solid var(--line);border-radius:12px;color:var(--ink);font:700 17px var(--font);padding:8px 12px;user-select:text;-webkit-user-select:text}
.note{font-size:13px;color:var(--muted);font-weight:600;max-width:42ch}
.cardimg{width:100%;max-width:340px;border-radius:18px}
.toast{position:fixed;left:50%;top:96px;transform:translateX(-50%);z-index:40;background:var(--bad);color:#fff;font-weight:800;padding:8px 16px;border-radius:999px;max-width:92%;text-align:center;animation:up .3s}
#confetti{position:fixed;inset:0;z-index:25;pointer-events:none}
#wm{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:.07;background-repeat:repeat}
.pledge{display:flex;gap:8px;align-items:flex-start;text-align:left;font-size:14px;font-weight:700;color:#C8D4F5;cursor:pointer;max-width:40ch}

.ranked-rules{font-size:13px;font-weight:700;color:var(--sun);max-width:42ch}
.ans-list{width:100%;display:flex;flex-direction:column;gap:8px;text-align:left}
.ans-list>div{background:var(--panel2);border-radius:14px;padding:8px 12px;font-weight:600;font-size:14px}
.ans-list b{display:block;color:var(--sun);font-size:15px}
.cred{background:#050816;border-radius:12px;padding:10px;font-size:13px;font-weight:700;display:flex;flex-direction:column;gap:3px}
.brief{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:18px;overflow:auto}

.brief-rows{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.brief-rows div{background:var(--panel2);border-radius:12px;padding:7px 12px;font-weight:700;font-size:14px;display:flex;gap:10px}
.brief-rows span{color:var(--muted);min-width:84px;flex:none}
.zone-ic{width:120px;height:84px}
.zone-ic svg{width:100%;height:100%}
.wiz{min-height:440px;justify-content:space-between}
.wiz-body{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;animation:up .3s ease-out}
.dots{display:flex;gap:6px;justify-content:center}

.dots i.done{background:var(--good)}
.hero{font-size:64px;line-height:1;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.howlist{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.howlist div{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:14px;padding:8px 12px;font-weight:700;font-size:15px}
.howlist .n{font-size:24px;width:32px;text-align:center;flex:none}
.suitprev{width:150px;height:180px}
.suitprev svg{width:100%;height:100%}
.suits{display:flex;gap:10px;justify-content:center}
.suits button{width:54px;height:54px;border-radius:50%;background:var(--c);border:3px solid transparent}
.suits button.on{border-color:#fff;box-shadow:0 0 0 3px var(--sun)}
.dests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.dests button{background:var(--panel2);border:2px solid transparent;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:800;min-width:0}
.dests button svg{width:64px;height:44px}
.dests button.on{border-color:var(--sun);background:var(--raise)}
.dests small{font-size:11px;color:var(--muted);font-weight:700;line-height:1.1}
.fields{display:flex;flex-direction:column;gap:8px;width:100%}
.fields input{background:var(--deep);border:2px solid var(--line);border-radius:12px;color:var(--ink);font:700 17px var(--font);padding:10px 12px;user-select:text;-webkit-user-select:text}
.nogl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-weight:700}
pre.dbg{background:#050816;border-radius:12px;padding:10px;font-size:11px;max-height:50vh;overflow:auto;white-space:pre-wrap;word-break:break-all;user-select:text;-webkit-user-select:text;font-family:ui-monospace,monospace;text-align:left}
.endtitle{position:fixed;left:0;right:0;top:38%;z-index:30;text-align:center;font-size:44px;font-weight:800;color:var(--sun);text-shadow:0 0 30px rgba(255,182,39,.6),0 3px 0 #000;pointer-events:none;animation:up .5s}

/* ---- cyber arena additions ---- */
.meter>span:first-child{flex:none;font-size:12px}.meter b{min-width:34px;text-align:right}
.duel{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12.5px;font-weight:800;color:var(--muted);border-top:1px solid var(--line);padding-top:3px}
.duel.up{color:var(--good)}.duel.down{color:#FF9AAE}
.gdots{display:flex;gap:3px}.gdots i{width:9px;height:9px;border-radius:3px;background:#2A3570;position:relative}.gdots i.g{background:#FF7EC8}.gdots i.m::after{content:'';position:absolute;inset:2px;border-radius:2px;background:var(--neon)}
.toast.ghost{background:linear-gradient(90deg,#7C3AED,#E0245A)}.toast.pup{background:linear-gradient(90deg,#0E7490,#7C3AED);top:140px}
.tagline{font-size:18px;font-weight:800;color:var(--neon);letter-spacing:.04em}
.tgrid{display:flex;justify-content:center}.tgrid svg{width:min(300px,82vw);height:auto;display:block}.tgrid .tc{cursor:pointer}
.racks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:min(270px,80vw);margin:0 auto}
.rack{background:var(--deep);border:2px solid var(--line);border-radius:14px;padding:6px 4px 2px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:13px;color:var(--muted)}
.rack svg{width:38px;height:42px}.rack.flash{background:var(--sp2);border-color:#fff;color:#0B1020;transform:scale(1.06)}.rack.ok{border-color:var(--good)}.rack.no{border-color:var(--bad);animation:sx .35s}.rack[disabled]{opacity:.85}
.entered{display:flex;gap:6px;justify-content:center}.entered i{width:22px;height:8px;border-radius:4px;background:var(--raise)}.entered i.on{background:var(--good)}
.pipe{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.pipe div{background:var(--deep);border:2px dashed rgba(150,180,255,.25);border-radius:10px;padding:4px 8px;min-height:34px;font-size:12.5px;font-weight:700;display:flex;gap:6px;align-items:center;line-height:1.15}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tiles button{background:var(--raise);border-radius:12px;padding:7px 8px;font-weight:700;font-size:13px;box-shadow:0 3px 0 #0A0F2A;min-height:46px;text-align:left;display:flex;gap:6px;align-items:center;line-height:1.15}
.tiles button .ti{font-size:20px;flex:none}.tiles button.done{background:#12483F;box-shadow:none;opacity:.55}.tiles button.hint{outline:3px solid var(--sun)}.tiles button.trap{opacity:.4}
.pwcards{display:flex;flex-direction:column;gap:5px}
.pwc{background:var(--raise);border-radius:12px;padding:6px 10px;box-shadow:0 3px 0 #0A0F2A;display:grid;grid-template-columns:1fr auto;gap:0 8px;text-align:left;align-items:center}

.pw{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:14px;color:#FFE2C4;word-break:break-all}
.pl{display:flex;gap:3px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.cs{font-style:normal;font-size:11px;font-weight:900;background:#0B1230;border-radius:5px;padding:0 5px;color:var(--neon)}
.len{display:flex;gap:1px}.len u{width:4px;height:10px;border-radius:1px;background:#FF8A5C;text-decoration:none;display:block}
.rslots{display:flex;flex-direction:column;gap:4px}
.rslot{display:flex;gap:8px;align-items:center;background:var(--deep);border:2px dashed rgba(150,180,255,.25);border-radius:10px;padding:4px 10px;min-height:32px;font-weight:800;font-size:13px;text-align:left}

.sim{display:flex;flex-direction:column;gap:5px;background:var(--deep);border-radius:12px;padding:8px}

.rxrule.lock{background:#4A1730;color:#FFD0DC}.rxrule.clear{background:#12483F;color:#CFF7E6}

.plist{display:flex;flex-direction:column;gap:6px}

.dr{display:grid;grid-template-columns:1fr 64px 64px;gap:6px;align-items:center;font-size:13px;font-weight:700;padding:2px 4px}
.dr span{display:flex;gap:6px;align-items:center;min-width:0}.dr span svg{width:16px;height:16px;flex:none;background:var(--raise);border-radius:5px;padding:2px}

/* ================= versions: a different puzzle for every player, same difficulty ================= */
function hashStr(str){let x=2166136261;for(let i=0;i<str.length;i++){x^=str.charCodeAt(i);x=Math.imul(x,16777619);}return x>>>0;}
function deviceId(){let d=store.get('fsl.deviceId',null);if(!d){d=uuid();store.set('fsl.deviceId',d);}return d;}
// Trace: 3-move cycle on a 6x6 grid, no wrap. Equal difficulty: 3 distinct moves (each 1-2 squares per axis), >=1 diagonal,
// no move undoes the previous one, net drift per cycle exactly 1 square, all 10 hops inside the grid on different squares.
function genTrace(r,N,shown,predict){
  const V=[];for(let a=-2;a<=2;a++)for(let b=-2;b<=2;b++)if(a||b)V.push([a,b]);const key=x=>x.join(',');
  for(let k=0;k<20000;k++){const v=[V[Math.floor(r()*V.length)],V[Math.floor(r()*V.length)],V[Math.floor(r()*V.length)]];
    if(new Set(v.map(key)).size<3)continue;if(!v.some(x=>x[0]&&x[1]))continue;
    const s=[v[0][0]+v[1][0]+v[2][0],v[0][1]+v[1][1]+v[2][1]];if(Math.max(Math.abs(s[0]),Math.abs(s[1]))!==1)continue;
    if(v.some((x,i)=>{const y=v[(i+1)%3];return x[0]===-y[0]&&x[1]===-y[1];}))continue;
    const p=[[Math.floor(r()*N),Math.floor(r()*N)]];for(let i=1;i<shown+predict;i++){const d=v[(i-1)%3];p.push([p[i-1][0]+d[0],p[i-1][1]+d[1]]);}
    if(p.some(q=>q[0]<0||q[1]<0||q[0]>=N||q[1]>=N))continue;if(new Set(p.map(key)).size<p.length)continue;
    return{moves:v,hops:p};}
  return{fallback:true,moves:[[1,2],[1,-1],[-2,0]],hops:[[1,0],[2,2],[3,1],[1,1],[2,3],[3,2],[1,2],[2,4],[3,3],[1,3]]};
}
function genPatrol(r,n){return rshuffle([0,1,2,3,4,5,6,7,8],r).slice(0,n);}
function genAlerts(r,j){
  const ev=j.events;const by=a=>ev.filter(e=>e.a===a);const pick=(arr,n)=>rshuffle(arr,r).slice(0,n).map(e=>e.id).concat(n>arr.length?[arr[0].id]:[]);
  return j.stages.map((n,si)=>{const lock=si===1;const mx=lock?{allow:3,block:2}:{allow:Math.round(n*.34),block:2};mx.report=n-mx.allow-mx.block;
    let a=[...pick(by('allow'),mx.allow),...pick(by('block'),mx.block),...pick(by('report'),mx.report)];
    for(let k=0;k<80;k++){a=rshuffle(a,r);const ans=a.map(id=>{const e=ev.find(x=>x.id===id);return lock&&e.a==='allow'?'block':e.a;});let bad=false;for(let i=2;i<ans.length;i++)if(ans[i]===ans[i-1]&&ans[i]===ans[i-2])bad=true;if(!bad)break;}
    return a;});
}
function makeVersion(seedStr,avoid={},zoneId=null){
  const r=rnd(hashStr(seedStr));const jb=id=>S.base.jobs.find(j=>j.id===id);const Z=S.base.districts;
  const v={seed:seedStr};
  if(zoneId&&Z.find(z=>z.id===zoneId))v.zone=zoneId;else{const ids=Z.map(z=>z.id);let i=Math.floor(r()*ids.length);const used=avoid.zone||[];if(used.length<ids.length)for(let k=0;k<ids.length&&used.includes(ids[i]);k++)i=(i+1)%ids.length;v.zone=ids[i];}
  v.shield=S.base.shield.start[Math.floor(r()*S.base.shield.start.length)];
  const tj=jb('trace');v.trace=genTrace(r,tj.size,tj.shown,tj.predict);
  v.patrol=genPatrol(r,jb('patrol').len);
  const pj=jb('patch');let pi=Math.floor(r()*pj.bank.length);const up=avoid.patch||[];if(up.length<pj.bank.length)for(let k=0;k<pj.bank.length&&up.includes(pi);k++)pi=(pi+1)%pj.bank.length;
  const sc=pj.bank[pi];const dec=rshuffle(Object.keys(sc.decoys),r).slice(0,pj.decoyCount);v.patch={scenario:pi,decoys:dec,order:rshuffle(Object.keys(sc.steps).concat(dec),r)};
  const cj=jb('crack');const ci=Math.floor(r()*cj.sets.length);v.crack={set:ci,cards:rshuffle(cj.sets[ci],r)};
  v.alerts=genAlerts(r,jb('alerts'));
  const ph=jb('phish');const tierPick=(arr,tier)=>{const c=arr.filter(x=>x.tier===tier);return c[Math.floor(r()*c.length)].id;};
  v.phish={msgs:rshuffle([0,1,2].map(ti=>tierPick(ph.msgsPhish,ti)).concat(rshuffle(ph.msgsLegit.map(x=>x.id),r).slice(0,3)),r),
           links:rshuffle([0,1,2].map(ti=>tierPick(ph.linksFake,ti)).concat(rshuffle(ph.linksLegit.map(x=>x.id),r).slice(0,3)),r)};
  return v;
}
const ARW=d=>(d[0]<0?'↑'+(-d[0]):d[0]>0?'↓'+d[0]:'')+(d[1]>0?'→'+d[1]:d[1]<0?'←'+(-d[1]):'');
function fmtDur(sec){if(sec<1)return UI.instant;const u=[[31536000,'year','वर्ष'],[86400,'day','दिन'],[3600,'hour','घंटे'],[60,'minute','मिनट'],[1,'second','सेकंड']];
  for(const [s,en,hi] of u)if(sec>=s){const n=sec/s;const v=n>=1e6?n.toExponential(1).replace('e+',' × 10^'):n>=100?fmt(n):String(Math.round(n));return{en:v+' '+en+(v==='1'?'':'s'),hi:v+' '+hi};}}
function applyVersion(v){
  const m=JSON.parse(JSON.stringify(S.base));const J=id=>m.jobs.find(j=>j.id===id);
  m.zone=m.districts.find(z=>z.id===v.zone)||m.districts[0];
  const tj=J('trace');tj.v=v.trace;const mv=v.trace.moves.map(ARW);tj.explain=subT(tj.explain,{moves:mv.join(', '),m1:mv[(tj.shown-1)%3],m2:mv[tj.shown%3],m3:mv[(tj.shown+1)%3]});
  const pa=J('patrol');pa.v=v.patrol;const nm=i=>String(i+1);pa.explain=subT(pa.explain,{fwd:v.patrol.map(nm).join(' → '),rev:v.patrol.slice().reverse().map(nm).join(' → ')});
  const pj=J('patch');const sc=pj.bank[v.patch.scenario];pj.sc=sc;pj.v=v.patch;delete pj.bank;
  const topo=[];const ks=Object.keys(sc.steps);while(topo.length<ks.length){const k=ks.find(x=>!topo.includes(x)&&sc.steps[x].needs.every(n=>topo.includes(n)));topo.push(k);}
  pj.topo=topo;pj.prompt=subT(pj.prompt,{title:sc.title});pj.explain=subT(pj.explain,{order:joinL(topo.map(k=>sc.steps[k]),' → '),decoys:joinL(v.patch.decoys.map(d=>({en:sc.decoys[d].en+': '+sc.decoys[d].why.en,hi:sc.decoys[d].hi+': '+sc.decoys[d].why.hi})),' ')});
  const cj=J('crack');cj.v=v.crack;cj.set=cj.sets[v.crack.set];delete cj.sets;
  cj.explain=subT(cj.explain,{list:joinL(cj.set.map(k=>{const rc=m.recipes[k],d=fmtDur(rc.sec);return{en:rc.en+' '+d.en,hi:rc.hi+' '+d.hi};}),' < ')});
  const aj=J('alerts');aj.v=v.alerts;const n=v.alerts.reduce((a,x)=>a+x.length,0);aj.prompt=subT(aj.prompt,{pass:aj.pass,n});
  const ph=J('phish');ph.v=v.phish;const pm=ph.msgsPhish.filter(x=>v.phish.msgs.includes(x.id)),pl=ph.linksFake.filter(x=>v.phish.links.includes(x.id));
  ph.explain=subT(ph.explain,{msgs:joinL(pm.map(x=>({en:x.frm+' ('+x.why.en+')',hi:x.frm+' ('+x.why.hi+')'})),'; '),links:joinL(pl.map(x=>({en:x.url+' → '+x.real+' ('+x.why.en+')',hi:x.url+' → '+x.real+' ('+x.why.hi+')'})),'; ')});
  S.ver=v;S.mission=m;
}

function ghostFromBot(rv,seed){const m=S.base,tier=m.tiers[rv.tier],r=rnd(hashStr(seed+'|'+rv.id)),js=m.scoring.job;let streak=0,cum=0;const p=[],tt=[];
  m.jobs.forEach(j=>{const first=r()<tier.first;const lvl=first?'first':(r()<.75?'second':'helped');const work=j.targetSec*(tier.speed[0]+r()*(tier.speed[1]-tier.speed[0]));const sec=work+14+r()*10;
    if(lvl==='first')streak++;else streak=0;const mult=lvl==='first'?js.streak[Math.min(streak,js.streak.length)-1]:1;const base=lvl==='first'?js.first:lvl==='second'?js.second:js.helped;
    const pts=Math.round(base*mult)+Math.round(js.speedMax*Math.max(0,1-work/j.targetSec));cum+=sec;p.push(pts);tt.push(Math.round(cum));});
  const bonus=Math.round(Math.max(0,m.windowSec-cum)*m.scoring.windowBonusPerSec);return{kind:'bot',id:rv.id,name:rv.name,c:rv.c,tier:rv.tier,p,t:tt,bonus,total:p.reduce((a,b)=>a+b,0)+bonus};}
function ghostFromRun(rec,name,kind){const js=rec.job_results;if(!js||js.length!==6||js.some(x=>x.done_at_sec==null))return null;const p=js.map(x=>x.points),tt=js.map(x=>x.done_at_sec);
  return{kind,id:kind,name,c:'#E5E7EB',tier:null,p,t:tt,bonus:rec.run.window_bonus||0,total:rec.run.points};}
function myBestGhost(){const runs=store.get(RUNKEY,[]).filter(x=>x.run&&x.run.completed&&x.run.mission_id==='cyber-defence');if(!runs.length)return null;runs.sort((a,b)=>b.run.points-a.run.points);return ghostFromRun(runs[0],t(UI.myBest),'best');}
function encodeDuel(){const js=jobResults();const o={n:(S.run.player_name||store.get('fsl.name','')||'Friend').slice(0,14),p:js.map(x=>x.points),t:js.map(x=>x.done_at_sec),b:S.run.window_bonus};
  try{return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/,'');}catch(e){return '';}}
function decodeDuel(s){try{const o=JSON.parse(decodeURIComponent(escape(atob(s))));if(!Array.isArray(o.p)||o.p.length!==6||!Array.isArray(o.t)||o.t.length!==6)return null;
  const p=o.p.map(x=>Math.max(0,Math.min(2000,x|0))),tt=o.t.map(x=>Math.max(1,Math.min(3600,x|0)));const name=String(o.n||'Friend').replace(/[<>&"']/g,'').slice(0,14)||'Friend';const b=Math.max(0,Math.min(2000,o.b|0));
  return{kind:'friend',id:'friend',name,c:'#E5E7EB',tier:null,p,t:tt,bonus:b,total:p.reduce((a,c)=>a+c,0)+b};}catch(e){return null;}}
function ghostAt(sec){const g=S.ghost;if(!g)return null;let n=0;while(n<6&&g.t[n]<=sec)n++;let pts=0;for(let i=0;i<n;i++)pts+=g.p[i];if(n===6)pts+=g.bonus;return{n,pts};}

  let c3=0;S.mission.jobs.forEach(j=>{const st=S.jobs[j.id];if(st.level==='first'&&st.learnMs<F.readMinSec*1000&&c3<3){c3++;add('C','C3',-3,`${j.id}: demo watched ${(st.learnMs/1000).toFixed(1)} s, then first try`);}});

  const leaves=S.fp.hidden+S.fp.blur+S.fp.fsExit;if(leaves>F.leaveMax)add('D','D1',-5*Math.min(3,leaves-F.leaveMax),`left the game ${leaves} times (${S.fp.hidden} hidden, ${S.fp.blur} focus lost, ${S.fp.fsExit} full screen exit)`);
  if(S.fp.hiddenMs>F.leaveTotalSec*1000)add('D','D1b',-5,`away from the game ${Math.round(S.fp.hiddenMs/1000)} s in total`);
  S.mission.jobs.forEach(j=>{const st=S.jobs[j.id];if(st.level!=='first')return;const ev=S.events.filter(e=>e.job_id===j.id).map(e=>e.t_ms);let gap=0;for(let i=1;i<ev.length;i++)gap=Math.max(gap,ev[i]-ev[i-1]);if(gap>F.idleSec*1000)add('D','D2',-5,`${j.id}: ${Math.round(gap/1000)} s pause, then first try`);});
  if(S.childId){const runs=store.get(RUNKEY,[]).filter(x=>x.run&&x.run.mode==='practice'&&x.run.player_id===S.childId&&x.run.completed);
    if(S.mode==='ranked'&&runs.length>=2){const avg=runs.reduce((a,x)=>a+x.job_results.reduce((q,r)=>q+r.skill_credit,0)/6,0)/runs.length;const mine=S.mission.jobs.reduce((q,j)=>q+S.jobs[j.id].credit,0)/6;if(mine>avg+0.4)add('E','E1',-10,`ranked skill ${mine.toFixed(2)} vs practice average ${avg.toFixed(2)}`);}}
  if(S.mode==='ranked'){const earlier=dev.filter(x=>x.child!==S.childId&&now-x.at<2*3600e3);const beat=earlier.find(x=>S.points>=1.3*x.points);if(beat)add('E','E2',-10,`scored ${S.points} after ${beat.child} scored ${beat.points} on this device within 2 h`);}
  if(S.fp.capture)add('F','F1',-10*S.fp.capture,`screenshot key pressed ${S.fp.capture} time(s)`);
  const groups={};fl.forEach(x=>groups[x.group]=(groups[x.group]||0)+x.points);let total=0;for(const g in groups){groups[g]=Math.max(F.caps[g],groups[g]);total+=groups[g];}
  const score=Math.max(0,100+total);const band=score>=F.bands.green?'Green':score>=F.bands.amber?'Amber':'Red';
  return{score,band,groups,flags:fl,signals:{leaves,hidden_ms:Math.round(S.fp.hiddenMs),focus_lost:S.fp.blur,fullscreen_exit:S.fp.fsExit,capture:S.fp.capture,study_leave:S.fp.studyLeave,fast_reacts:S.fp.fastReacts},note:'Screen recording and meeting screen-share cannot be seen by a web page; the app version can block them. Focus loss is the proxy here.'};
}

function label(text,{bg='rgba(11,16,32,.9)',fg='#E6F1FF',size=44,w=512,hgt=96}={}){
  const c=document.createElement('canvas');c.width=w;c.height=hgt;const g=c.getContext('2d');
  g.font=`800 ${size}px 'Baloo 2','Nirmala UI','Noto Sans Devanagari',sans-serif`;const tw=Math.min(w-20,g.measureText(text).width+40);
  g.fillStyle=bg;const x=(w-tw)/2,r=hgt/2-4;g.beginPath();g.moveTo(x+r,4);g.arcTo(x+tw,4,x+tw,hgt-4,r);g.arcTo(x+tw,hgt-4,x,hgt-4,r);g.arcTo(x,hgt-4,x,4,r);g.arcTo(x,4,x+tw,4,r);g.fill();
  g.fillStyle=fg;g.textAlign='center';g.textBaseline='middle';g.fillText(text,w/2,hgt/2+3,w-40);
  const tex=new THREE.CanvasTexture(c);tex.anisotropy=4;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));sp.scale.set(w/hgt*0.9,0.9,1);sp.renderOrder=10;return sp;}

function windowTex(seed,lit){const c=document.createElement('canvas');c.width=64;c.height=128;const g=c.getContext('2d');const r=rnd(seed);g.fillStyle='#0E1430';g.fillRect(0,0,64,128);
  for(let y=6;y<124;y+=10)for(let x=5;x<60;x+=11){const on=r()<lit;g.fillStyle=on?(r()<.5?'#7DE3FF':'#FFD27A'):'#18204A';g.fillRect(x,y,7,6);}const t2=new THREE.CanvasTexture(c);t2.magFilter=THREE.NearestFilter;return t2;}

  const grid=new THREE.GridHelper(200,50,0x3B2B7A,0x1E2456);grid.position.y=.02;sc.add(grid);R.gridH=grid;
  // stars + moon
  const r=rnd(11),pos=[];for(let i=0;i<700;i++){const th=r()*Math.PI*2,ph=Math.acos(r()*0.9);const rr=200;pos.push(rr*Math.sin(ph)*Math.cos(th),rr*Math.cos(ph)+5,rr*Math.sin(ph)*Math.sin(th));}
  const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));sc.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:1.1,fog:false})));

  // main street (the route) with glowing edge lines

  for(let i=0;i<route.length-1;i++){const [a,b]=route[i],[c,d]=route[i+1];const len=Math.hypot(c-a,d-b);const road=new THREE.Mesh(new THREE.PlaneGeometry(4,len+4),lam(0x1C2248));road.rotation.x=-Math.PI/2;road.rotation.z=-Math.atan2(c-a,d-b);road.position.set((a+c)/2,.04,(b+d)/2);sc.add(road);
    const n=Math.floor(len/2.4);for(let k=1;k<n;k++){const x=a+(c-a)*k/n,z=b+(d-b)*k/n;const s=new THREE.Mesh(new THREE.BoxGeometry(.25,.05,.8),basic(0x5EEAD4));s.position.set(x,.07,z);s.rotation.y=Math.atan2(c-a,d-b);sc.add(s);}}

  const near=(x,z)=>route.some(([a,b])=>Math.hypot(x-a,z-b)<9)||(Math.abs(x)<13&&z>-50&&z<40);
  for(let i=0;i<120;i++){const x=(r()-.5)*150,z=(r()-.5)*150-5;if(near(x,z))continue;const w=3+r()*5,d=3+r()*5,ht=4+r()*(Math.hypot(x,z)>45?30:14);
    const tex=windowTex(i*7+3,.25);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(Math.max(1,Math.round(w/3)),Math.max(1,Math.round(ht/6)));const mat=lam(0xffffff,{map:tex,emissive:0xffffff,emissiveMap:tex,emissiveIntensity:.25});R.winMats.push(mat);
    const b=new THREE.Mesh(new THREE.BoxGeometry(w,ht,d),mat);b.position.set(x,ht/2,z);sc.add(b);
    if(r()<.25){const edge=new THREE.Mesh(new THREE.BoxGeometry(w+.1,.25,d+.1),basic([0xF472B6,0x22D3EE,0xA78BFA][i%3]));edge.position.set(x,ht,z);sc.add(edge);}}
  buildProps();buildCore();buildAvatar();buildMarkers();buildDrones();
  R.ray=new THREE.Raycaster();R.clock=new THREE.Clock();
  resize();addEventListener('resize',resize);bindInput();applyZone();setStory(0,true);

}
function resize(){const w=innerWidth,hh=innerHeight;R.renderer.setSize(w,hh,false);R.camera.aspect=w/hh;R.camera.fov=w<hh?62:50;R.camera.updateProjectionMatrix();}

// story = number of stations cleared: red attack haze -> calm blue city
function setStory(n,instant){S.story=n;const k=n/6;const from={fog:R.scene.fog.color.clone(),win:R.winMats.length?R.winMats[0].emissiveIntensity:.25,hemi:R.hemi.intensity};
  const to={fog:new THREE.Color(0x3A0A24).lerp(new THREE.Color(0x0B1A3A),k),win:.18+.8*k,hemi:.6+.4*k};
  const apply=e=>{R.scene.fog.color.copy(from.fog).lerp(to.fog,e);const w=from.win+(to.win-from.win)*e;R.winMats.forEach(m=>m.emissiveIntensity=w);R.hemi.intensity=from.hemi+(to.hemi-from.hemi)*e;};
  if(instant)apply(1);else tween(2,apply);}

    const txt=(done?'★'.repeat(st.stars)+' ':locked?'🔒 ':(i+1)+' · ')+t(j.label);
    const lb=label(txt,{bg:done?'rgba(16,94,72,.95)':locked?'rgba(30,36,72,.85)':SP[j.superpower].hex,fg:done||locked?'#E6F1FF':'#0B1020'});lb.position.y=3.8;mk.g.add(lb);mk.label=lb;

/* --- input --- */
function bindInput(){
  const cv=$('#gl');let down=null;
  cv.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
  cv.addEventListener('pointerup',e=>{if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(moved<10)tap(e.clientX,e.clientY);});
}
function pick(x,y,objs){const v=new THREE.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1);R.ray.setFromCamera(v,R.camera);return R.ray.intersectObjects(objs,true);}
function tap(x,y){
  if(S.phase!=='play'||S.active)return;
  const hs=pick(x,y,R.hits);if(hs.length){goToStation(hs[0].object.userData.station);return;}
  const gh=pick(x,y,[R.ground]);if(gh.length){const p=gh[0].point;if(Math.hypot(p.x,p.z+5)<55){walkTo(p.x,p.z);SFX.tap();}}
}

/* --- frame loop --- */
const CAM={pos:new THREE.Vector3(0,12,48),look:new THREE.Vector3(0,2,26)};
function frame(){
  const dt=Math.min(.05,R.clock.getDelta());const tt=R.clock.elapsedTime;
  for(let i=R.tweens.length-1;i>=0;i--){const tw=R.tweens[i];tw.t+=dt;const k=Math.min(1,tw.t/tw.dur);tw.fn(k);if(k>=1){R.tweens.splice(i,1);tw.done&&tw.done();}}
  const av=R.avatar,w=R.walk;
  if(w.target){const d=new THREE.Vector3().subVectors(w.target,av.position);d.y=0;const dist=d.length();
    if(dist<.15){w.target=null;const cb=w.onArrive;w.onArrive=null;cb&&cb();}
    else{const step=Math.min(dist,8*dt);d.normalize();av.position.addScaledVector(d,step);const ang=Math.atan2(d.x,d.z);let da=ang-av.rotation.y;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;av.rotation.y+=da*Math.min(1,dt*10);w.phase+=dt*12;}}
  const sw=w.target?Math.sin(w.phase)*.7:0;R.legL.rotation.x=sw;R.legR.rotation.x=-sw;R.armL.rotation.x=-sw*.8;R.armR.rotation.x=sw*.8;
  av.position.y=(w.target?Math.abs(Math.sin(w.phase))*.08:0);
  if(R.trail.visible){const s=1+Math.sin(tt*6)*.15;R.trail.scale.set(s,s,s);}if(R.cape.visible)R.cape.rotation.x=.15+(w.target?.35:0)+Math.sin(tt*5)*.05;
  Object.values(R.markers).forEach((mk,i)=>{const s=1+Math.sin(tt*3+i)*.08;mk.ring.scale.set(s,s,s);});
  Object.values(R.drones).forEach(d=>{if(d.dead)return;d.g.position.set(d.base.x+Math.sin(tt*.8+d.i)*1.5,d.base.y+Math.sin(tt*2+d.i)*.5,d.base.z+Math.cos(tt*.7+d.i)*1.2);d.g.rotation.y+=dt*1.5;d.g.children[1].lookAt(R.camera.position);});
  if(R.props.leds)R.props.leds.forEach((l,i)=>{l.material.color.setHex(Math.sin(tt*4+i*1.7)>.3?0xB39BFF:0x2A2450);});
  if(R.props.alertScr)R.props.alertScr.material.color.setHex(S.jobs.alerts&&S.jobs.alerts.status==='done'?0x3DDC97:(Math.sin(tt*5)>0?0x4EA8FF:0xFF5D73));
  if(R.props.wheel)R.props.wheel.rotation.z+=dt*(S.jobs.crack&&S.jobs.crack.status==='done'?0:1.2);
  if(R.props.env)R.props.env.forEach((e,i)=>{e.position.y=2+i%2*.4+Math.sin(tt*2+i)*.15;});
  if(R.props.trace)R.props.trace.material.opacity=.25+Math.sin(tt*3)*.1;
  R.coreRing.rotation.z+=dt*.8;R.coreOrb.scale.setScalar(1+Math.sin(tt*3)*.08);
  let tp,tl;
  if(S.camMode==='job'&&S.camPose){tp=S.camPose.pos;tl=S.camPose.look;}
  else if(S.camMode==='core'){const c=S.mission.core;tp=new THREE.Vector3(c.x+14,10,c.z+26);tl=new THREE.Vector3(c.x,9,c.z);}
  else{const p=av.position;const portrait=innerWidth<innerHeight;tp=new THREE.Vector3(p.x,p.y+(portrait?11:9),p.z+(portrait?15:13));tl=new THREE.Vector3(p.x,p.y+1.2,p.z-3);}
  const k=1-Math.exp(-dt*3);CAM.pos.lerp(tp,k);CAM.look.lerp(tl,k);R.camera.position.copy(CAM.pos);R.camera.lookAt(CAM.look);
  R.renderer.render(R.scene,R.camera);
}

// 1 · Trace the Attack (C1.1): 7 hops shown, tap hops 8, 9, 10 on the grid
TASKS.trace=api=>{
  const j=api.job,V=j.v,N=j.size,cs=44,pad=4,W=N*cs+pad*2;let next=j.shown,done=false,wrong=0;const placed=[];
  const box=h('div',{class:'tgrid'});api.el.append(box);
  const prog=h('div',{class:'meta'});api.el.append(prog);
  const cx=c=>pad+c*cs+cs/2,cy=r=>pad+r*cs+cs/2;
  function draw(hint){let s=`<svg viewBox="0 0 ${W} ${W}"><rect width="${W}" height="${W}" rx="12" fill="#0B1230"/>`;
    for(let r=0;r<N;r++)for(let c=0;c<N;c++)s+=`<rect class="tc" data-r="${r}" data-c="${c}" x="${pad+c*cs+2}" y="${pad+r*cs+2}" width="${cs-4}" height="${cs-4}" rx="7" fill="#17204A" stroke="${hint&&hint[0]===r&&hint[1]===c?'#FFC83D':'#25306A'}" stroke-width="${hint&&hint[0]===r&&hint[1]===c?3:1}"/>`;
    const hops=V.hops.slice(0,j.shown);
    s+=`<polyline points="${hops.map(p=>cx(p[1])+','+cy(p[0])).join(' ')}" fill="none" stroke="#FF2E63" stroke-width="2" stroke-dasharray="4 4" opacity=".55"/>`;
    hops.forEach((p,i)=>{s+=`<g pointer-events="none"><circle cx="${cx(p[1])}" cy="${cy(p[0])}" r="15" fill="${i===j.shown-1?'#FF2E63':'#7A1638'}" stroke="#FF6B8F" stroke-width="2"/><text x="${cx(p[1])}" y="${cy(p[0])+5}" font-size="15" font-weight="900" text-anchor="middle" fill="#fff">${i+1}</text></g>`;});
    placed.forEach((p,i)=>{s+=`<g pointer-events="none"><path d="M${cx(p[1])} ${cy(p[0])-17} l14 6 v8 c0 9 -7 13 -14 16 c-7 -3 -14 -7 -14 -16 v-8z" fill="#22D3EE" stroke="#fff" stroke-width="2"/><text x="${cx(p[1])}" y="${cy(p[0])+5}" font-size="13" font-weight="900" text-anchor="middle" fill="#0B1020">${j.shown+i+1}</text></g>`;});
    s+='</svg>';box.innerHTML=s;
    box.querySelectorAll('.tc').forEach(el=>el.addEventListener('click',()=>tapCell(+el.dataset.r,+el.dataset.c,el)));
    prog.textContent=`🛡️ ${t(UI.hop)} ${Math.min(next+1,j.shown+j.predict)} · ${placed.length}/${j.predict}`;}
  function tapCell(r,c,el){if(done)return;const want=V.hops[next];
    if(r===want[0]&&c===want[1]){placed.push([r,c]);next++;SFX.tone(700+placed.length*120,.08,'triangle',.14);api.log('trace_hit',{hop:next,cell:[r,c]});api.say(t(UI.traceGood,{n:next}),'info');
      if(placed.length===j.predict){done=true;draw();api.say(t(UI.traceDone),'good');setTimeout(()=>api.complete({}),900);return;}draw();}
    else{if(V.hops.slice(0,next).some(p=>p[0]===r&&p[1]===c))return;wrong++;api.mistake({hop:next+1,cell:[r,c]});api.say(t(UI.traceWrong),'bad');el.setAttribute('fill','#5A1630');setTimeout(()=>draw(wrong>=3?want:null),450);}}
  draw();
  return {destroy(){}};
};

// 2 · Rewind the Patrol (C2.2): watch 6 rack checks, enter them in reverse
TASKS.patrol=api=>{
  const j=api.job;let seq=j.v,phase=0,pos=0,tm=[];const grid=h('div',{class:'racks'});const B=[];
  for(let i=0;i<9;i++){const b=h('button',{class:'rack','aria-label':'rack '+(i+1)},`<svg viewBox="0 0 40 46"><rect x="4" y="2" width="32" height="42" rx="4" fill="#1F2547" stroke="#3B4580"/>${[0,1,2,3].map(k=>`<rect x="9" y="${8+k*9}" width="22" height="4" rx="2" fill="#3A3F70"/>`).join('')}<circle cx="31" cy="38" r="2.5" fill="#B39BFF"/></svg><b>${i+1}</b>`);b.onclick=()=>tapRack(i);B.push(b);grid.append(b);}

    phase=3;B[i].classList.add('no');setTimeout(()=>B[i].classList.remove('no'),450);api.say(t(UI.patrolWrong),'bad');const r=api.answer(false,{seq,at:pos,got:i});
    if(!r.final){const again=h('button',{class:'big'},'↻ '+t(UI.patrolAgain));again.onclick=()=>{again.remove();seq=genPatrol(rnd(hashStr(S.ver.seed+'|patrol-retry')),j.len);play();};row.append(again);}}

// 3 · Patch Sequence (C3.1): tap fix steps in a working order (dependencies), leave out the traps
TASKS.order=api=>{
  const j=api.job,sc=j.sc,V=j.v;const placed=[];let done=false;const btns={};
  const pipe=h('div',{class:'pipe'});const tiles=h('div',{class:'tiles'});

  const hint=()=>{Object.values(btns).forEach(b=>b.classList.remove('hint'));if(S.jobs[j.id].mistakes<3)return;const k=j.topo.find(valid);if(k)btns[k].classList.add('hint');};
  V.order.forEach(k=>{const it=sc.steps[k]||sc.decoys[k];const b=h('button',{},`<span class="ti">${it.i}</span>${esc(t(it))}`);b.onclick=()=>press(k);btns[k]=b;tiles.append(b);});

    if(!valid(k)){api.mistake({item:k,placed:placed.slice()});api.say(t(UI.orderNeed),'bad');btns[k].classList.add('shake-x');setTimeout(()=>btns[k].classList.remove('shake-x'),400);hint();return;}
    placed.push(k);btns[k].classList.add('done');api.log('place',{item:k,order:placed.length});drawPipe();SFX.tone(600+placed.length*70,.1,'triangle',.14);api.say('✓ '+t(sc.steps[k]),'info');hint();
    if(placed.length===6){done=true;api.say(t(UI.orderDone),'good');setTimeout(()=>api.complete({order:placed.slice()}),1200);}}
  api.el.append(pipe,tiles);
  return {destroy(){}};
};

// 5 · Live Alert Room (C5.2): ALLOW / BLOCK / REPORT; lockdown flips ALLOW -> BLOCK, then all clear
TASKS.alerts=api=>{
  const j=api.job;let seq=j.v,run=0,busy=false,raf=null;
  const rule=h('div',{class:'rxrule'},esc(t(UI.normalRule)));const card=h('div',{class:'rxcard'},`<span style="font-size:40px">🚨</span>`);const bar=h('div',{class:'timebar'},'<i></i>');

      for(const id of seq[si]){const ev=evById(id);const lock=si===1;const need=lock&&ev.a==='allow'?'block':ev.a;const win=j.windowMs[si];
        cur={need,ev,stage:si,done:false};card.classList.remove('hit','miss');card.innerHTML=`<span class="e">${ev.i}</span><span>${esc(t(ev))}</span>`;shownAt=performance.now();SFX.tone(700,.05,'square',.05);
        await new Promise(res=>{const f=()=>{const e=performance.now()-shownAt;bar.firstChild.style.width=Math.max(0,100-e/win*100)+'%';if(cur.done){res();return;}if(e>=win){cur.done=true;slow++;answers.push({id:ev.id,stage:si,need,got:null});card.classList.add('miss');shieldChange(-1,'alert_slow');drawScore();res();return;}raf=requestAnimationFrame(f);};f();});

  }

    const good=a===cur.need;answers.push({id:cur.ev.id,stage:cur.stage,need:cur.need,got:a,rt:Math.round(rt)});
    if(good){right++;card.classList.add('hit');SFX.tone(880,.06,'triangle',.12);}else{wrong++;card.classList.add('miss');SFX.bad();shieldChange(-1,'alert_wrong');}

// 6 · Phish Hunter (C6.3): tap the 3 phishing messages, then the 3 fake links
function urlHtml(u){const m=/^(https:\/\/)([^/]+)(.*)$/.exec(u);return m?`<span class="sch">🔒 ${m[1]}</span><span class="host">${esc(m[2])}</span><span class="path">${esc(m[3])}</span>`:esc(u);}
TASKS.phish=api=>{

  function list(items,okMsg){const need=items.filter(x=>x.bad).length;let found=0,wrong=0;const prog=h('div',{class:'meta'},esc(t(UI.found,{n:0,m:need})));const g=h('div',{class:'plist'});
    items.forEach(it=>{const b=h('button',{class:'pitem '+it.cls},it.html);

        else{wrong++;api.mistake({part,key:it.key});api.say(t(okMsg),'bad');b.classList.add('no');setTimeout(()=>b.classList.remove('no'),450);
          if(wrong>=3)[...g.children].forEach((x,k)=>{if(items[k].bad&&!x.classList.contains('found'))x.classList.add('hint');});}};g.append(b);});
    area.append(prog,g);}
  const parts=[()=>list(V.msgs.map(id=>{const m=msg(id);return{key:id,bad:!!m.tier||m.tier===0?j.msgsPhish.includes(m):false,why:m.why,cls:'msg',html:`<b>${esc(m.frm)}</b><span>${esc(t(m))}</span>`};}).map(x=>(x.bad=j.msgsPhish.some(p=>p.id===x.key),x)),UI.notPhish),
               ()=>list(V.links.map(id=>{const l=lnk(id);return{key:id,bad:j.linksFake.some(p=>p.id===id),why:l.why,cls:'url',html:urlHtml(l.url)};}),UI.notFake)];
  function nextPart(){part++;area.innerHTML='';api.say('','info');if(part>=2){SFX.good();api.complete({});return;}api.setPrompt(j.prompts[part]);parts[part]();}
  api.setPrompt(j.prompts[0]);parts[0]();

/* ================= animated Learn demos (show, don't tell) =================
   Captions live in the mission JSON (job.demo[i]); the animation lives here: DEMO[jobId][i] = {ms, d:p=>svg}, p goes 0..1.
   Demos use fixed example content that never matches a player's own puzzle. Start unlocks after one full play. */
const DM={cl:(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),e:p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,lr:(a,b,p)=>a+(b-a)*p,seg:(p,a,b)=>DM.cl((p-a)/(b-a))};
const VB='0 0 320 190';
const dBg=()=>`<rect width="320" height="190" fill="#0B1230"/>${Array.from({length:9},(_,i)=>`<path d="M${i*40} 0 V190" stroke="#16204A"/>`).join('')}${Array.from({length:5},(_,i)=>`<path d="M0 ${i*40+15} H320" stroke="#16204A"/>`).join('')}`;
function dMark(x,y,ok,p){if(p<=0)return '';const s=DM.cl(p*1.6)*(1+Math.sin(DM.cl(p)*Math.PI)*.15);return `<g transform="translate(${x} ${y}) scale(${s.toFixed(2)})"><circle r="15" fill="${ok?'#3DDC97':'#FF5D73'}" stroke="#fff" stroke-width="3"/><path d="${ok?'M-7 0 l5 5 l9 -10':'M-6 -6 L6 6 M6 -6 L-6 6'}" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></g>`;}
function dTxt(x,y,s,o={}){return `<text x="${x}" y="${y}" font-size="${o.size||13}" font-weight="${o.w||800}" text-anchor="${o.a||'middle'}" fill="${o.c||'#E6F1FF'}" ${o.op!=null?`opacity="${o.op}"`:''}>${esc(s)}</text>`;}
function dShield(x,y,s=1,c='#22D3EE'){return `<path transform="translate(${x} ${y}) scale(${s})" d="M0 -14 l12 5 v7 c0 8 -6 11 -12 14 c-6 -3 -12 -6 -12 -14 v-7z" fill="${c}" stroke="#fff" stroke-width="2"/>`;}
function dFinger(x,y,p){const d=Math.sin(p*Math.PI*2)*3;return `<g transform="translate(${x} ${y+d})"><path d="M0 0 l-5 14 q-1 6 5 8 l9 0 q5 -1 5 -7 l0 -8 q0 -3 -3 -3 l-3 0 l0 -2 q0 -3 -3 -3 l-3 0 l0 -2 q0 -3 -3 -3z" fill="#FFE2C4" stroke="#0B1020" stroke-width="1.5"/></g>`;}

// trace: example cycle A=(0,+1) B=(+1,0) C=(-1,+1) on a 7x4 grid (drift 2: never a real puzzle)
const TR=(()=>{const mv=[[0,1],[1,0],[-1,1]];const p=[[2,0]];for(let i=1;i<8;i++){const d=mv[(i-1)%3];p.push([p[i-1][0]+d[0],p[i-1][1]+d[1]]);}return p;})();
function dTrace(n,{arrows=0,ghost=0,shield=0,hi=-1}={},p=1){const cs=34,ox=24,oy=28,cx=c=>ox+c*cs+cs/2,cy=r=>oy+r*cs+cs/2;let s=dBg();
  for(let r=0;r<4;r++)for(let c=0;c<8;c++)s+=`<rect x="${ox+c*cs+2}" y="${oy+r*cs+2}" width="${cs-4}" height="${cs-4}" rx="6" fill="#17204A" stroke="#25306A"/>`;
  const cols=['#FFC83D','#B39BFF','#2ED3C0'];
  for(let i=1;i<Math.min(n,TR.length);i++){if(i>arrows)break;const a=TR[i-1],b=TR[i],k=(i-1)%3;s+=`<line x1="${cx(a[1])}" y1="${cy(a[0])}" x2="${cx(b[1])}" y2="${cy(b[0])}" stroke="${cols[k]}" stroke-width="${hi===k?5:3}" stroke-linecap="round"/>`;
    if(i<=3)s+=dTxt((cx(a[1])+cx(b[1]))/2+(k===1?-10:0),(cy(a[0])+cy(b[0]))/2-6,'ABC'[k],{c:cols[k],size:14});}
  for(let i=0;i<n&&i<TR.length;i++){const q=TR[i];const sc=i===n-1?DM.cl(p*3):1;s+=`<g transform="translate(${cx(q[1])} ${cy(q[0])}) scale(${sc.toFixed(2)})"><circle r="12" fill="#7A1638" stroke="#FF6B8F" stroke-width="2"/>${dTxt(0,5,String(i+1),{size:12})}</g>`;}
  if(ghost){const q=TR[n];s+=`<circle cx="${cx(q[1])}" cy="${cy(q[0])}" r="13" fill="none" stroke="#22D3EE" stroke-width="2" stroke-dasharray="4 3"/>`;if(shield)s+=dShield(cx(q[1]),cy(q[0]),DM.cl(shield));}
  return s;}

// patrol
const PT=[4,0,8];
function dRacks(flash,taps,p){let s=dBg();for(let i=0;i<9;i++){const x=95+(i%3)*46,y=22+Math.floor(i/3)*50;const on=flash===i;const tp=taps.indexOf(i);
  s+=`<rect x="${x}" y="${y}" width="38" height="42" rx="6" fill="${on?'#B39BFF':'#1F2547'}" stroke="${tp>=0?'#3DDC97':'#3B4580'}" stroke-width="${tp>=0?3:1.5}"/>${dTxt(x+19,y+27,String(i+1),{c:on?'#0B1020':'#9AA6D6',size:15})}`;
  if(tp>=0)s+=dTxt(x+33,y+12,String(tp+1),{c:'#3DDC97',size:11});}return s;}

// patch pipeline
function dPipe(items,trap,p){let s=dBg();s+=`<path d="M20 150 H300" stroke="#2ED3C0" stroke-width="4" stroke-dasharray="8 6" opacity=".5"/>`;
  items.forEach((it,i)=>{const x=34+i*64,y=120;s+=`<rect x="${x-26}" y="${y-22}" width="52" height="44" rx="10" fill="#17304A" stroke="#2ED3C0" stroke-width="2"/>${dTxt(x,y+6,it,{size:20})}${dTxt(x,y+38,String(i+1),{c:'#2ED3C0',size:12})}`;});
  if(trap){const y=DM.lr(20,70,DM.e(DM.cl(p*2)));s+=`<rect x="232" y="${y-22}" width="60" height="44" rx="10" fill="#4A1730" stroke="#FF5D73" stroke-width="2"/>${dTxt(262,y+7,'💸',{size:20})}`;if(p>.5)s+=`<path d="M228 ${y-26} L296 ${y+26} M296 ${y-26} L228 ${y+26}" stroke="#FF5D73" stroke-width="4"/>`;}
  return s;}

// crack: guess counter bars
function dGuess(rows,p){let s=dBg();rows.forEach((r,i)=>{const y=34+i*48;const w=DM.cl(p*r.speed)*r.w;s+=dTxt(16,y+4,r.pw,{a:'start',size:13,c:'#FFE2C4'})+`<rect x="16" y="${y+12}" width="288" height="14" rx="7" fill="#17204A"/><rect x="16" y="${y+12}" width="${w.toFixed(1)}" height="14" rx="7" fill="${r.c}"/>`+dTxt(304,y+4,p>=1/r.speed||r.speed>50?r.out:'…',{a:'end',size:13,c:r.c});});return s;}

// alerts
function dAlert(icon,lbl,mode,press,p){let s=`<rect width="320" height="190" fill="${mode==='lock'?'#2A0E24':'#0B1230'}"/>`;const sc=.7+.3*DM.e(DM.cl(p*4));
  s+=dTxt(160,22,mode==='lock'?'🔒 LOCKDOWN':mode==='clear'?'✅ ALL CLEAR':'🟢 NORMAL',{c:mode==='lock'?'#FF7EA8':'#9BE7C4',size:14});
  s+=`<g transform="translate(160 78) scale(${sc.toFixed(2)})"><rect x="-80" y="-36" width="160" height="72" rx="14" fill="#17204A" stroke="${mode==='lock'?'#FF5D73':'#4EA8FF'}" stroke-width="3"/>${dTxt(0,0,icon,{size:28})}${dTxt(0,24,lbl,{size:11})}</g>`;
  s+=`<rect x="90" y="124" width="140" height="7" rx="3.5" fill="#17204A"/><rect x="90" y="124" width="${(140*(1-DM.cl(p/.6))).toFixed(1)}" height="7" rx="3.5" fill="#4EA8FF"/>`;
  [['allow','ALLOW','#2FA86F'],['block','BLOCK','#D9534F'],['report','REPORT','#D99A2B']].forEach(([k,l,c],i)=>{const x=60+i*100,on=press===k&&p>.55;s+=`<g transform="translate(${x} 163) scale(${on?1.12:1})"><rect x="-44" y="-15" width="88" height="30" rx="11" fill="${c}" stroke="${on?'#fff':'none'}" stroke-width="3"/>${dTxt(0,5,l,{size:13})}</g>`;});
  return s;}

// phish
function dPhone(lines,flags,p){let s=dBg()+`<rect x="70" y="10" width="180" height="172" rx="18" fill="#E9EEF8" stroke="#0B1020" stroke-width="3"/><rect x="82" y="34" width="156" height="96" rx="10" fill="#fff" stroke="#C8D0E6"/>`;
  lines.forEach((l,i)=>{s+=dTxt(90,54+i*18,l,{a:'start',size:11,c:'#0B1020',w:700});});
  flags.forEach((f,i)=>{if(p<f.at)return;s+=`<rect x="${f.x}" y="${f.y}" width="${f.w}" height="16" rx="5" fill="none" stroke="#FF2E63" stroke-width="2.5"/>`+dTxt(f.x+f.w/2,f.y+30,f.tag,{c:'#FF2E63',size:11});});return s;}
function dUrl(p,step){let s=dBg()+`<rect x="10" y="64" width="300" height="40" rx="10" fill="#E9EEF8"/>`;const host='nagarbank.in.secure-login.co',path='/kyc';
  s+=`<text x="20" y="90" font-size="13.5" font-weight="800" fill="#0B1020" font-family="ui-monospace,monospace">https://<tspan fill="${step>=2?'#8A93B2':'#0B1020'}">nagarbank.in.</tspan><tspan fill="${step>=2?'#FF2E63':'#0B1020'}">secure-login.co</tspan><tspan fill="#5A6380">${path}</tspan></text>`;
  if(step>=1){const x=DM.lr(20,262,DM.e(DM.cl(p*1.4)));s+=`<path d="M${x} 112 l6 10 h-12z" fill="#FFC83D"/>`+dTxt(x,138,step>=2?'':t(L2('first single /','पहला अकेला /')),{c:'#FFC83D',size:12});}
  if(step>=2)s+=`<path d="M150 108 q60 30 120 0" fill="none" stroke="#FF2E63" stroke-width="2"/>`+dTxt(210,150,t(L2('real owner: secure-login.co','असली मालिक: secure-login.co')),{c:'#FF7EA8',size:12})+dMark(160,30,false,p);
  return s;}

         {ms:3600,d:p=>dTrace(7,{arrows:6,ghost:1,shield:DM.seg(p,.35,.8)},p)+dMark(285,30,true,DM.seg(p,.7,1))}],

          {ms:2600,d:p=>dRacks(-1,[8],p)+dFinger(95+46+24,22+26,p)+dMark(285,30,false,DM.seg(p,.3,.7))}],

         {ms:3200,d:p=>dGuess([{pw:'Welcome@123',w:20,speed:60,c:'#FF5D73',out:'⚡ 0 s'},{pw:t(L2('leaked list: 1 · 2 · 3 …','लीक लिस्ट: 1 · 2 · 3 …')),w:0,speed:1,c:'#8A93B2',out:''}],p)},
         {ms:4200,d:p=>dGuess([{pw:'k#9Lm!2q  (8)',w:120,speed:1.3,c:'#FFC83D',out:t(L2('~4 days','~4 दिन'))},{pw:'k#9Lm!2qx  (9)',w:200,speed:1.15,c:'#FF8A5C',out:'×95'},{pw:'k#9Lm!2qxz  (10)',w:288,speed:1,c:'#3DDC97',out:'×95×95'}],p)},
         {ms:4200,d:p=>dGuess([{pw:t(L2('k#9Lm!2q  (8, all types)','k#9Lm!2q  (8, सब तरह)')),w:120,speed:1.2,c:'#FFC83D',out:t(L2('~4 days','~4 दिन'))},{pw:t(L2('vbqnxlrtzoek  (12 letters)','vbqnxlrtzoek  (12 अक्षर)')),w:200,speed:1,c:'#3DDC97',out:t(L2('~55 days','~55 दिन'))}],p)+dMark(285,170,true,DM.seg(p,.8,1))}],

function showDemo(j,peek){HOST.stop();
  const beats=DEMO[j.id],caps=j.demo||[];const c=openOv();c.style.setProperty('--c',SP[j.superpower].c);c.classList.add('democard');
  const head=h('div',{class:'ph'},`<div class="badge">${ICON[j.superpower]}</div><div class="pt"><small>${esc(t(SP[j.superpower]))} · ${j.competency} ${COMP[j.competency]||''}</small><b>${esc(t(j.label))}</b></div>`);
  const body=h('div',{class:'pb'});c.append(head,body);
  const stage=h('div',{class:'art demo'});const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',VB);stage.append(svg);
  const cap=h('div',{class:'dcap'});const dots=h('div',{class:'ddots'});beats.forEach(()=>dots.append(h('i')));
  const row=h('div',{class:'row'});body.append(h('div',{class:'kicker'},'▶ '+esc(t(UI.watch))),stage,cap,dots,row);
  const st=S.jobs[j.id];let i=0,t0=0,raf=0,played=!!st.demoSeen||peek,startBtn=null;
  const dur=k=>Math.max(beats[k].ms,(caps[k]?t(caps[k]).length:0)*62)/(window.__demoSpeed||1);
  function speak(k){if(!S.sound||!caps[k])return;try{const sy=window.speechSynthesis;if(!sy)return;sy.cancel();const u=new SpeechSynthesisUtterance(t(caps[k]));u.lang=S.lang==='hi'?'hi-IN':'en-IN';u.rate=1.04;const vs=sy.getVoices();const v=vs.find(x=>x.lang===u.lang)||vs.find(x=>x.lang&&x.lang.startsWith(S.lang));if(v)u.voice=v;sy.speak(u);}catch(e){}}
  function setBeat(k){i=k;t0=performance.now();cap.innerHTML=`<b>${k+1}</b><span>${esc(caps[k]?t(caps[k]):'')}</span>`;[...dots.children].forEach((d,n)=>d.className=n<k?'done':n===k?'on':'');speak(k);}
  function frame(now){if(!c.isConnected){cancelAnimationFrame(raf);return;}const p=DM.cl((now-t0)/dur(i));try{svg.innerHTML=beats[i].d(p);}catch(e){svg.innerHTML='';}
    if(p>=1){if(i<beats.length-1)setBeat(i+1);else if(!played){played=true;st.demoSeen=true;buildRow();}}
    raf=requestAnimationFrame(frame);}
  function stopLearnClock(){if(st.learnOpen!=null){st.learnMs+=performance.now()-st.learnOpen;st.learnOpen=null;}}
  function buildRow(){row.innerHTML='';
    row.append(h('button',{class:'big alt',title:'replay',onclick:()=>{SFX.tap();setBeat(0);}},'↻'));
    if(peek)row.append(h('button',{class:'big',onclick:()=>{cancelAnimationFrame(raf);try{speechSynthesis.cancel();}catch(e){}closeOv();S.learnView=null;}},t(UI.backToJob)));
    else{row.prepend(h('button',{class:'big alt',onclick:()=>{cancelAnimationFrame(raf);try{speechSynthesis.cancel();}catch(e){}stopLearnClock();closeOv();S.learnView=null;leaveJob(false);}},'✕'));
      startBtn=h('button',{class:'big',disabled:!played,onclick:()=>{cancelAnimationFrame(raf);try{speechSynthesis.cancel();}catch(e){}stopLearnClock();st.learnDone=true;log('learn_done',j.id,{learn_ms:Math.round(st.learnMs),demo:true});closeOv();S.learnView=null;startJob(j);}},played?t(UI.startJob)+' ▶':'⏳ '+t(UI.watchFirst));
      row.append(startBtn);}}
  buildRow();setBeat(0);raf=requestAnimationFrame(frame);S.learnView={j,si:0,peek};
}

/* ================= game flow ================= */
function isUnlocked(j){if(j.unlock==='start')return true;return S.jobs[j.unlock]&&S.jobs[j.unlock].status==='done';}
function nextJob(){return S.mission.jobs.find(j=>S.jobs[j.id].status!=='done'&&isUnlocked(j));}
function jobById(id){return S.mission.jobs.find(j=>j.id===id);}
function renderHUD(){
  const tm=$('#timer');tm.textContent='⏱ '+fmtTime(Math.max(0,S.windowLeft)*1000);tm.classList.toggle('low',S.windowLeft<=120);
  $('#score').textContent='★ '+fmt(S.points);const st=$('#streak');if(S.streak>=2){st.classList.remove('hidden');st.textContent='🔥'+S.streak;}else st.classList.add('hidden');
  $('#coins').textContent=S.coins;$('#lang').textContent=S.lang==='en'?'हिं':'EN';$('#snd').textContent=S.sound?'🔊':'🔇';
  $('#meters').classList.toggle('hidden',!(S.phase==='play'||S.phase==='ending'));renderShield();
}
function renderJobbar(){
  const jb=$('#jobbar');jb.innerHTML='';const nx=nextJob();
  S.mission.jobs.forEach(j=>{const st=S.jobs[j.id];const locked=!isUnlocked(j);const done=st.status==='done';
    const b=h('button',{class:'jb'+(locked?' lock':'')+(done?' done':'')+(nx&&nx.id===j.id?' next':''),style:{'--c':SP[j.superpower].c},'aria-label':t(j.label)},`<span class="ic">${ICON[j.superpower]}</span><span>${done?'★'.repeat(st.stars):(locked?'🔒 ':'')+esc(t(j.label))}</span>`);
    b.onclick=()=>goToStation(j.id);jb.append(b);});
}
function renderBubble(){const b=$('#bubble');if(S.phase!=='play'||S.active||$('#lower3')){b.classList.add('hidden');return;}b.classList.remove('hidden');
  const nx=nextJob();b.textContent=(S.mode==='ranked'?'🏆 ':'')+(S.jobs.trace.status!=='done'?t(UI.goFirst):(nx?t(UI.tapStation)+' · '+t(nx.label):t(UI.goCore))+(S.beat!=null?' · 🎯 '+fmt(S.beat):''));}
function refreshAll(){if(!S.active&&(S.phase==='play'||S.phase==='intro'))showMarkers(true);renderHUD();renderJobbar();renderBubble();refreshMarkerLabels();}
function toast(msg,ms=2600,kind=''){const e=h('div',{class:'toast '+kind},esc(msg));document.body.append(e);setTimeout(()=>e.remove(),ms);}

let clockId=null;
function startClock(){S.windowStart=performance.now();clearInterval(clockId);clockId=setInterval(()=>{if(S.phase!=='play'){clearInterval(clockId);return;}
  S.windowLeft=S.mission.windowSec-Math.floor(playSec());
  if(S.windowLeft<=0&&!S.windowClosedShown){S.windowClosedShown=true;toast(t(UI.windowClosed),4000);log('window_closed');SFX.bad();}
  const g=ghostAt(playSec());if(g&&g.n>S.ghostSeen){S.ghostSeen=g.n;const j=S.mission.jobs[g.n-1];if(!S.active)toast(g.n===6?t(UI.ghostFinished,{r:S.ghost.name}):'⚔️ '+t(UI.ghostDone,{r:S.ghost.name,s:t(j.label)}),2200,'ghost');log('ghost_progress',null,{n:g.n,pts:g.pts});}
  renderHUD();renderBubble();},500);}

function goToStation(id){
  if(S.phase!=='play'||S.active)return;const j=jobById(id);const st=S.jobs[id];
  if(st.status==='done'){SFX.tap();return;}
  if(!isUnlocked(j)){toast(t(UI.locked),1800);SFX.bad();return;}

  $('#snd').onclick=()=>{S.sound=!S.sound;store.set('fsl.sound',S.sound);if(!S.sound)try{speechSynthesis.cancel();}catch(e){}renderHUD();};
  $('#timer').onclick=()=>{tTaps++;clearTimeout(tTimer);tTimer=setTimeout(()=>tTaps=0,1500);if(tTaps>=5){tTaps=0;showLog();}};
  document.fonts&&document.fonts.ready.then(()=>refreshMarkerLabels());
  if(location.hash==='#debug')showLog();else showIntro();
  window.__fsl={S,R,goToStation,tap,computeCred,makeVersion,applyVersion,finishJob,ending,ghostAt,genTrace};
}
boot();

</script>
