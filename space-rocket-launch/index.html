<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="FSL Round 2 mission: walk into a 3D launch site, do 6 real rocket jobs and launch.">
</head>
<body>
<title>Space Rocket Launch Day</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
/* Layout: full-screen 3D launch site. HUD on top, job bar at the bottom, compact job panel slides up while the 3D stays visible; learn cards and results use a centred card. Single dark "space" look by design. */
:root{
  color-scheme:dark;
  --space:#0A0E2E; --panel:#171D52; --panel2:#222A6E; --raise:#2C3584; --deep:#0B1138;
  --ink:#F5F6FF; --muted:#AEB5E8; --line:rgba(255,255,255,.14);
  --sun:#FFC83D; --good:#3DDC97; --bad:#FF5D73;
  --sp1:#FFC83D; --sp2:#B39BFF; --sp3:#2ED3C0; --sp4:#FF8A5C; --sp5:#4EA8FF; --sp6:#FF7EC8;
  --font:'Baloo 2','Nirmala UI','Noto Sans Devanagari','Mangal',system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--space);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-size:16px;line-height:1.3;touch-action:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;z-index:5;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:4px;pointer-events:none;max-width:600px;margin:0 auto}
.hud>*{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:4px;background:rgba(23,29,82,.88);border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-weight:800;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.low{background:var(--bad);border-color:var(--bad)}
.chip.streak{background:linear-gradient(90deg,#FF7A3D,#FF3D7F);border:0}
.sp{flex:1;min-width:0}
.iconbtn{background:rgba(23,29,82,.88);border:1px solid var(--line);border-radius:999px;height:32px;min-width:32px;padding:0 8px;font-weight:700;font-size:14px;flex:none}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE89A,#FFB800 60%,#C98A00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);display:inline-block;flex:none}
.bubble{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 50px);transform:translateX(-50%);z-index:5;background:rgba(10,14,46,.85);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:14px;font-weight:700;max-width:92%;text-align:center;pointer-events:none}
.jobbar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;max-width:600px;margin:0 auto}
.jb{background:rgba(23,29,82,.9);border:1px solid var(--line);border-radius:14px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;font-weight:700;line-height:1.05;color:var(--muted);min-width:0}
.jb .ic{width:30px;height:30px;border-radius:10px;background:var(--c);display:flex;align-items:center;justify-content:center}
.jb .ic svg{width:19px;height:19px}
.jb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.jb.lock{opacity:.45}
.jb.lock .ic{background:var(--panel2)}
.jb.done{border-color:var(--good);color:var(--sun)}
.jb.next{border-color:var(--sun);animation:glow 1.4s infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px rgba(255,200,61,.5)}}
.hidden{display:none!important}

.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(4,6,24,.6);padding:14px}
.card{width:100%;max-width:520px;max-height:100%;background:var(--panel);border-radius:26px;border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:10;margin:0 auto;max-width:560px;max-height:58%;background:rgba(23,29,82,.97);border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;display:flex;flex-direction:column;overflow:hidden;animation:up .25s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
.panel.tall{max-height:78%}
.ph{display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
.badge{width:40px;height:40px;border-radius:13px;background:var(--c);display:flex;align-items:center;justify-content:center;flex:none}
.badge svg{width:25px;height:25px}
.pt{flex:1;min-width:0}
.pt small{display:block;font-size:11px;color:var(--c);font-weight:700}
.pt b{font-size:18px;font-weight:800;display:block;line-height:1.1}
.x{width:36px;height:36px;border-radius:50%;background:var(--panel2);font-size:20px;font-weight:700;flex:none}
.pb{padding:0 14px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.kicker{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.prompt{font-size:16px;font-weight:700;text-wrap:balance}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:700}
.meta .notes{margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.meta .notes[disabled]{opacity:.5}
.fb{border-radius:14px;padding:8px 12px;font-weight:700;font-size:15px;min-height:20px}
.fb.good{background:rgba(61,220,151,.14);border:1px solid var(--good)}
.fb.bad{background:rgba(255,93,115,.12);border:1px solid var(--bad)}
.fb.info{color:var(--sun);padding:0 2px}
.big{background:linear-gradient(180deg,#FFD45C,#FFB21E);color:#2A1A00;font-weight:800;font-size:18px;border-radius:16px;padding:10px 20px;box-shadow:0 4px 0 #C98500}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #C98500}
.big.alt{background:var(--raise);color:var(--ink);box-shadow:0 4px 0 #161B4F}
.big[disabled]{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.shake-x{animation:sx .35s}
@keyframes sx{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.learn-text{font-size:17px;font-weight:600;color:#E3E7FF}
.learn-text ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.learn-text li{background:var(--panel2);border-radius:12px;padding:6px 10px;display:flex;gap:8px;align-items:center}
.learn-text li b{color:var(--sun)}
.tail{color:var(--sun);font-weight:800}
.art{background:var(--deep);border-radius:18px;padding:8px;display:flex;justify-content:center}
.art svg{width:100%;max-width:320px;height:auto;display:block}
.art .part{cursor:pointer}
.art .part.sel{filter:drop-shadow(0 0 6px #FFC83D)}
.infobox{background:var(--panel2);border-radius:14px;padding:8px 12px;font-weight:600;min-height:44px}
.infobox b{color:var(--sun)}
.timeline{display:flex;flex-direction:column;gap:6px}
.tl{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:12px;padding:6px 10px;font-weight:700;opacity:.35;transition:opacity .3s}
.tl.on{opacity:1}
.tl .n{width:26px;height:26px;border-radius:50%;background:var(--sp3);color:#0A0E2E;display:flex;align-items:center;justify-content:center;flex:none;font-weight:800}

.stepper{display:flex;align-items:center;gap:14px;font-weight:800;justify-content:center}
.stepper button{width:50px;height:50px;border-radius:16px;background:var(--raise);font-size:28px;font-weight:800;box-shadow:0 4px 0 #161B4F}
.stepper b{font-size:30px;min-width:36px;text-align:center}
.fc-wrap{overflow-x:auto}
.fc{display:grid;gap:3px;min-width:320px}
.fc .lab{display:flex;align-items:center;justify-content:center}
.fc .lab svg{width:26px;height:26px}
.fc .cell{background:var(--deep);border-radius:6px;text-align:center;font-weight:800;font-size:13px;padding:4px 0;font-variant-numeric:tabular-nums}
.fc .tcell{background:var(--raise);border-radius:8px;text-align:center;font-weight:800;font-size:12px;padding:4px 0;color:var(--ink)}
.fc .col-sel{outline:3px solid var(--sun);outline-offset:-1px}
.fc .col-right{background:rgba(61,220,151,.3)}
.fc .col-wrong{background:rgba(255,93,115,.3)}
.rulesline{font-size:13px;font-weight:700;color:var(--sun);text-align:center}
.seqbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seqbtns button{background:var(--raise);border-radius:14px;padding:10px 8px;font-weight:800;font-size:15px;box-shadow:0 4px 0 #161B4F;min-height:52px}
.seqbtns button.done{background:#1D5F48;box-shadow:none;opacity:.7}
.seqbtns button.hint{outline:3px solid var(--sun)}
.seqbtns button.rel{background:linear-gradient(180deg,#FF6B7F,#E03A52);grid-column:1/-1;font-size:18px}
.thrust{position:relative;height:26px;border-radius:999px;background:var(--deep);overflow:hidden}
.thrust i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#FF8A3D,#FFC83D);width:0}
.thrust .wl{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--bad)}
.thrust span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000}
.rule{text-align:center;font-size:18px;font-weight:800;border-radius:14px;padding:6px;background:var(--panel2)}
.rule.flash{animation:fl .6s 2}
@keyframes fl{50%{background:var(--sun);color:#2A1A00}}
.holes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:320px;width:100%;margin:0 auto}
.hole{aspect-ratio:1.4;border-radius:14px;background:var(--deep);border:2px solid #2C3584;display:flex;align-items:center;justify-content:center}
.gauge{width:86%;height:80%;border-radius:12px;background:#E9ECFF;color:#0A0E2E;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:pin .15s ease-out;padding:0}
.gauge b{font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.gauge small{font-size:11px;font-weight:700;color:#5A628F}
@keyframes pin{from{transform:scale(.3)}to{transform:scale(1)}}
.gauge.hit{background:var(--good);animation:hitp .25s forwards}
.gauge.oops{background:var(--bad);animation:sx .3s}
@keyframes hitp{to{transform:scale(1.3);opacity:0}}
.timebar{height:10px;border-radius:999px;background:var(--panel2);overflow:hidden}
.timebar i{display:block;height:100%;background:var(--sp5);width:100%}
.score3{display:flex;justify-content:center;gap:16px;font-weight:700;font-size:15px;color:var(--muted)}
.done{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.starrow{font-size:34px;letter-spacing:4px;line-height:1;color:var(--sun)}
.starrow .off{opacity:.2;color:var(--ink)}
.gain{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.piece{font-size:14px;font-weight:700;background:var(--panel2);border-radius:999px;padding:3px 12px;display:inline-flex;gap:6px;align-items:center}

.intro{padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;overflow:auto}
.intro h1{margin:0;font-size:30px;line-height:1.02;font-weight:800;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sun);font-weight:700}
.intro p{margin:0;font-size:16px;font-weight:600;color:#DADFFF;max-width:38ch}
.suits{display:flex;gap:10px;justify-content:center}
.suits button{width:46px;height:46px;border-radius:50%;background:var(--c);border:3px solid transparent}
.suits button.on{border-color:#fff;box-shadow:0 0 0 3px var(--sun)}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%}
.howto div{background:var(--panel2);border-radius:12px;padding:8px 4px;font-size:12px;font-weight:700;color:var(--muted);line-height:1.15}
.howto b{display:block;color:var(--ink);font-size:20px}
.beat{background:linear-gradient(90deg,#FF7A3D,#FF3D7F);border-radius:14px;padding:8px 14px;font-weight:800}
.res-big{font-size:54px;font-weight:800;line-height:1;color:var(--sun);font-variant-numeric:tabular-nums}
.rank{font-size:22px;font-weight:800;background:linear-gradient(90deg,#B39BFF,#4EA8FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.res-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%}
.res-grid div{background:var(--panel2);border-radius:14px;padding:8px 2px;font-weight:700;font-size:12px;color:var(--muted)}
.res-grid b{display:block;color:var(--ink);font-size:19px;font-variant-numeric:tabular-nums}
.res-list{width:100%;display:flex;flex-direction:column;gap:6px}
.res-list>div{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:6px 10px;font-weight:700;font-size:14px;text-align:left}
.res-list .badge{width:32px;height:32px;border-radius:10px}
.res-list .badge svg{width:20px;height:20px}
.res-list span.l{flex:1;min-width:0}
.res-list em{font-style:normal;color:var(--sun);white-space:nowrap}
.board{width:100%;background:var(--deep);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:4px;text-align:left}
.board h4{margin:0 0 4px;font-size:16px}
.board .r{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;align-items:center;padding:4px 8px;border-radius:10px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.board .r.me{background:rgba(255,200,61,.15);color:var(--sun)}
.board .r small{color:var(--muted);font-weight:600}
.namerow{display:flex;gap:8px;width:100%}
.namerow input{flex:1;min-width:0;background:var(--deep);border:2px solid var(--line);border-radius:12px;color:var(--ink);font:700 17px var(--font);padding:8px 12px;user-select:text;-webkit-user-select:text}
.note{font-size:13px;color:var(--muted);font-weight:600;max-width:42ch}
.cardimg{width:100%;max-width:340px;border-radius:18px}
.countdown{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;font-size:150px;font-weight:800;color:var(--sun);text-shadow:0 0 40px rgba(255,200,61,.6);pointer-events:none}
.countdown span{animation:cd 1s ease-out forwards}
@keyframes cd{from{transform:scale(1.6);opacity:0}30%{opacity:1}to{transform:scale(.8);opacity:0}}
.toast{position:fixed;left:50%;top:90px;transform:translateX(-50%);z-index:40;background:var(--bad);color:#fff;font-weight:800;padding:8px 16px;border-radius:999px;max-width:92%;text-align:center;animation:up .3s}
#confetti{position:fixed;inset:0;z-index:25;pointer-events:none}
.nogl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-weight:700}
pre.dbg{background:#05081F;border-radius:12px;padding:10px;font-size:11px;max-height:50vh;overflow:auto;white-space:pre-wrap;word-break:break-all;user-select:text;-webkit-user-select:text;font-family:ui-monospace,monospace;text-align:left}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>

<canvas id="gl"></canvas>
<div class="hud">
  <span class="chip" id="timer" role="button" title="Launch window">⏱ 15:00</span>
  <span class="chip" id="score">★ 0</span>
  <span class="chip streak hidden" id="streak"></span>
  <span class="sp"></span>
  <span class="chip"><i class="coin"></i><span id="coins">0</span></span>
  <button class="iconbtn" id="lang" aria-label="Change language">हिं</button>
  <button class="iconbtn" id="snd" aria-label="Sound on or off">♪</button>
</div>
<div class="bubble hidden" id="bubble"></div>
<div class="jobbar hidden" id="jobbar"></div>
<canvas id="confetti" hidden></canvas>

  ensure(){if(!S.sound)return null;try{if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume();}catch(e){return null;}return this.ctx;},
  tone(f,d=.15,type='sine',v=.18,when=0){const c=this.ensure();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;const t0=c.currentTime+when;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g).connect(c.destination);o.start(t0);o.stop(t0+d+.02);},

};

const QT={};
QT.monitor = ctx=>{
  const q=ctx.q;let alive=true,running=false,timers=[],stats;
  const rule=h('div',{class:'rule'},esc(t(q.phases[0].label)));
  const tb=h('div',{class:'timebar'},'<i></i>');
  const holes=h('div',{class:'holes'});const holeEls=[];for(let i=0;i<q.holes;i++){const e=h('div',{class:'hole'});holes.append(e);holeEls.push(e);}
  const sc=h('div',{class:'score3'});
  const btn=h('button',{class:'big'},t(UI.go)+' ▶');
  ctx.el.append(rule,tb,holes,sc,h('div',{class:'row'}));ctx.el.lastChild.append(btn);
  const later=(fn,ms)=>{const id=setTimeout(()=>{if(alive)fn();},ms);timers.push(id);};
  const drawScore=()=>{sc.innerHTML=`<span>${esc(t(UI.caught))}: <b style="color:var(--good)">${stats.hits}</b></span><span>${esc(t(UI.wrongTaps))}: <b style="color:var(--bad)">${stats.wrong}</b></span>`;};
  btn.onclick=()=>{
    if(running)return;running=true;btn.hidden=true;
    stats={hits:0,wrong:0,targets:0,missed:0,rt:[],phase:q.phases.map(p=>({limit:p.limit,targets:0,hits:0,wrong:0,trap_taps:0}))};drawScore();
    ctx.log('monitor_start',{});
    const total=q.phases.reduce((a,p)=>a+p.sec,0)*1000;let ph=0;const t0=performance.now();
    rule.textContent=t(q.phases[0].label);
    const tick=()=>{if(!alive||!running)return;const e=performance.now()-t0;tb.firstChild.style.width=Math.max(0,100-e/total*100)+'%';
      let acc=0,np=0;for(let i=0;i<q.phases.length;i++){acc+=q.phases[i].sec*1000;np=i;if(e<acc)break;}
      if(np!==ph){ph=np;rule.textContent=t(q.phases[ph].label);rule.classList.remove('flash');void rule.offsetWidth;rule.classList.add('flash');ctx.flash(t(UI.switchRule));SFX.tone(330,.2,'square',.12);SFX.tone(440,.2,'square',.12,.15);
        holeEls.forEach(x=>{const g=x.firstChild;if(g&&!g.dataset.done){g.dataset.done=1;g.remove();}});}
      if(e>=total){end();return;}requestAnimationFrame(tick);};
    requestAnimationFrame(tick);
    const spawn=()=>{if(!alive||!running)return;if(performance.now()-t0>total-400)return;
      const free=holeEls.filter(x=>!x.firstChild);if(free.length){const hole=free[Math.floor(Math.random()*free.length)];
        const lim=q.phases[ph].limit;const prev=ph>0?q.phases[ph-1].limit:null;let v,danger=Math.random()<q.dangerShare;
        if(danger)v=lim+1+Math.floor(Math.random()*(99-lim));
        else{const trap=prev!=null&&Math.random()<.5;v=trap?Math.min(lim,30+Math.floor(Math.random()*(lim-29))):30+Math.floor(Math.random()*(lim-29));if(prev==null&&Math.random()<.4)v=Math.max(30,lim-1-Math.floor(Math.random()*20));}
        const myPh=ph;if(danger){stats.targets++;stats.phase[myPh].targets++;}
        const born=performance.now();
        const g=h('button',{class:'gauge','aria-label':'reading '+v},`<b>${v}</b><small>°</small>`);
        g.addEventListener('pointerdown',ev=>{ev.preventDefault();if(g.dataset.done)return;g.dataset.done=1;
          if(v>q.phases[ph].limit){stats.hits++;stats.phase[ph].hits++;stats.rt.push(Math.round(performance.now()-born));g.classList.add('hit');SFX.tone(990,.06,'triangle',.12);}
          else{stats.wrong++;stats.phase[ph].wrong++;if(ph>0&&v>q.phases[0].limit-20)stats.phase[ph].trap_taps++;g.classList.add('oops');SFX.bad();}
          drawScore();later(()=>g.remove(),260);});
        hole.append(g);
        later(()=>{if(!g.dataset.done){g.dataset.done=1;if(danger)stats.missed++;g.remove();}},q.stayMs);}
      later(spawn,q.spawnMs);};
    later(spawn,400);
    function end(){running=false;timers.forEach(clearTimeout);timers=[];holeEls.forEach(x=>x.innerHTML='');
      const hr=stats.targets?stats.hits/stats.targets:0;const ok=hr>=q.pass.minHitRate&&stats.wrong<=q.pass.maxWrong;
      const r=ctx.answer(ok,{hits:stats.hits,targets:stats.targets,wrong:stats.wrong,missed:stats.missed,hit_rate:+hr.toFixed(2),mean_rt_ms:stats.rt.length?Math.round(stats.rt.reduce((a,b)=>a+b,0)/stats.rt.length):null,phases:stats.phase});
      if(!ok&&!r.final){btn.hidden=false;btn.textContent=t(UI.go)+' ▶';rule.textContent=t(q.phases[0].label);tb.firstChild.style.width='100%';}}
  };
  return {destroy(){alive=false;running=false;timers.forEach(clearTimeout);}};
};

/* --- input --- */
function bindInput(){
  const cv=$('#gl');let down=null,last=null;
  cv.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};last={x:e.clientX,y:e.clientY};});
  cv.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-last.x;last={x:e.clientX,y:e.clientY};if(S.active&&S.active.task&&S.active.task.onDrag)S.active.task.onDrag(dx);});
  cv.addEventListener('pointerup',e=>{if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(moved<10)tap(e.clientX,e.clientY);});
}
function pick(x,y,objs){const v=new THREE.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1);R.ray.setFromCamera(v,R.camera);return R.ray.intersectObjects(objs,true);}
function tap(x,y){
  if(S.phase==='play'&&S.active&&S.active.task&&S.active.task.onTap){S.active.task.onTap(x,y);return;}
  if(S.phase!=='play'||S.active)return;
  const hs=pick(x,y,R.hits);if(hs.length){goToStation(hs[0].object.userData.station);return;}
  const parts=pick(x,y,Object.values(R.parts));if(parts.length&&S.jobs.build.status!=='done'){goToStation('build');return;}
  const gh=pick(x,y,[R.ground]);if(gh.length){const p=gh[0].point;if(p.length()<40){walkTo(p.x,p.z);SFX.tap();}}
}

/* --- frame loop --- */
const CAM={pos:new THREE.Vector3(0,12,42),look:new THREE.Vector3(0,2,20)};
function frame(){
  const dt=Math.min(.05,R.clock.getDelta());const tt=R.clock.elapsedTime;
  // tweens
  for(let i=R.tweens.length-1;i>=0;i--){const tw=R.tweens[i];tw.t+=dt;const k=Math.min(1,tw.t/tw.dur);tw.fn(k);if(k>=1){R.tweens.splice(i,1);tw.done&&tw.done();}}
  // avatar walk
  const av=R.avatar,w=R.walk;
  if(w.target){const d=new THREE.Vector3().subVectors(w.target,av.position);d.y=0;const dist=d.length();
    if(dist<.15){w.target=null;const cb=w.onArrive;w.onArrive=null;cb&&cb();}
    else{const step=Math.min(dist,7*dt);d.normalize();av.position.addScaledVector(d,step);const ang=Math.atan2(d.x,d.z);let da=ang-av.rotation.y;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;av.rotation.y+=da*Math.min(1,dt*10);w.phase+=dt*11;}}
  const sw=w.target?Math.sin(w.phase)*.7:0;R.legL.rotation.x=sw;R.legR.rotation.x=-sw;R.armL.rotation.x=-sw*.8;R.armR.rotation.x=sw*.8;av.position.y=w.target?Math.abs(Math.sin(w.phase))*.08:0;
  // ambience
  if(R.anemo)R.anemo.rotation.y+=dt*4;
  if(R.towerLight)R.towerLight.visible=Math.sin(tt*4)>0;
  Object.values(R.markers).forEach((mk,i)=>{const s=1+Math.sin(tt*3+i)*.08;mk.ring.scale.set(s,s,s);});
  if(R.cloud){R.cloud.position.x=-22+Math.sin(tt*.15)*6;R.bolt.position.x=R.cloud.position.x;R.bolt.visible=Math.sin(tt*1.7)>.97;}
  if(R.flame&&R.flame.visible){const f=.9+Math.random()*.2;R.flame.children.forEach(c=>c.scale.set(f,f*1.1,f));}
  (R.testFlames||[]).forEach(f=>{if(f.visible){const q=.8+Math.random()*.4;f.scale.set(q,q,q);}});
  R.smoke.children.forEach(s=>{s.userData.life+=dt;const k=s.userData.life/2.6;s.scale.setScalar(1+k*4);s.material.opacity=Math.max(0,.8-k*.8);s.position.addScaledVector(s.userData.v,dt);});
  for(let i=R.smoke.children.length-1;i>=0;i--)if(R.smoke.children[i].userData.life>2.6)R.smoke.remove(R.smoke.children[i]);
  // camera
  let tp,tl;
  if(S.camMode==='job'&&S.camPose){tp=S.camPose.pos;tl=S.camPose.look;}
  else if(S.camMode==='launch'){const rp=new THREE.Vector3();R.rocket.getWorldPosition(rp);tp=new THREE.Vector3(rp.x+14,Math.max(8,rp.y*.8+6),rp.z+22);tl=new THREE.Vector3(rp.x,rp.y+6,rp.z);}
  else{const p=av.position;const portrait=innerWidth<innerHeight;tp=new THREE.Vector3(p.x,p.y+(portrait?11:9),p.z+(portrait?15:13));tl=new THREE.Vector3(p.x,p.y+1.2,p.z-3);}
  const k=1-Math.exp(-dt*(S.camMode==='launch'?6:3));CAM.pos.lerp(tp,k);CAM.look.lerp(tl,k);R.camera.position.copy(CAM.pos);R.camera.lookAt(CAM.look);
  R.renderer.render(R.scene,R.camera);
}

function jobFocus(j){const s=j.station;switch(j.task){case 'assemble':return new THREE.Vector3(PAD.x,4,PAD.z);case 'sequence':return new THREE.Vector3(PAD.x,4,PAD.z);default:return new THREE.Vector3(s.x,2,s.z-5);}}

/* ---------- job panel ---------- */
let panelEl=null;
function closePanel(){if(panelEl){panelEl.remove();panelEl=null;}}
function startJob(j){
  const st=S.jobs[j.id];const sc=S.mission.scoring;closePanel();
  panelEl=h('div',{class:'panel'+(j.task==='planner'||j.task==='monitor'?' tall':'')});panelEl.style.setProperty('--c',SP[j.superpower].c);
  const head=h('div',{class:'ph'});const tt=h('div',{class:'pt'});
  const setTitle=()=>{tt.innerHTML=`<small>${esc(t(SP[j.superpower]))} · ${j.competency} ${COMP[j.competency]||''}</small><b>${esc(t(j.label))}</b>`;};setTitle();
  head.append(h('div',{class:'badge'},ICON[j.superpower]),tt,h('button',{class:'x','aria-label':t(UI.close),onclick:()=>leaveJob(true)},'×'));
  const body=h('div',{class:'pb'});const prompt=h('div',{class:'prompt'},esc(t(j.prompt)));
  const meta=h('div',{class:'meta'});const mtxt=h('span');const notes=h('button',{class:'notes'});meta.append(mtxt,notes);
  const area=h('div',{style:{display:'flex',flexDirection:'column',gap:'10px'}});const fb=h('div',{class:'fb info','aria-live':'polite'});
  body.append(prompt,meta,area,fb);panelEl.append(head,body);document.body.append(panelEl);
  const mistakeTask=['assemble','inspect','sequence'].includes(j.task);
  const drawMeta=()=>{mtxt.textContent=mistakeTask?`${t(UI.mistakes)}: ${st.mistakes}`:`${t(UI.tries)} ${Math.min(st.tries+1,2)}/2`;
    notes.innerHTML=st.notes?`📒 ${esc(t(UI.notes))} ✓`:`📒 ${esc(t(UI.notes))} <i class="coin"></i>-${sc.coins.notesCost}`;notes.disabled=!st.notes&&S.coins<sc.coins.notesCost;};
  drawMeta();
  notes.onclick=()=>{if(!st.notes){if(S.coins<sc.coins.notesCost)return;S.coins-=sc.coins.notesCost;st.notes=true;SFX.coin();log('notes',j.id,{coins_left:S.coins});renderHUD();drawMeta();}showLearn(j,0,true);};
  st.startedAt=performance.now();log('job_start',j.id);
  let finished=false;
  const api={job:j,el:area,
    say(msg,kind='info'){fb.className='fb '+kind;fb.textContent=msg;},
    log(ev,p){log(ev,j.id,p);},
    flash(msg){api.say(msg,'info');},
    mistake(p={}){if(finished)return;st.mistakes++;SFX.bad();log('mistake',j.id,p);drawMeta();},
    complete(p={}){if(finished)return;finished=true;const lvl=st.mistakes===0?'first':st.mistakes===1?'second':'helped';finishJob(j,lvl,p);},
    answer(correct,p={}){ // attempt-based tasks, used by thrust/planner/monitor
      if(finished)return{final:true};st.tries++;log('attempt',j.id,{n:st.tries,correct,...p});
      if(correct){finished=true;finishJob(j,st.tries===1?'first':'second',p);return{final:true};}
      if(st.tries>=2){finished=true;SFX.bad();setTimeout(()=>finishJob(j,'failed',p),1200);return{final:true};}
      SFX.bad();drawMeta();api.say(t(UI.tryAgain),'bad');return{final:false};}
  };

}
function leaveJob(fromPanel){
  const a=S.active;if(!a)return;const st=S.jobs[a.job.id];
  if(a.task&&a.task.destroy)a.task.destroy();
  if(st.startedAt!=null){st.timeMs+=performance.now()-st.startedAt;st.startedAt=null;}
  if(st.status==='open')st.status='new';
  log('job_leave',a.job.id,{time_ms:Math.round(st.timeMs)});
  closePanel();closeOv();S.active=null;S.camMode='follow';$('#jobbar').classList.remove('hidden');refreshAll();
}
function finishJob(j,level,p){
  const st=S.jobs[j.id];const sc=S.mission.scoring,js=sc.job,sk=sc.skillCredit;
  if(st.startedAt!=null){st.timeMs+=performance.now()-st.startedAt;st.startedAt=null;}
  st.level=level;st.status='done';
  let base=level==='first'?js.first:level==='second'?js.second:level==='helped'?js.helped:0;if(st.notes)base*=js.notesFactor;
  if(level==='first'&&!st.notes){S.streak++;}else S.streak=0;S.bestStreak=Math.max(S.bestStreak,S.streak);
  const mult=(level==='first'&&!st.notes)?js.streak[Math.min(S.streak,js.streak.length)-1]:1;

  log('share',null,{kind:'card'});try{await document.fonts.ready;}catch(e){}
  const W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#060A26');gr.addColorStop(.6,'#1D1A5C');gr.addColorStop(1,'#4B2C7A');g.fillStyle=gr;g.fillRect(0,0,W,H);
  try{const shot=R.renderer.domElement.toDataURL('image/jpeg',.8);}catch(e){}
  const r=rnd(5);for(let i=0;i<140;i++){g.fillStyle=`rgba(255,255,255,${.3+r()*.7})`;g.beginPath();g.arc(r()*W,r()*H,r()*3+1,0,6.3);g.fill();}
  const F="'Baloo 2','Nirmala UI','Noto Sans Devanagari',sans-serif";g.textAlign='center';
  g.fillStyle='#FFC83D';g.font=`700 40px ${F}`;g.fillText(`FSL · ${t(S.mission.title)}`,W/2,110);
  g.save();g.translate(W/2,400);g.fillStyle='#FF8A3D';g.beginPath();g.ellipse(0,230,50,110,0,0,6.3);g.fill();g.fillStyle='#FFF0A8';g.beginPath();g.ellipse(0,200,24,60,0,0,6.3);g.fill();g.fillStyle='#FF5D73';g.beginPath();g.moveTo(0,-200);g.bezierCurveTo(-40,-140,-60,-90,-60,-50);g.lineTo(60,-50);g.bezierCurveTo(60,-90,40,-140,0,-200);g.fill();g.fillStyle='#EEF1FF';g.fillRect(-60,-52,120,240);g.fillStyle='#4EA8FF';g.beginPath();g.arc(0,20,30,0,6.3);g.fill();g.fillStyle='#FF5D73';g.beginPath();g.moveTo(-60,110);g.lineTo(-120,200);g.lineTo(-60,190);g.fill();g.beginPath();g.moveTo(60,110);g.lineTo(120,200);g.lineTo(60,190);g.fill();g.restore();
  g.fillStyle='#F5F6FF';g.font=`700 44px ${F}`;g.fillText(t(UI.cardScored),W/2,780);g.fillStyle='#FFC83D';g.font=`800 170px ${F}`;g.fillText(fmt(S.points),W/2,940);
  g.fillStyle='#B39BFF';g.font=`800 60px ${F}`;g.fillText(t(rankFor(S.points).r),W/2,1020);
  g.fillStyle='#AEB5E8';g.font=`700 38px ${F}`;g.fillText(`${S.run.first_try}/6 ${t(UI.firstTry)}  ·  ★ ${S.run.stars}/18`,W/2,1085);
  const js=S.mission.jobs;const bw=120,gap=26,x0=(W-(js.length*bw+(js.length-1)*gap))/2;js.forEach((j,i)=>{const x=x0+i*(bw+gap),y=1120;g.fillStyle=SP[j.superpower].hex;rr(g,x,y,bw,90,24);g.fill();g.fillStyle='#0A0E2E';g.font=`800 36px ${F}`;g.fillText('★'.repeat(S.jobs[j.id].stars),x+bw/2,y+60);});
  g.fillStyle='#F5F6FF';g.font=`800 56px ${F}`;g.fillText(t(UI.cardBeat),W/2,1300);
  const url=cv.toDataURL('image/png');
  try{const blob=await (await fetch(url)).blob();const file=new File([blob],'fsl-rocket-score.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:`${t(UI.cardBeat)} ${challengeUrl()}`});return;}}catch(e){}
  const c=openOv();const b=h('div',{class:'intro'});b.append(h('img',{src:url,class:'cardimg',alt:'Score card'}),h('div',{class:'note'},esc(t(UI.saveCard))),h('button',{class:'big alt',onclick:()=>showResults()},t(UI.back)));c.append(b);
}

/* ---------- intro / restart ---------- */
function showIntro(){
  S.phase='intro';const m=S.mission;const c=openOv();const body=h('div',{class:'intro'});
  const beat=S.beat!=null?`<div class="beat">${esc(t(UI.beatBanner,{n:fmt(S.beat)}))}</div>`:'';
  body.innerHTML=`<div class="eyebrow">${esc(t(UI.eyebrow))} ${m.band}</div><h1>${esc(t(m.title))}</h1>${beat}<p>${esc(t(m.story))}</p>
   <div class="howto"><div><b>${Math.round(m.windowSec/60)}</b>${esc(t(UI.window))}</div><div><b>${m.jobs.length}</b>${esc(t(UI.jobs))}</div><div><b>📖→🔧</b>${esc(t(UI.learnDo))}</div></div>
   <div class="note">${esc(t(UI.pickSuit))}</div>`;
  const suits=h('div',{class:'suits'});SUITS.forEach((col,i)=>{const b=h('button',{class:i===S.suit?'on':'',style:{'--c':'#'+col.toString(16).padStart(6,'0')},'aria-label':'suit '+(i+1)});b.onclick=()=>{S.suit=i;store.set('fsl.suit',i);R.suitMat.color.setHex(col);suits.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');SFX.tap();};suits.append(b);});
  body.append(suits,h('button',{class:'big',onclick:()=>enter()},t(UI.enter)+' 🚶'),h('button',{class:'iconbtn',onclick:()=>{S.lang=S.lang==='en'?'hi':'en';store.set('fsl.lang',S.lang);refreshAll();showIntro();}},S.lang==='en'?'हिंदी में खेलो':'Play in English'));
  c.append(body);
}
function enter(){SFX.ensure();closeOv();newRun();S.phase='play';S.run.lang=S.lang;S.run.started_at=new Date().toISOString();log('run_start',null,{beat_target:S.beat,suit:S.suit});startClock();
  R.avatar.position.set(0,0,30);S.camMode='follow';walkTo(0,18);$('#jobbar').classList.remove('hidden');refreshAll();}
function restart(){closeOv();closePanel();clearInterval(clockId);resetParts();R.arm.rotation.y=0;R.win.material.emissive.setHex(0);R.parts.fuel.children[0].material.emissive.setHex(0);R.clamps.forEach(c=>c.rotation.z=0);R.capsule.rotation.y=0;R.tiles.forEach(m=>m.material.emissive&&m.material.emissive.setHex(0));
  newRun();S.camMode='follow';R.avatar.position.set(0,0,30);refreshAll();$('#jobbar').classList.add('hidden');showIntro();}

/* ---------- debug ---------- */
let tTaps=0,tTimer=null;
function showLog(){const c=openOv();const b=h('div',{class:'intro',style:{alignItems:'stretch',textAlign:'left'}});const runs=store.get('fsl.missionRuns.v3',[]);
  b.append(h('h1',{style:{fontSize:'22px'}},esc(t(UI.log))));const pre=h('pre',{class:'dbg'});pre.textContent=JSON.stringify({current:{run:S.run,job_results:S.run?jobResults():[],events:S.events},saved_runs:runs.length},null,1);b.append(pre);
  const row=h('div',{class:'row'});const msg=h('div',{class:'note'});row.append(h('button',{class:'big alt',onclick:()=>{try{navigator.clipboard.writeText(JSON.stringify(runs,null,1)).then(()=>msg.textContent='Copied',()=>msg.textContent='Select the text above to copy');}catch(e){msg.textContent='Select the text above to copy';}}},t(UI.copyLog)),h('button',{class:'big',onclick:()=>{closeOv();if(S.phase==='intro')showIntro();}},t(UI.close)));b.append(row,msg);c.append(b);}

/* ---------- boot ---------- */
async function boot(){
  let m=null;const qs=new URLSearchParams(location.search);
  if(qs.get('mission')){try{m=await (await fetch(qs.get('mission'))).json();}catch(e){}}
  if(!m){m=JSON.parse($('#mission-data').textContent);}
  S.mission=m;S.lang=store.get('fsl.lang',qs.get('lang')||'en');if(!['en','hi'].includes(S.lang))S.lang='en';S.sound=store.get('fsl.sound',true);S.suit=store.get('fsl.suit',0)|0;if(S.suit<0||S.suit>3)S.suit=0;
  const hm=/^#beat-(\d{1,6})$/.exec(location.hash);if(hm)S.beat=+hm[1];
  newRun();
  if(typeof THREE==='undefined'||!init3D()){if(typeof THREE==='undefined')document.body.append(h('div',{class:'nogl'},esc(t(UI.noGL))));return;}
  S.camMode='follow';refreshAll();
  $('#lang').onclick=()=>{S.lang=S.lang==='en'?'hi':'en';store.set('fsl.lang',S.lang);if(S.run)S.run.lang=S.lang;refreshAll();
    if(ovEl&&S.learnView&&S.active)showLearn(S.learnView.j,S.learnView.si,S.learnView.peek);else if(S.active&&S.active.setTitle)S.active.setTitle();else if(S.phase==='intro')showIntro();else if(S.phase==='results')showResults();};
  $('#snd').onclick=()=>{S.sound=!S.sound;store.set('fsl.sound',S.sound);renderHUD();};
  $('#timer').onclick=()=>{tTaps++;clearTimeout(tTimer);tTimer=setTimeout(()=>tTaps=0,1500);if(tTaps>=5){tTaps=0;showLog();}};
  document.fonts&&document.fonts.ready.then(()=>refreshMarkerLabels());
  if(location.hash==='#debug')showLog();else showIntro();
  window.__fsl={S,R,goToStation,launch,tap};
}
boot();
