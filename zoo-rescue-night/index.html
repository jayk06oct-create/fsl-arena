<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="FSL Round 2 Junior Sim Cup (Band J): Zoo Rescue Night, an 18-minute simulation competition testing all 6 Superpowers.">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zoo Rescue Night</title>
<style>
:root{--bg:#0d1b2a;--bg2:#13263b;--card:#1b3350;--ink:#f4f7fb;--mute:#a9bcd3;--acc:#ffc94a;--ok:#3ddc84;--bad:#ff6b6b;--blue:#4aa3ff;--red:#ff5f5f;--line:#2d4a6d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari",sans-serif;overscroll-behavior:none}
body{min-height:100vh;display:flex;justify-content:center;user-select:none;-webkit-user-select:none}
#app{width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:radial-gradient(120% 60% at 50% 0%,#1d3d63 0%,var(--bg) 70%)}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(0,0,0,.25);font-size:14px}
.top .ttl{font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;background:var(--card);font-size:12px;font-weight:700;color:var(--mute)}
.chip.acc{background:var(--acc);color:#2a1d00}
.tbtn{border:0;background:var(--card);color:var(--ink);border-radius:10px;padding:6px 9px;font-weight:800;font-size:13px}
.bar{height:6px;background:#0a1522}.bar i{display:block;height:100%;background:var(--acc);width:100%;transition:width .25s linear}
.bar.low i{background:var(--bad)}
.main{flex:1;padding:14px 16px 22px;display:flex;flex-direction:column;gap:12px}
h1{font-size:26px;margin:4px 0}h2{font-size:20px;margin:2px 0}
p{margin:0;line-height:1.45;color:var(--mute)}
.card{background:var(--card);border-radius:16px;padding:14px}
.btn{border:0;border-radius:14px;padding:14px 18px;font-size:17px;font-weight:800;background:var(--acc);color:#2a1d00;width:100%;cursor:pointer}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center}.wrap{flex-wrap:wrap}.center{justify-content:center}
.prompt{font-size:16px;font-weight:700;color:var(--ink);text-align:center;line-height:1.35}
.sub{font-size:13px;color:var(--mute);text-align:center}
.tag{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--acc)}
.practice-rib{background:#2f6b3f;color:#d9ffe6;text-align:center;font-size:12px;font-weight:800;padding:4px;border-radius:8px}
.flash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:90px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:20}
.flash.on{opacity:1}
.hint{animation:pulse 1s infinite;box-shadow:0 0 0 3px var(--acc)!important}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .3s}
/* tokens */
.seq{display:flex;gap:5px;justify-content:center;flex-wrap:nowrap;padding:10px 4px;background:#0f2238;border-radius:14px}
.slot{width:46px;height:46px;border-radius:10px;border:2px dashed var(--acc);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:var(--acc)}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.opt{background:#0f2238;border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;justify-content:center;cursor:pointer}
.opt.sel{border-color:var(--acc)}
/* pens */
.pens{display:grid;gap:6px}
.pen{min-height:74px;border-radius:12px;background:#244a2b;border:2px solid #3b7a45;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;cursor:pointer;position:relative}
.pen b{position:absolute;top:2px;left:6px;font-size:12px;color:#bfe8c7}
.tray{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:58px}
.ani{font-size:36px;background:#0f2238;border:2px solid var(--line);border-radius:12px;padding:4px 8px;cursor:pointer}
.ani.sel{border-color:var(--acc);transform:scale(1.1)}
.clues{display:flex;flex-direction:column;gap:6px}
.clue{background:#0f2238;border-radius:10px;padding:8px 10px;font-size:15px;font-weight:700}
/* lamps */
.lamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px;background:#08131f;border-radius:16px}
.lamp{aspect-ratio:1;border-radius:50%;background:#1d2f45;border:3px solid #2b4566;cursor:pointer;transition:background .1s}
.lamp.on{background:#ffd75e;box-shadow:0 0 22px #ffd75e;border-color:#fff1b8}
.lamp.tap{background:#7fd3ff;box-shadow:0 0 16px #7fd3ff}
/* robo */
.grid{display:grid;gap:3px;background:#2e5b2f;padding:5px;border-radius:12px;margin:0 auto}
.cell{background:#7bb661;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:26px;position:relative}
.cell.p{background:#4a8fd8}
.cell.trail{background:#a6d48a}
.prog{display:flex;flex-wrap:wrap;gap:4px;min-height:42px;background:#0f2238;border-radius:10px;padding:6px}
.pchip{background:var(--blue);color:#fff;border-radius:8px;width:32px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}
.pchip.run{background:var(--acc);color:#2a1d00}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pad button{border:0;border-radius:12px;padding:12px 0;font-size:22px;font-weight:900;background:#25496f;color:#fff}
.pad button.go{background:var(--ok);color:#00301a}
/* fair test */
.bottles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bot{background:#0f2238;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.bot h3{margin:0;text-align:center;font-size:15px}
.tog{border:1px solid var(--line);background:#1b3350;color:var(--ink);border-radius:10px;padding:8px 4px;font-size:14px;font-weight:700}
.tog small{display:block;color:var(--mute);font-size:10px;font-weight:600}
.meter{height:120px;background:#08131f;border-radius:10px;position:relative;overflow:hidden}
.meter i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#ff8a5c,#ff4d4d);transition:height .3s}
.meter.dry i{background:linear-gradient(#7fd3ff,#2f7fd8)}
.meter span{position:absolute;top:6px;left:0;right:0;text-align:center;font-weight:900;font-size:18px;z-index:2}
/* seesaw */
.see{position:relative;height:190px;background:#0f2238;border-radius:16px;overflow:hidden}
.beam{position:absolute;left:4%;right:4%;top:110px;height:12px;background:#c58b4a;border-radius:6px;transform-origin:50% 50%;transition:transform .8s cubic-bezier(.4,1.6,.6,1)}
.fulcrum{position:absolute;left:50%;top:122px;margin-left:-22px;width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:40px solid #8a5a2b}
.peg{position:absolute;top:-30px;width:11%;margin-left:-5.5%;height:30px;display:flex;align-items:flex-end;justify-content:center;cursor:pointer}
.peg u{display:block;width:8px;height:12px;background:#e8c48f;border-radius:2px}
.peg.pick u{background:var(--acc);height:16px}
.load{pointer-events:none;position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center}
.blk{width:30px;height:16px;background:#ffb347;border:1px solid #7a4a10;border-radius:3px;font-size:10px;font-weight:900;color:#3a2000;text-align:center;line-height:14px}
.blk.me{background:#7fd3ff;border-color:#155a8a}
.pnum{position:absolute;top:16px;font-size:12px;color:#ffe9a8;font-weight:900;width:20px;margin-left:-10px;text-align:center}
/* rush */
.rule{display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;font-weight:900;padding:10px;border-radius:14px}
.rule.day{background:#ffe08a;color:#3b2a00}.rule.night{background:#28366b;color:#dfe6ff}
.foodcard{width:130px;height:130px;margin:6px auto;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:70px;background:#fff;border:10px solid #999;animation:pop .15s}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bin{border:0;border-radius:18px;padding:12px 4px;font-size:46px;color:#fff;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:2px}
.bin small{font-size:12px}
.bin.blue{background:#2f7fd8}.bin.red{background:#d94141}
/* watch */
.cams{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cam{aspect-ratio:1;background:#06261a;border:2px solid #1c5a3a;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:38px;position:relative;cursor:pointer;overflow:hidden}
.cam:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 2px,transparent 2px 4px);pointer-events:none}
.cam b{position:absolute;top:3px;left:6px;font-size:10px;color:#7fffb0}
.cam.alarm{border-color:var(--bad);background:#3a0d0d}
.cam.hit{border-color:var(--ok)}
/* spot */
.spot{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#0f2238;padding:6px;border-radius:12px}
.spot div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#162d47;position:relative}
.spot div.found{outline:3px solid var(--ok)}
.spot div.miss{outline:3px solid var(--bad)}
.spot div.wrong{animation:shake .3s}
/* map */
.map{width:100%;border-radius:18px;background:#163d2a}
.stars{font-size:26px;letter-spacing:2px;color:var(--acc)}
.sp{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;font-size:13px;font-weight:700}
.sp .b{height:10px;background:#0a1522;border-radius:5px;overflow:hidden}.sp .b i{display:block;height:100%;background:var(--acc)}
input[type=text]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0f2238;color:var(--ink);font-size:16px}
label.ck{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--mute)}
.wm{position:fixed;bottom:4px;right:8px;font-size:10px;color:rgba(255,255,255,.25);pointer-events:none;z-index:50}
.hand{font-size:44px;text-align:center}
.small{font-size:12px;color:var(--mute)}
table.res{width:100%;border-collapse:collapse;font-size:13px}table.res td{padding:5px 4px;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<div class="flash" id="flash"></div>
<script>
'use strict';
/* =========================================================
   FSL Round 2 · Band J · "Zoo Rescue Night"
   15-20 min simulation competition testing all 6 Superpowers
   (2 competencies each = 12 of 18). Local scoring only.
   ========================================================= */
const Q = new URLSearchParams(location.search);
const SPEED = Q.get('dev') === 'fast' ? 0.03 : 1; // dev/testing only
const DEVHINT = Q.get('dev') === 'hint'; // dev/testing only: shows hints in scored jobs
const L = (en, hi) => ({ en, hi });
let LANG = Q.get('lang') === 'hi' ? 'hi' : (store('fsl.lang') || 'en');
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
const T = o => o == null ? '' : (typeof o === 'string' ? o : (o[LANG] || o.en));
const fmt = (s, m) => s.replace(/\{(\w+)\}/g, (_, k) => m[k] != null ? m[k] : '');
const $ = s => document.querySelector(s);
const app = $('#app');
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const now = () => performance.now();

/* ---------- seeded random ---------- */
function hash(str) { let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return (h >>> 0); }
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function R(rng) {
  return {
    f: rng, int: (a, b) => a + Math.floor(rng() * (b - a + 1)),
    pick: arr => arr[Math.floor(rng() * arr.length)],
    shuffle: arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }
  };
}

/* ---------- sound + voice ---------- */
let AC = null, SOUND = store('fsl.sound') !== '0';
function beep(f = 660, d = .08, type = 'sine', vol = .12) {
  if (!SOUND) return; try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; g.gain.value = vol;
    o.connect(g); g.connect(AC.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d); o.stop(AC.currentTime + d + .02);
  } catch (e) { }
}
const sfx = { ok: () => { beep(660, .08); setTimeout(() => beep(990, .12), 80); }, bad: () => beep(180, .2, 'square', .06), tap: () => beep(520, .04), win: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .15), i * 110)) };
function say(o) {
  if (!SOUND || !window.speechSynthesis) return; try {
    speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(T(o).replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu, ''));
    u.lang = LANG === 'hi' ? 'hi-IN' : 'en-IN'; u.rate = 1; speechSynthesis.speak(u);
  } catch (e) { }
}
function flash(ch, ms = 450) { const f = $('#flash'); f.textContent = ch; f.classList.add('on'); setTimeout(() => f.classList.remove('on'), ms); }

/* ---------- text ---------- */
const TX = {
  title: L('Zoo Rescue Night', 'ज़ू रेस्क्यू नाइट'),
  tagline: L('FSL Round 2 · Junior Sim Cup', 'FSL राउंड 2 · जूनियर सिम कप'),
  story: L('A big storm hit Sundarvan Zoo. The power is out, gates are jammed and the animals are scared. You are the Junior Ranger on duty tonight. Clear 6 zones and switch the zoo lights back on!',
    'सुंदरवन ज़ू में बड़ा तूफ़ान आया। बिजली चली गई, गेट जाम हो गए और जानवर डरे हुए हैं। आज रात ड्यूटी पर तुम जूनियर रेंजर हो। 6 ज़ोन पार करो और ज़ू की लाइटें वापस जलाओ!'),
  how1: L('6 zones · 1 Superpower each · about 18 minutes', '6 ज़ोन · हर ज़ोन में 1 सुपरपावर · लगभग 18 मिनट'),
  how2: L('Every job has its own clock. When it runs out, we move on, so keep going!', 'हर काम की अपनी घड़ी है। समय खत्म होते ही अगला काम, तो रुकना नहीं!'),
  how3: L('Before each job you get one free practice try. It does not count.', 'हर काम से पहले एक फ्री प्रैक्टिस मिलेगी। वह गिनी नहीं जाएगी।'),
  how4: L('Your Star level comes from how well you think, not how fast you tap.', 'तुम्हारा स्टार लेवल इस पर है कि तुम कितना अच्छा सोचते हो, कितनी तेज़ टैप करते हो उस पर नहीं।'),
  start: L('Start', 'शुरू करो'), next: L('Next', 'आगे'), ready: L("I'm ready ▶", 'मैं तैयार हूँ ▶'),
  practiceMode: L('Practice play', 'प्रैक्टिस खेल'), rankedMode: L('Ranked (competition slot)', 'रैंक्ड (प्रतियोगिता स्लॉट)'),
  practiceDesc: L('New puzzles every time. See right and wrong after each answer.', 'हर बार नई पहेलियाँ। हर जवाब के बाद सही/गलत दिखेगा।'),
  rankedDesc: L('One try per FSL ID per slot. Your puzzles are made just for you. Answers show after the slot closes.', 'हर स्लॉट में हर FSL ID की एक ही कोशिश। पहेलियाँ सिर्फ़ तुम्हारे लिए बनी हैं। जवाब स्लॉट बंद होने के बाद दिखेंगे।'),
  fslid: L('Your FSL ID', 'तुम्हारा FSL ID'), name: L('Your first name (optional)', 'तुम्हारा पहला नाम (ज़रूरी नहीं)'),
  pledge: L('I will play alone, on my own, without help or searching. I am a fair Ranger.', 'मैं अकेले, खुद से, बिना किसी मदद या सर्च के खेलूँगा/खेलूँगी। मैं एक ईमानदार रेंजर हूँ।'),
  already: L('This FSL ID has already played this slot. See you in the next slot!', 'यह FSL ID इस स्लॉट में खेल चुका है। अगले स्लॉट में मिलते हैं!'),
  practiceTry: L('PRACTICE · not scored', 'प्रैक्टिस · गिनी नहीं जाएगी'),
  nowReal: L('Great! Now the real job starts. The clock is on.', 'बढ़िया! अब असली काम शुरू। घड़ी चालू है।'),
  timeUp: L("Time's up! Moving on.", 'समय खत्म! आगे चलते हैं।'),
  saved: L('Saved', 'सेव हुआ'), check: L('Check', 'जाँचो'), tryAgain: L('Not yet. Try again!', 'अभी नहीं। फिर कोशिश करो!'),
  zoneDone: L('Zone cleared!', 'ज़ोन पार!'), rescued: L('rescued', 'बचाया'),
  results: L('Your Star Card', 'तुम्हारा स्टार कार्ड'), fsi: L('Future Skills Index (this round)', 'फ्यूचर स्किल्स इंडेक्स (इस राउंड का)'),
  league: L('League Score', 'लीग स्कोर'), playAgain: L('Play again (new puzzles)', 'फिर खेलो (नई पहेलियाँ)'),
  estNote: L('One-round estimate. Your full FSI grows from many rounds.', 'एक राउंड का अनुमान। पूरा FSI कई राउंड से बनता है।'),
  lightsOn: L('The zoo lights are back on! Every animal is safe.', 'ज़ू की लाइटें वापस जल गईं! सारे जानवर सुरक्षित हैं।'),
  fair: L('Fair-play check', 'फेयर-प्ले जाँच')
};
const SPN = {
  SP1: L('Smart Logic', 'स्मार्ट लॉजिक'), SP2: L('Super Memrix', 'सुपर मेमरिक्स'), SP3: L('Master Algo', 'मास्टर एल्गो'),
  SP4: L('Sci Idea', 'साइ आइडिया'), SP5: L('Speed Flex', 'स्पीड फ्लेक्स'), SP6: L('Pro Focus', 'प्रो फोकस')
};
const COMP = {
  'C1.1': L('Pattern Recognition', 'पैटर्न पहचान'), 'C1.2': L('Logical Deduction', 'तार्किक निष्कर्ष'),
  'C2.1': L('Mental Rotation', 'मानसिक घुमाव'), 'C2.2': L('Working Memory', 'वर्किंग मेमोरी'),
  'C3.1': L('Algorithmic Thinking', 'एल्गोरिदमिक सोच'), 'C3.3': L('Optimisation & Trade-offs', 'ऑप्टिमाइज़ेशन'),
  'C4.2': L('Experimental Design', 'प्रयोग की रचना'), 'C4.3': L('Cause, Effect & Systems', 'कारण, प्रभाव और सिस्टम'),
  'C5.1': L('Processing Speed', 'प्रोसेसिंग स्पीड'), 'C5.2': L('Cognitive Flexibility', 'सोच का लचीलापन'),
  'C6.1': L('Sustained Attention', 'लगातार ध्यान'), 'C6.2': L('Detail & Error Detection', 'बारीकी और गलती पकड़ना')
};
const STARS = [
  { min: 0, n: L('Rookie', 'रूकी'), s: 1 }, { min: 181, n: L('Rising', 'राइज़िंग'), s: 2 }, { min: 361, n: L('Creator', 'क्रिएटर'), s: 3 },
  { min: 541, n: L('Pro', 'प्रो'), s: 4 }, { min: 721, n: L('Elite', 'एलीट'), s: 5 }];

/* =========================================================
   TASKS. Each: {sp, comps, sec, title, how, play(el, ctx)}
   play returns {timeout()} -> result. ctx.done(result) ends early.
   result = {comp:{code:credit 0..1}, detail}
   ========================================================= */
const COLORS = { red: '#ff5f5f', blue: '#4aa3ff', green: '#3ddc84', yellow: '#ffd23f', purple: '#b07cff', orange: '#ff9f43' };
function tokSVG(t, z = 40) {
  const c = COLORS[t.c] || '#ccc'; let s = '';
  if (t.s === 'circle') s = `<circle cx="24" cy="24" r="19" fill="${c}"/>`;
  else if (t.s === 'square') s = `<rect x="6" y="6" width="36" height="36" rx="5" fill="${c}"/>`;
  else if (t.s === 'triangle') s = `<polygon points="24,4 45,42 3,42" fill="${c}"/>`;
  else if (t.s === 'diamond') s = `<polygon points="24,3 45,24 24,45 3,24" fill="${c}"/>`;
  else s = `<polygon points="24,3 30,18 46,18 33,28 38,44 24,34 10,44 15,28 2,18 18,18" fill="${c}"/>`;
  const n = t.n != null ? `<text x="24" y="30" text-anchor="middle" font-size="${t.n > 99 ? 13 : 17}" font-weight="900" fill="#102030">${t.n}</text>` : '';
  return `<svg width="${z}" height="${z}" viewBox="0 0 48 48">${s}${n}</svg>`;
}
const sameTok = (a, b) => a.s === b.s && a.c === b.c && a.n === b.n;

function genPattern(r, lvl) {
  const SH = ['circle', 'square', 'triangle', 'diamond', 'star'], CO = ['red', 'blue', 'green', 'yellow', 'purple', 'orange'];
  let seq = [], ans, dis = [];
  if (lvl === 1) {
    const p = r.int(2, 3), cs = r.shuffle(CO).slice(0, p + 1), sh = r.pick(SH);
    for (let i = 0; i < 5; i++) seq.push({ s: sh, c: cs[i % p] });
    ans = { s: sh, c: cs[5 % p] };
    dis = cs.filter(c => c !== ans.c).slice(0, 2).map(c => ({ s: sh, c })); dis.push({ s: r.pick(SH.filter(x => x !== sh)), c: ans.c });
  } else if (lvl === 2) {
    const a = r.int(1, 6), d = r.int(2, 4), co = r.pick(CO);
    for (let i = 0; i < 5; i++) seq.push({ s: 'circle', c: co, n: a + d * i });
    const v = a + d * 5; ans = { s: 'circle', c: co, n: v };
    dis = [v + 1, v - 1, v + d].map(n => ({ s: 'circle', c: co, n }));
  } else if (lvl === 3) {
    const ss = r.shuffle(SH).slice(0, 3), cs = r.shuffle(CO).slice(0, 2);
    for (let i = 0; i < 6; i++) seq.push({ s: ss[i % 3], c: cs[i % 2] });
    ans = { s: ss[0], c: cs[0] };
    dis = [{ s: ss[0], c: cs[1] }, { s: ss[1], c: cs[0] }, { s: ss[2], c: cs[1] }];
  } else { // growing step: +1,+2,+3...
    const a = r.int(1, 4), co = r.pick(CO); let v = a;
    for (let i = 0; i < 5; i++) { seq.push({ s: 'square', c: co, n: v }); v += i + 1; }
    ans = { s: 'square', c: co, n: v };
    dis = [v - 1, v + 1, v + 2].map(n => ({ s: 'square', c: co, n }));
  }
  const opts = r.shuffle([ans, ...dis]);
  return { seq, ans, opts };
}

        el.querySelectorAll('.pad button').forEach(b => b.onclick = () => {

function results() {
  const sc = score(); const secs = Math.round((now() - S.started) / 1000);
  const run = { mission: 'zoo-rescue-night', band: 'J', round: 'R2', version: 1, mode: S.mode, fsl_id: S.id || null, name: S.name || null, slot: S.slot, seed: S.seed, lang: LANG, started_at: new Date(Date.now() - secs * 1000).toISOString(), duration_s: secs, fsi: sc.fsi, star: sc.star.n.en, league_score: sc.league, sp: sc.sp, competencies: sc.comp, credibility: sc.cred, flags: S.flags };
  try { const k = 'fsl.missionRuns.zoo'; const arr = JSON.parse(store(k) || '[]'); arr.push({ mission_run: run, task_results: S.results, events: S.events.slice(-600) }); store(k, JSON.stringify(arr.slice(-20))); } catch (e) { }
  if (S.mode === 'ranked') store(`fsl.zoo.ranked.${S.slot}.${S.id}`, '1');
  const draw = () => {
    const m = screen({ title: T(TX.results) }); sfx.win();
    m.innerHTML = `${mapSVG(6)}
    <div class="card" style="text-align:center"><div class="stars">${'★'.repeat(sc.star.s)}<span style="opacity:.25">${'★'.repeat(6 - sc.star.s)}</span></div>
      <h1>${T(sc.star.n)}</h1><div class="tag">${T(TX.fsi)}</div><div style="font-size:40px;font-weight:900">${sc.fsi}<span class="small"> / 1000</span></div>
      <p class="small" style="margin-top:4px">${T(TX.estNote)}</p></div>
    <div class="card">${ZONES.map(z => `<div class="sp"><span>${z.icon} ${T(SPN[z.sp])}</span><span class="b"><i style="width:${sc.sp[z.sp]}%"></i></span><span>${sc.sp[z.sp]}</span></div>`).join('<div style="height:8px"></div>')}</div>
    <div class="card"><div class="row" style="justify-content:space-between"><b>🏆 ${T(TX.league)}</b><b style="font-size:22px;color:var(--acc)">${sc.league}</b></div>
      <p class="small">${fmt(T(L('Time played {t} · League Score adds speed bonus for ranking; Stars use thinking only.', 'खेलने का समय {t} · लीग स्कोर में रैंकिंग के लिए स्पीड बोनस है; स्टार सिर्फ़ सोच से बनते हैं।')), { t: mm(secs) })}</p></div>
    <div class="card"><table class="res">${Object.keys(COMP).map(c => `<tr><td>${c}</td><td>${T(COMP[c])}</td><td style="text-align:right;font-weight:800">${Math.round((sc.comp[c] || 0) * 100)}</td></tr>`).join('')}</table></div>
    ${S.mode === 'ranked' ? `<div class="card"><b>${T(TX.fair)}</b>: <span class="chip" style="background:${sc.credBand === 'green' ? '#2f6b3f' : sc.credBand === 'amber' ? '#7a5b12' : '#7a1f1f'};color:#fff">${sc.cred}</span><p class="small">${T(L('Tab switches, full-screen exits and too-fast taps are noted. Low scores get a friendly replay, never a ban.', 'टैब बदलना, फ़ुल-स्क्रीन छोड़ना और बहुत तेज़ टैप नोट होते हैं। कम स्कोर पर दोस्ताना दोबारा खेल होता है, कभी बैन नहीं।'))}</p></div>` : ''}
    <button class="btn" id="again">${T(TX.playAgain)}</button>`;
    $('#again').onclick = () => { location.href = location.pathname + (LANG === 'hi' ? '?lang=hi' : ''); };
  };
  S.rerender = draw; draw();
}

/* ---------- intro wizard ---------- */
function intro() {
  let step = 0, mode = Q.get('mode') === 'ranked' ? 'ranked' : 'play';
  const draw = () => {
    const m = screen({});
    if (step === 0) {
      m.innerHTML = `<div style="text-align:center;font-size:64px;margin-top:10px">🦁🌩️🔦</div><div class="tag" style="text-align:center">${T(TX.tagline)}</div><h1 style="text-align:center">${T(TX.title)}</h1>
        <div class="card"><p style="color:var(--ink);font-size:16px">${T(TX.story)}</p></div><button class="btn" id="n">${T(TX.next)}</button>
        <p class="small" style="text-align:center">${T(L('Band J · ages 9 to 13 · हिंदी / English', 'बैंड J · उम्र 9 से 13 · हिंदी / English'))}</p>`;
      $('#n').onclick = () => { step = 1; draw(); }; say(TX.story);
    } else if (step === 1) {
      m.innerHTML = `${mapSVG(0)}<div class="card" style="display:flex;flex-direction:column;gap:8px">
        <p style="color:var(--ink)">🗺️ ${T(TX.how1)}</p><p>⏱️ ${T(TX.how2)}</p><p>🧪 ${T(TX.how3)}</p><p>⭐ ${T(TX.how4)}</p></div>
        <div class="row wrap center">${ZONES.map(z => `<span class="chip">${z.icon} ${T(SPN[z.sp])}</span>`).join('')}</div>
        <button class="btn" id="n">${T(TX.next)}</button>`;
      $('#n').onclick = () => { step = 2; draw(); };
    } else {
      m.innerHTML = `<h2>${T(L('How do you want to play?', 'कैसे खेलना है?'))}</h2>
        <div class="card" id="mp" style="cursor:pointer;border:2px solid ${mode === 'play' ? 'var(--acc)' : 'transparent'}"><b>🎮 ${T(TX.practiceMode)}</b><p>${T(TX.practiceDesc)}</p></div>
        <div class="card" id="mr" style="cursor:pointer;border:2px solid ${mode === 'ranked' ? 'var(--acc)' : 'transparent'}"><b>🏆 ${T(TX.rankedMode)}</b><p>${T(TX.rankedDesc)}</p></div>
        ${mode === 'ranked' ? `<input type="text" id="fid" placeholder="${T(TX.fslid)}" value="${S.id}" autocomplete="off">
          <label class="ck"><input type="checkbox" id="pl"> ${T(TX.pledge)}</label>` : `<input type="text" id="nm" placeholder="${T(TX.name)}" value="${S.name}" maxlength="20" autocomplete="off">`}
        <div id="err" class="sub" style="color:var(--bad)"></div>
        <button class="btn" id="go">🔦 ${T(TX.start)}</button>`;
      $('#mp').onclick = () => { mode = 'play'; draw(); }; $('#mr').onclick = () => { mode = 'ranked'; draw(); };
      const fid = $('#fid'); if (fid) fid.oninput = () => S.id = fid.value.trim().toUpperCase();
      const nm = $('#nm'); if (nm) nm.oninput = () => S.name = nm.value.trim();
      $('#go').onclick = () => {
        S.mode = mode;
        if (mode === 'ranked') {
          if (!/^[A-Z0-9-]{4,20}$/.test(S.id)) { $('#err').textContent = T(L('Enter your FSL ID (4 to 20 letters/numbers).', 'अपना FSL ID डालो (4 से 20 अक्षर/अंक)।')); return; }
          if (!$('#pl').checked) { $('#err').textContent = T(L('Please tick the fair-play promise.', 'कृपया फेयर-प्ले वादे पर टिक करो।')); return; }
          S.slot = Q.get('slot') || new Date().toISOString().slice(0, 10);
          if (store(`fsl.zoo.ranked.${S.slot}.${S.id}`)) { $('#err').textContent = T(TX.already); return; }
          S.seed = hash(S.id + '|' + S.slot + '|zoo');
          try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => { }); } catch (e) { }
          const wm = document.createElement('div'); wm.className = 'wm'; wm.textContent = S.id + ' · ' + S.slot; document.body.appendChild(wm);
        } else { S.slot = 'practice'; S.seed = (Math.random() * 1e9) | 0; }
        game();
      };
    }
  };
  S.rerender = draw; draw();
}
async function game() {
  S.started = now(); logEv('start', { mode: S.mode, seed: S.seed });
  const only = Q.get('zone'); const zs = only != null ? [+only] : [0, 1, 2, 3, 4, 5];
  for (const i of zs) {
    S.zone = i; await zoneIntro(i);
    for (const t of ZONES[i].tasks) await practiceThenReal(t);
    await zoneDone(i);
  }
  results();
}
// dev hook: ?test=<taskId>[&real=1] jumps to one task
if (Q.get('test') && TASKS[Q.get('test')]) { S.seed = +(Q.get('seed') || 7); S.started = now(); runTask(Q.get('test'), !Q.get('real')).then(r => { window.__lastResult = r; app.insertAdjacentHTML('beforeend', `<pre id="out" style="white-space:pre-wrap;font-size:11px">${JSON.stringify(r)}</pre>`); }); }
else intro();
window.__zoo = { S, TASKS, score, genDeduce, genRobo, genSee, genRot, R, mulberry };
</script>
</body>
</html>
