    const pl=h('label',{class:'pledge'});const cb=h('input',{type:'checkbox',id:'pledge'});pl.append(cb,h('span',{},esc(t(UI.pledge))));const info=h('div',{class:'note'});
    const col=h('div',{class:'fields'});col.append(idIn,nmIn);wb.append(col,pl,info,h('div',{class:'note'},esc(t(UI.zoneAssigned))));
    body.append(wb,nav(t(UI.startRanked)+' 🏆',()=>{const id=(idIn.value||'').trim().toUpperCase().replace(/[^A-Z0-9-]/g,'');const nm=(nmIn.value||'').trim().slice(0,14);
      if(!id||!cb.checked){info.textContent=t(UI.needId);SFX.bad();return;}
      const prev=store.get('fsl.ranked.desert.'+sl.key+'.'+id,null);
      if(prev){if(Date.now()>prev.end){showAnswers(prev.answers,()=>showIntro(step));}else{info.textContent=t(UI.already,{t:hhmm(prev.end)});SFX.bad();}return;}
      const st=slotState();if(st==='before'){info.textContent=t(UI.opensAt,{t:hhmm(sl.start)});SFX.bad();return;}
      if(st!=='open'){info.innerHTML='';info.append(esc(t(UI.startClosed,{m:Math.round(sl.grace/60000)})),h('br'));info.append(h('button',{class:'big alt',style:{marginTop:'8px'},onclick:()=>{S.mode='practice';showIntro(3);}},t(UI.playPractice)));return;}
      S.childId=id;S.childName=nm||id;store.set('fsl.childId',id);if(nm)store.set('fsl.name',nm);
      try{const el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen().then(()=>{S.fsOn=true;},()=>{});}catch(e){}
      S.introStep=0;enter();}));
  }
  c.append(body);
}
function resetWorld(){R.props.sheet.visible=false;R.props.stone.visible=false;R.heli.visible=false;R.avatar.userData.ride=false;R.avatar.visible=true;dust(false);applyZone();setStory('dawn',true);}
function enter(){SFX.ensure();closeOv();
  if(S.mode==='ranked'){const used=store.get('fsl.devRanked.desert',[]).filter(x=>x.slot===S.slot.key&&x.child!==S.childId);applyVersion(makeVersion(S.childId+'|'+S.base.id+'|'+S.slot.key,{zone:used.map(x=>x.zone),plan:used.map(x=>x.plan)}));setWatermark(true);}
  else{S.childId=store.get('fsl.childId',null);const pz=store.get('fsl.zone','random');applyVersion(makeVersion('practice|'+uuid(),{},pz==='random'?null:pz));}
  newRun();S.run.player_id=S.childId;S.run.player_name=S.childName||store.get('fsl.name',null);resetWorld();
  showBriefing(()=>{closeOv();S.phase='play';S.run.lang=S.lang;S.run.started_at=new Date().toISOString();log('run_start',null,{beat_target:S.beat,suit:S.suit,mode:S.mode,version:S.ver});startClock();
    R.avatar.position.set(0,0,34);S.camMode='follow';walkTo(0,30);$('#jobbar').classList.remove('hidden');refreshAll();HOST.say(t(S.mission.host.intro),5000);SFX.sting();});}
function showBriefing(go){const z=S.mission.zone;const c=openOv();const b=h('div',{class:'brief'});
  b.innerHTML=`<div class="eyebrow">${esc(t(UI.yourDrop))}${S.mode==='ranked'?' · 🏆 '+esc(t(UI.rankedTitle)):''}</div><div class="zone-ic">${zoneSvg(z)}</div><h1>${esc(t(z.name))}</h1>
   <div class="brief-rows"><div><span>📍</span>${esc(t(z.place))}</div><div><span>💡</span>${esc(t(z.fact))}</div><div><span>🎒 ${esc(t(UI.startKit))}</span>${esc(t(UI.kitLine,{w:S.ver.water.toFixed(1),b:S.ver.battery}))}</div></div>
   <div class="note">${esc(t(UI.sameRules))} ${esc(t(UI.meterNote))}</div>`;
  b.append(h('button',{class:'big',onclick:()=>{log('briefing_go',null,{zone:z.id});go();}},t(UI.goDrop)+' 🎬'));c.append(b);}
function restart(){closeOv();closePanel();clearInterval(clockId);HOST.stop();S.phase='intro';newRun();resetWorld();S.camMode='follow';R.avatar.position.set(0,0,34);refreshAll();$('#jobbar').classList.add('hidden');showIntro(0);}

/* ---------- debug ---------- */
let tTaps=0,tTimer=null;
function showLog(){const c=openOv();const b=h('div',{class:'intro',style:{alignItems:'stretch',textAlign:'left'}});const runs=store.get(RUNKEY,[]);
  b.append(h('h1',{style:{fontSize:'22px'}},esc(t(UI.log))));
  if(S.run&&S.run.started_at){const cr=S.run.credibility||computeCred();const col=cr.band==='Green'?'var(--good)':cr.band==='Amber'?'var(--sun)':'var(--bad)';
    const cv=h('div',{class:'cred'},`<span style="font-size:16px">Credibility <b style="color:${col}">${cr.score} · ${cr.band}</b>${S.run.credibility?'':' (run not finished)'} · mode ${esc(S.mode)}${S.childId?' · ID '+esc(S.childId):''}</span>`);
    if(!cr.flags.length)cv.append(h('span',{},'No flags.'));cr.flags.forEach(f=>cv.append(h('span',{},`${f.id} (${f.points}): ${esc(f.detail)}`)));b.append(cv);}
  const pre=h('pre',{class:'dbg'});pre.textContent=JSON.stringify({current:{run:S.run,job_results:S.run?jobResults():[],events:S.events},saved_runs:runs.length},null,1);b.append(pre);
  const row=h('div',{class:'row'});const msg=h('div',{class:'note'});row.append(h('button',{class:'big alt',onclick:()=>{try{navigator.clipboard.writeText(JSON.stringify(runs,null,1)).then(()=>msg.textContent='Copied',()=>msg.textContent='Select the text above to copy');}catch(e){msg.textContent='Select the text above to copy';}}},t(UI.copyLog)),h('button',{class:'big',onclick:()=>{closeOv();if(S.phase==='intro')showIntro();else if(S.phase==='results')showResults();}},t(UI.close)));b.append(row,msg);c.append(b);}

/* ---------- boot ---------- */
async function boot(){
  let m=null;const qs=new URLSearchParams(location.search);
  if(qs.get('mission')){try{m=await (await fetch(qs.get('mission'))).json();}catch(e){}}
  if(!m){m=JSON.parse($('#mission-data').textContent);}
  S.base=m;applyVersion(makeVersion('boot|'+uuid()));
  if(qs.get('mode')==='ranked'){S.mode='ranked';const F=m.fairPlay;const mins=+(qs.get('mins')||F.slotMin);const grace=+(qs.get('grace')||F.startGraceMin);let st=qs.get('slot')?Date.parse(qs.get('slot')):NaN;const test=isNaN(st);if(test)st=Date.now();
    S.slot={start:st,end:st+mins*60000,grace:grace*60000,key:(test?'test-':'')+new Date(st).toISOString().slice(0,16),test};}
  S.lang=store.get('fsl.lang',qs.get('lang')||'en');if(qs.get('lang'))S.lang=qs.get('lang');if(!['en','hi'].includes(S.lang))S.lang='en';S.sound=store.get('fsl.sound',true);S.suit=store.get('fsl.suit',0)|0;if(S.suit<0||S.suit>3)S.suit=0;
  const hm=/^#beat-(\d{1,6})$/.exec(location.hash);if(hm)S.beat=+hm[1];
  newRun();
  if(typeof THREE==='undefined'||!init3D()){if(typeof THREE==='undefined')document.body.append(h('div',{class:'nogl'},esc(t(UI.noGL))));return;}
  S.camMode='follow';refreshAll();
  $('#lang').onclick=()=>{S.lang=S.lang==='en'?'hi':'en';store.set('fsl.lang',S.lang);if(S.run)S.run.lang=S.lang;refreshAll();
    if(ovEl&&S.learnView&&S.active)showLearn(S.learnView.j,S.learnView.si,S.learnView.peek);else if(S.active&&S.active.setTitle)S.active.setTitle();else if(S.phase==='intro')showIntro();else if(S.phase==='results')showResults();};
  $('#snd').onclick=()=>{S.sound=!S.sound;store.set('fsl.sound',S.sound);if(!S.sound)try{speechSynthesis.cancel();}catch(e){}renderHUD();};
  $('#timer').onclick=()=>{tTaps++;clearTimeout(tTimer);tTimer=setTimeout(()=>tTaps=0,1500);if(tTaps>=5){tTaps=0;showLog();}};
  document.fonts&&document.fonts.ready.then(()=>refreshMarkerLabels());
  if(location.hash==='#debug')showLog();else showIntro();
  window.__fsl={S,R,goToStation,tap,computeCred,makeVersion,applyVersion,planSim,finishJob,rescue};
}
boot();
